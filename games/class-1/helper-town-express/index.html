<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Helper Town Express: a Class 1 science game on People at Work (Nature Window-1, Chapter 10) by Saurabh's Eduverse.">
<title>Helper Town Express | People at Work | Saurabh's Eduverse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#8ED8F8;--sky2:#E6F8FF;--grass:#8BDB5E;--grass2:#55B944;
  --marigold:#FFB627;--yellow:#FFD23F;--green:#1E9E50;--green-d:#13743A;
  --red:#E23D3D;--red-d:#A52424;--pink:#FF6FA5;--violet:#7C5CFF;
  --ink:#23265E;--paper:#FFFDF5;--road:#5E6275;--good:#1E9E50;--bad:#E8505B;
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#34448A;--sky2:#8A76C4;--grass:#4F9E46;--grass2:#387B34}
  :root:not([data-theme="light"]) .sun{background:radial-gradient(circle,#FFFDE7 45%,#E3E3F3 72%);box-shadow:0 0 40px rgba(255,255,255,.45)}
}
:root[data-theme="dark"]{--sky:#34448A;--sky2:#8A76C4;--grass:#4F9E46;--grass2:#387B34}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--sky);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;line-height:1.35}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

/* ---------- living background ---------- */
.scene{position:fixed;inset:0;z-index:0;background:linear-gradient(var(--sky) 0%,var(--sky2) 78%);overflow:hidden}
.sun{position:absolute;top:5vh;right:7vw;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#FFF59D 40%,#FFD23F 72%);box-shadow:0 0 0 14px rgba(255,210,63,.25),0 0 0 30px rgba(255,210,63,.12);animation:sunpulse 4s ease-in-out infinite}
.cloud{position:absolute;left:0;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;top:-24px;left:18px}
.cloud::after{width:64px;height:64px;top:-34px;left:46px}
.c1{top:14vh;animation-duration:52s;animation-delay:-8s}
.c2{top:30vh;--s:.7;animation-duration:70s;animation-delay:-40s}
.c3{top:8vh;--s:.55;animation-duration:44s;animation-delay:-25s}
.bird{position:absolute;top:20vh;left:0;width:26px;height:12px;animation:drift 30s linear infinite;animation-delay:-12s}
.bird::before,.bird::after{content:'';position:absolute;top:0;width:13px;height:10px;border-top:3px solid var(--ink);border-radius:50% 50% 0 0;animation:flap .5s ease-in-out infinite alternate}
.bird::before{left:0;transform-origin:right bottom}.bird::after{right:0;transform-origin:left bottom}
.hills{position:absolute;bottom:0;left:0;width:100%;height:22vh}
@keyframes drift{from{transform:translateX(-160px) scale(var(--s,1))}to{transform:translateX(110vw) scale(var(--s,1))}}
@keyframes flap{to{transform:rotate(18deg)}}
@keyframes sunpulse{50%{transform:scale(1.06)}}

#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s,transform .35s,visibility 0s linear .35s;-webkit-overflow-scrolling:touch}
.screen.show{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .35s}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;border-radius:999px;padding:.7em 1.3em;min-height:52px;font-weight:800;font-size:clamp(1rem,2.6vw,1.2rem);color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .12s,box-shadow .12s,filter .12s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.alt{background:var(--marigold);color:var(--ink);box-shadow:0 5px 0 #C98300}
.btn.alt:active{box-shadow:0 1px 0 #C98300}
.btn.ghostbtn{background:#fff;color:var(--ink);box-shadow:0 5px 0 #B9BEDB}
.btn.ghostbtn:active{box-shadow:0 1px 0 #B9BEDB}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.sm{min-height:44px;font-size:.95rem;padding:.5em 1em}
.btn.big{font-size:clamp(1.25rem,4vw,1.6rem);padding:.75em 1.8em}
@media (hover:hover){.btn:hover{filter:brightness(1.07);transform:translateY(-2px)}.btn:active{transform:translateY(4px)}}
.iconbtn{border:3px solid var(--ink);background:#fff;border-radius:16px;width:48px;height:48px;font-size:1.4rem;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.iconbtn.off{opacity:.5;background:#E0E3EE;text-decoration:line-through}

/* ---------- loading ---------- */
.loadwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.loadwrap .tinku{width:150px}
.loadbar{width:min(320px,80vw);height:22px;border:4px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--marigold) 0 12px,var(--yellow) 12px 24px);animation:load 1.3s ease-out forwards}
.loadtxt{font-weight:800;font-size:1.15rem}
@keyframes load{to{width:100%}}

/* ---------- start ---------- */
.startwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px 26vh;text-align:center}
.brand{font-weight:900;font-size:1rem;background:var(--ink);color:#fff;border-radius:999px;padding:.35em 1em}
.plaque{position:relative;background:var(--paper);border-radius:30px;padding:20px 22px 18px;border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink);max-width:600px;width:100%;animation:swingIn .9s cubic-bezier(.2,1.4,.5,1)}
.plaque::before{content:'';position:absolute;inset:7px;border-radius:21px;border:3px dashed var(--red);pointer-events:none}
.plaque::after{content:'';position:absolute;left:18px;right:18px;top:-18px;height:18px;background:radial-gradient(circle at 50% 100%,var(--marigold) 7px,transparent 8px) 0 0/28px 18px repeat-x}
.title{display:flex;flex-direction:column;align-items:center;font-weight:900;line-height:.95;font-size:clamp(2.3rem,9vw,4.2rem);color:var(--marigold);letter-spacing:.01em;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 8px 0 var(--red)}
.ribbon{margin-top:10px;font-size:.62em;color:#fff;background:var(--green);padding:.12em .7em .2em;border:4px solid var(--ink);border-radius:12px;transform:rotate(-3deg);text-shadow:0 3px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.2em .8em;font-weight:800;font-size:.9rem}
.parade{position:relative;width:min(600px,100%);height:150px;margin-top:6px;overflow:hidden}
.parade .crowd{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-around}
.parade .crowd svg{width:clamp(56px,15vw,86px);height:auto}
.parade .sidewalk{position:absolute;bottom:0;left:0;right:0;height:26px;background:var(--road);border-radius:10px;border:3px solid var(--ink)}
.parade .tinku{position:absolute;bottom:4px;left:0;width:110px;animation:driveby 9s linear infinite;z-index:2}
@keyframes driveby{from{transform:translateX(-140px)}to{transform:translateX(min(640px,100vw))}}
.tagline{font-weight:800;font-size:1.1rem;background:rgba(255,253,245,.85);border-radius:14px;padding:.3em .8em}

/* ---------- tinku + people ---------- */
.tinku{display:block;height:auto;overflow:visible}
.tinku .tk-body{animation:rumble .35s ease-in-out infinite alternate}
.tinku .wheel{transform-box:view-box;animation:spin .9s linear infinite}
@keyframes rumble{to{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.person{display:block;overflow:visible}
.person .arm{transform-box:view-box;transform-origin:80px 86px;animation:wave 1.8s ease-in-out infinite}
.person .eyes{transform-box:view-box;transform-origin:60px 50px;animation:blink 4.2s infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* ---------- map ---------- */
.maphead,.lvhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,253,245,.94);border-bottom:4px solid var(--ink)}
.maphead .brand{font-size:.85rem}
@media (max-width:440px){.maphead .brand{display:none}.maphead .iconbtn{width:44px;height:44px;font-size:1.25rem}}
.mapfoot{text-align:center;margin-top:16px}
.spacer{flex:1}
.starcount{font-weight:900;font-size:1.1rem;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:.2em .7em;white-space:nowrap}
.mapbody{max-width:640px;margin:0 auto;padding:14px 14px 28vh}
.maptitle{text-align:center;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;color:#fff;margin:14px 0 4px;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),0 5px 0 var(--ink)}
.stops{position:relative;margin:10px auto 0;padding:14px 0}
.stops::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:64px;margin-left:-32px;background:var(--road);border-radius:32px;border:4px solid var(--ink)}
.stops::after{content:'';position:absolute;top:18px;bottom:18px;left:50%;width:6px;margin-left:-3px;background:repeating-linear-gradient(#fff 0 16px,transparent 16px 32px)}
.row{position:relative;z-index:1;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;column-gap:14px;min-height:128px}
.node{grid-column:2;grid-row:1;justify-self:center;width:42px;height:42px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.node.ok{background:var(--green);color:#fff}
.node.here{width:92px;height:auto;background:none;border:0;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.stop{grid-row:1;position:relative;cursor:pointer;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .15s}
.row.l .stop{grid-column:1}.row.r .stop{grid-column:3}
.row.l .stop::after,.row.r .stop::after{content:'';position:absolute;top:50%;width:14px;height:6px;margin-top:-3px;background:var(--ink)}
.row.l .stop::after{right:-18px}.row.r .stop::after{left:-18px}
.stop .sico{font-size:2.2rem;line-height:1.1}
.stop b{font-size:clamp(.95rem,3.4vw,1.1rem);line-height:1.15}
.stop .sst{font-size:.95rem;letter-spacing:1px}
.off{filter:grayscale(1);opacity:.3}
.stop.locked{background:#E3E6F0;border-color:#9FA5C0;box-shadow:0 6px 0 #9FA5C0;color:#6B7194}
.stop.cur{background:#FFF4C9;animation:beckon 1.6s ease-in-out infinite}
@keyframes beckon{50%{transform:scale(1.05)}}
.stop.locked:active{animation:shake .4s}
.stickers{margin-top:18px;text-align:center}
.stickers h3{font-size:1.2rem;margin-bottom:8px}
.stk{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stk span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:#E3E6F0;border:3px dashed #9FA5C0}
.stk span.got{background:var(--yellow);border-color:var(--red);animation:pop .5s}
.stk span:not(.got){filter:grayscale(1);opacity:.5}
.teacher{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}

/* ---------- shared panels ---------- */
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:14px}
.guide{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.guide .tinku{width:84px;flex:none}
.bubble{position:relative;flex:1;min-width:0;overflow-wrap:break-word;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:700;font-size:clamp(1rem,3.3vw,1.2rem)}
.guide .bubble::before{content:'';position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--ink);border-left:0}
.spk{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.spk:active{transform:translateY(3px);box-shadow:none}
.src{text-align:center;margin-top:12px;font-weight:800;font-size:.9rem;color:var(--ink);background:rgba(255,253,245,.85);border-radius:12px;padding:.35em .8em;width:fit-content;margin-left:auto;margin-right:auto}
.srctag{display:inline-block;font-weight:800;font-size:.85rem;background:#EDE7FF;border:2px solid var(--violet);color:#4B32C3;border-radius:999px;padding:.15em .7em}
.hint{min-height:2.8em;text-align:center;font-weight:800;font-size:clamp(1rem,3.2vw,1.2rem);margin-top:12px;display:flex;align-items:center;justify-content:center}

/* ---------- level shell ---------- */
.lvhead{flex-wrap:wrap}
.lvtitle{flex:1 1 auto;min-width:0;font-weight:900;font-size:clamp(1.05rem,3.6vw,1.35rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvtitle #lv-icon{margin-right:6px}
@media (max-width:440px){.stopn{display:none}}
.prog{flex:0 1 240px;height:16px;background:#E8EAF6;border-radius:10px;overflow:hidden;border:3px solid var(--ink)}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--green) 0 10px,#2BC46A 10px 20px);transition:width .5s}
@media (max-width:560px){.prog{flex:1 1 100%;order:5}}
@media (max-width:360px){.guide .tinku{width:52px}.guide{gap:8px}.spk{width:42px;height:42px}.guide .bubble{font-size:.92rem;padding:8px 10px}.lvtitle{font-size:.95rem}.lvhead .iconbtn{width:42px;height:42px;font-size:1.15rem}}
.lvbody{max-width:920px;margin:0 auto;padding:14px 14px 60px}

/* ---------- L1 meet street ---------- */
.street{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 4px 34px}
.street::after{content:'';position:absolute;left:-14px;right:-14px;bottom:0;height:30px;background:var(--road);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)}
@media (max-width:640px){.street{grid-template-columns:repeat(2,1fr);row-gap:0}.street .house{margin-bottom:10px}}
.house{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;align-self:end}
.house .roof{width:100%;height:46px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.house .walls{width:88%;background:var(--wall);border:4px solid var(--ink);border-bottom:0;display:flex;flex-direction:column;align-items:center;padding:8px 6px 0}
.hsign{font-weight:900;font-size:clamp(.72rem,2.6vw,.9rem);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;margin-bottom:8px;white-space:nowrap}
.door{position:relative;width:74%;aspect-ratio:3/4;background:#FFF3C4;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;perspective:500px;overflow:hidden}
.door .peek{position:absolute;inset:8% 4% 0}
.door .peek svg{width:100%;height:100%}
.door-panel{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,#A1662F,#C98A4B);border-radius:9px 9px 0 0;transform-origin:left center;transition:transform .55s cubic-bezier(.3,1.3,.6,1);animation:knock 3s ease-in-out infinite;animation-delay:var(--d)}
.door-panel::before{content:'';position:absolute;inset:12% 16% 50%;border:3px solid rgba(35,38,94,.35);border-radius:6px}
.door-panel::after{content:'';position:absolute;right:12%;top:55%;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink)}
.house.open .door-panel{transform:rotateY(-100deg);animation:none}
@keyframes knock{0%,86%,100%{transform:rotateY(0)}90%{transform:rotateY(-14deg)}94%{transform:rotateY(0)}97%{transform:rotateY(-8deg)}}
.house .tick{position:absolute;top:28px;right:0;font-size:1.8rem;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.5,1);z-index:3}
.house.met .tick{transform:scale(1)}
@media (hover:hover){.house:hover .roof{filter:brightness(1.1)}}
.meet{display:flex;flex-direction:column;align-items:center;gap:12px}
.meet-art svg{width:150px;height:auto;animation:slideUp .5s cubic-bezier(.2,1.4,.5,1)}
.bubble.big{text-align:center;font-size:clamp(1.2rem,4.4vw,1.55rem);width:100%}
.bubble.big::before{content:'';position:absolute;top:-16px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:14px solid var(--ink);border-top:0}
.ln{opacity:0;transform:translateY(8px);animation:lineIn .4s forwards;animation-delay:calc(var(--i)*.75s + .2s)}
@keyframes lineIn{to{opacity:1;transform:none}}

/* ---------- options (L2, L7) ---------- */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{cursor:pointer;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:8px 6px 10px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:clamp(.85rem,3vw,1.1rem);line-height:1.15;transition:transform .15s,background .2s;touch-action:manipulation}
.opt svg{width:100%;max-width:110px;height:auto;aspect-ratio:3/4}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:#D7F8E0;border-color:var(--good);box-shadow:0 5px 0 var(--good);animation:pop .45s}
.opt.wrong{background:#FFE0E3;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);opacity:.6;animation:shake .45s}
.whoami .mystery{display:flex;align-items:center;gap:12px}
.mys-card{flex:none;width:92px;height:118px;border:4px dashed var(--violet);border-radius:18px;background:#EDE7FF;display:grid;place-items:center;font-size:3rem}
.mys-card svg{width:88px;height:auto;animation:pop .5s}
.qmark{animation:wobble 1.4s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.whoami .bubble{animation:pop .4s}
.whoami .bubble::before{content:'';position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--ink);border-left:0}
.ask{text-align:center;font-weight:900;font-size:clamp(1.3rem,5vw,1.8rem);margin:12px 0 10px}

/* ---------- L3 match ---------- */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(34px,8vw,90px)}
.mcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.ml{fill:none;stroke-width:6;stroke-linecap:round}
.ml.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:dash .6s ease-out forwards}
.ml.bad{stroke-dasharray:10 8}
@keyframes dash{to{stroke-dashoffset:0}}
.mcard{cursor:pointer;display:flex;align-items:center;gap:8px;min-height:84px;width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:6px 10px;text-align:left;font-weight:800;font-size:clamp(.9rem,3.2vw,1.15rem);line-height:1.15;transition:transform .15s,background .2s;touch-action:manipulation}
.mcard .person{width:48px;height:64px;flex:none}
.mcard em{font-style:normal;font-size:1.8rem;flex:none}
.mcard{position:relative}
.mcard .dot{position:absolute;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink);z-index:3}
.wk .dot{right:-14px}
.wo .dot{left:-14px}
.wo{padding-left:16px}
.mcard.sel{background:#FFF4C9;transform:scale(1.04);border-color:var(--marigold);box-shadow:0 4px 0 #C98300}
.mcard.matched{background:#F0FFF4;border-color:var(--mc);box-shadow:0 4px 0 var(--mc);cursor:default}
.mcard.matched .dot{background:var(--mc);box-shadow:0 0 0 3px var(--mc)}
@media (max-width:480px){.mcard{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 8px}.wo{padding-left:8px}.mcard .person{width:42px;height:56px}}

/* ---------- L4 fix-it ---------- */
.cartzone{display:flex;justify-content:center;padding:6px 0 14px}
.cart{cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFF4C9;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px 18px;min-width:220px;max-width:92%;text-align:center}
.cart.enter{animation:rollIn .6s cubic-bezier(.2,1.3,.5,1)}
.cart.gone{opacity:0}
.cart.lifted{opacity:.35}
.big-e{font-size:3.4rem;line-height:1.1;animation:bob 1.6s ease-in-out infinite}
.it-t{font-weight:900;font-size:clamp(1.05rem,3.8vw,1.35rem)}
.drag-hint{font-size:.85rem;font-weight:700;opacity:.75}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.bins{grid-template-columns:repeat(2,1fr)}}
.bin{cursor:pointer;background:#fff;border:4px solid var(--ink);border-radius:18px 18px 10px 10px;box-shadow:0 5px 0 var(--ink);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:clamp(.85rem,3vw,1.05rem);line-height:1.1;text-align:center;position:relative;transition:transform .15s,background .15s;touch-action:manipulation}
.bin::before{content:'';position:absolute;top:-4px;left:-4px;right:-4px;height:14px;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 16px,#fff 16px 32px);border:4px solid var(--ink);border-bottom:0}
.bin .person{width:72px;height:96px;margin-top:10px}
.bin.hover{background:#FFF4C9;transform:scale(1.06)}
.bin.happy{background:#D7F8E0;animation:pop .5s}
.bin.nope{background:#FFE0E3}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.05) rotate(-4deg);margin:0;min-width:0;box-shadow:0 14px 24px rgba(35,38,94,.35);animation:none!important}
.flyer{position:fixed;z-index:85;margin:0;pointer-events:none;transition:transform .55s ease-in,opacity .55s ease-in;animation:none!important}
.snip{display:flex;flex-direction:column;align-items:center;gap:10px}
.snip .person{width:120px;height:auto}
.snip-tag{font-weight:900;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:.2em .9em}

/* ---------- L5 word train ---------- */
.wt{text-align:center}
.track{position:relative;padding:18px 0 30px;overflow:hidden;min-height:150px;display:flex;align-items:flex-end;justify-content:center}
.track::after{content:'';position:absolute;left:0;right:0;bottom:6px;height:12px;background:repeating-linear-gradient(90deg,#8D6E63 0 8px,transparent 8px 22px),linear-gradient(transparent 3px,var(--ink) 3px,var(--ink) 6px,transparent 6px)}
.train{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:16px 6px;position:relative;z-index:1;max-width:100%}
.train.in{animation:trainIn .8s cubic-bezier(.2,1.1,.5,1)}
.train.out{animation:trainOut .7s ease-in forwards}
@keyframes trainIn{from{transform:translateX(110%)}to{transform:none}}
@keyframes trainOut{to{transform:translateX(-120%)}}
.engine{font-size:3.2rem;line-height:1;transform:scaleX(-1);display:inline-block}
.coach{position:relative;background:var(--c);color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:14px 14px 6px 6px;padding:10px 12px 14px;margin-bottom:10px;font-size:clamp(1.05rem,3.6vw,1.45rem);line-height:1.2;text-shadow:0 2px 0 rgba(35,38,94,.5)}
.coach::after{content:'';position:absolute;left:10px;right:10px;bottom:-12px;height:14px;background:radial-gradient(circle,var(--ink) 6px,transparent 7px) left/14px 14px no-repeat,radial-gradient(circle,var(--ink) 6px,transparent 7px) right/14px 14px no-repeat}
.coach.blank{background:#fff;color:var(--violet);border-style:dashed;min-width:118px;text-shadow:none}
.coach.blank.hover{background:#EDE7FF}
.coach.blank.filled{background:var(--yellow);color:var(--ink);border-style:solid;animation:pop .45s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.tile{cursor:grab;touch-action:none;min-height:58px;padding:.4em 1.2em;border-radius:16px;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:clamp(1.1rem,4vw,1.4rem)}
.tile.lifted{opacity:.35}
.tile.wrong{background:#FFE0E3;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);opacity:.5;animation:shake .45s;cursor:default}
.tile.used{visibility:hidden}

/* ---------- L6 family ---------- */
.fam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.fam-grid{grid-template-columns:repeat(3,1fr)}}
.chip{cursor:pointer;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:clamp(.85rem,3vw,1.05rem);line-height:1.1;text-align:center;min-height:86px;justify-content:center;touch-action:manipulation}
.chip em{font-style:normal;font-size:2rem}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.fam-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.fam-list span{display:inline-flex;align-items:center;gap:6px;background:#FFF4C9;border:3px solid var(--ink);border-radius:999px;padding:.25em .4em .25em .8em;font-weight:800}
.fam-list button{border:0;background:var(--red);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:900}
.other{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.other input,.namebox input{font:inherit;font-weight:800;font-size:1.1rem;border:4px solid var(--ink);border-radius:14px;padding:.45em .7em;min-height:52px;width:min(260px,100%);color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.center{text-align:center}
.center .btn{margin-top:14px}
.tycard{position:relative;margin:14px auto 0;max-width:460px;background:#fff;border:5px solid var(--ink);border-radius:20px;padding:34px 18px 18px;text-align:center;box-shadow:0 8px 0 var(--pink);animation:pop .5s}
.tycard::before{content:'';position:absolute;top:0;left:0;right:0;height:22px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,var(--marigold) 25%,transparent 25%) -11px 0/22px 22px,linear-gradient(225deg,var(--green) 25%,transparent 25%) -11px 0/22px 22px}
.tycard h3{font-size:clamp(1.25rem,4.4vw,1.6rem);color:var(--red);margin-bottom:10px}
.tycard ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:clamp(1.05rem,3.8vw,1.3rem);font-weight:800}
.tycard .respect{margin-top:12px;font-weight:900;color:var(--green);font-size:1.15rem}
.tycard .from{margin-top:8px;font-weight:800}
.namebox{display:flex;justify-content:center;margin-top:12px}

/* ---------- L7 boss ---------- */
.bosstop{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.hearts{font-size:1.7rem;letter-spacing:4px}
.heart{display:inline-block}
.heart.lost{animation:heartbreak .6s forwards}
@keyframes heartbreak{40%{transform:scale(1.4)}100%{transform:scale(.9);filter:grayscale(1);opacity:.3}}
.bcount{background:var(--ink);color:#fff;border-radius:999px;padding:.2em .8em}
.ride{position:relative;height:104px;margin:10px 0 14px;background:var(--road);border:4px solid var(--ink);border-radius:18px;overflow:hidden}
.ride::before{content:'';position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px)}
.ride .flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:2.6rem;animation:bob 2s ease-in-out infinite}
.ride .tk{position:absolute;bottom:2px;left:calc(var(--p,0)*(100% - 170px) + 6px);width:100px;transition:left .9s cubic-bezier(.3,1.4,.6,1)}
.bq{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 12px;margin-bottom:12px}
.bq-e{font-size:2.8rem;flex:none;animation:bob 1.6s ease-in-out infinite}
.bq-t{flex:1;font-weight:900;font-size:clamp(1.1rem,3.9vw,1.45rem)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfb em{font-style:normal;font-size:3rem}
.tfb span{font-size:1.3rem}
.bfb{min-height:3.2em;margin-top:12px;text-align:center;font-weight:800;font-size:clamp(1rem,3.4vw,1.2rem);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(35,38,94,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.mbox{position:relative;background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:22px 18px;text-align:center;animation:popIn .45s cubic-bezier(.2,1.5,.5,1)}
.mbox h2{font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.1;margin:4px 0 8px}
.mbox p{font-weight:700;font-size:clamp(1rem,3.4vw,1.15rem)}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.intro .tinku{width:150px;margin:0 auto}
.stopno{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:.15em .9em;margin-top:6px}
.goal{background:#FFF4C9;border:3px solid var(--ink);border-radius:14px;padding:.5em .8em;margin:8px 0 6px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:6px 0}
.bigstars span{font-size:3.2rem;transform:scale(0);animation:starIn .5s cubic-bezier(.2,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.35s + .3s)}
@keyframes starIn{to{transform:scale(1)}}
.sticker{margin:12px auto 4px;width:88px;height:88px;border-radius:50%;background:var(--yellow);border:4px dashed var(--red);display:grid;place-items:center;font-size:2.8rem;animation:spinIn .8s cubic-bezier(.2,1.4,.5,1) 1.2s both}
@keyframes spinIn{from{transform:rotate(-200deg) scale(0)}to{transform:none}}
.cert{margin-top:14px;border:4px double var(--ink);border-radius:18px;padding:12px;background:linear-gradient(#FFF8E1,#FFFDF5)}
.cert .cname{font-size:1.6rem;font-weight:900;color:var(--red)}
.certbadges{font-size:1.6rem;letter-spacing:4px;margin-top:6px}

#toast{position:fixed;left:50%;bottom:24px;z-index:95;transform:translate(-50%,160%);background:var(--ink);color:#fff;font-weight:800;padding:.7em 1.2em;border-radius:16px;max-width:90vw;text-align:center;transition:transform .35s cubic-bezier(.2,1.4,.5,1),visibility 0s linear .35s;pointer-events:none;visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .35s cubic-bezier(.2,1.4,.5,1)}

.spark{position:fixed;z-index:88;pointer-events:none;font-size:1.4rem;transform:translate(-50%,-50%);animation:spark .85s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes swingIn{from{transform:translateY(-60px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rollIn{from{transform:translateX(-80px) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.shake{animation:shake .45s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cloud,.bird,.parade .tinku{display:none}
}

</style>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const starsFor=m=>m<=1?3:m<=3?2:1;

/* =================== SAVE =================== */
const KEY='eduverse_c1_people_at_work_v1';
const DEF={stars:{},unlocked:1,all:false,sound:true,voice:true,family:[],kid:'',welcomed:false};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign(JSON.parse(JSON.stringify(DEF)),o)}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* =================== SOUND =================== */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,when){if(!S.sound)return;const a=ac();if(!a)return;try{const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.14,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+(d||.12)+.05)}catch(e){}}
const SFX={
  tap:()=>tone(660,.07,'triangle',.1),
  good:()=>[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.09)),
  bad:()=>{tone(240,.16,'sine',.12);tone(190,.22,'sine',.1,.12)},
  star:i=>tone(880+i*220,.22,'sine',.14),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.12)),
  horn:()=>{tone(470,.1,'square',.05);tone(470,.13,'square',.05,.17)},
  knock:()=>{tone(170,.06,'square',.08);tone(170,.06,'square',.08,.15)}
};

/* =================== VOICE =================== */
let VOICE=null,SPEAK='';
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t,force){if(!('speechSynthesis' in window))return;if(!S.voice&&!force)return;try{speechSynthesis.cancel();const clean=String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/_+/g,' blank ');const u=new SpeechSynthesisUtterance(clean);if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:'en-IN';u.rate=.88;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function setSpeak(t){SPEAK=t}
document.addEventListener('click',e=>{const b=e.target.closest('.spk-now');if(b){say(SPEAK,true)}});

/* =================== FX =================== */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
const RM=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){n=n||130;if(RM())n=25;const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const cols=['#FFB627','#E23D3D','#1E9E50','#FF6FA5','#4FC3F7','#FFD23F','#7C5CFF'];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*4*dpr,vy:(2+Math.random()*4)*dpr,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:(6+Math.random()*8)*dpr,h:(4+Math.random()*6)*dpr,c:cols[i%cols.length],life:0,g:.05*dpr});
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.y<cv.height+40&&p.life<420);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
function sparkle(el){if(!el)return;const r=el.getBoundingClientRect();for(let k=0;k<6;k++){const s=document.createElement('span');s.className='spark';s.textContent=k%2?'⭐':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';const a=Math.PI*2*k/6;s.style.setProperty('--dx',Math.cos(a)*75+'px');s.style.setProperty('--dy',Math.sin(a)*75+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function fly(src,dst){const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();const c=src.cloneNode(true);c.removeAttribute('id');c.classList.add('flyer');Object.assign(c.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(c);src.classList.add('gone');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.25)`;c.style.opacity='0'}));setTimeout(()=>c.remove(),700)}
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* =================== ART =================== */
const TINKU=`<svg class="tinku" viewBox="0 0 150 112" aria-hidden="true"><g class="tk-body">

let CUR=null,timers=[],cleanups=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function onClean(fn){cleanups.push(fn)}
function clean(){timers.forEach(clearTimeout);timers=[];cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];$$('.ghost,.flyer').forEach(g=>g.remove());hush()}
function isUnlocked(n){return n>=1&&n<=7}
function totalStars(){return LEVELS.reduce((s,L)=>s+(S.stars[L.id]||0),0)}
function currentStop(){for(let n=1;n<=7;n++){if(isUnlocked(n)&&!S.stars[n])return n}return 0}
function setProg(f){$('#lv-prog').style.width=Math.round(Math.max(0,Math.min(1,f))*100)+'%'}

/* ---------- modal ---------- */
function modal(html){const m=$('#modal');$('#mbox').innerHTML=html;m.hidden=false;const f=$('#mbox button');if(f){try{f.focus({preventScroll:true})}catch(e){}}}
function closeModal(){$('#modal').hidden=true;$('#mbox').innerHTML=''}
function bindActs(map){$$('#mbox [data-act]').forEach(b=>{b.addEventListener('click',()=>{SFX.tap();const fn=map[b.dataset.act];if(fn)fn()})})}

/* ---------- screens ---------- */
function show(id){$$('.screen').forEach(s=>s.classList.toggle('show',s.id===id));const el=$('#'+id);if(el)el.scrollTop=0}

function goMap(){clean();closeModal();CUR=null;renderMap();show('map')}

function renderMap(){
  const cs=currentStop();
  $('#stops').innerHTML=LEVELS.map((L,i)=>{const n=L.id,open=isUnlocked(n),st=S.stars[n]||0,here=n===cs;
    return `<div class="row ${i%2?'r':'l'}"><span class="node ${here?'here':''} ${st&&!here?'ok':''}">${here?TINKU:(st?'✔':n)}</span><button class="stop ${open?'open':'locked'} ${here?'cur':''}" data-n="${n}" aria-label="Stop ${n}: ${L.title}${open?'':' (locked)'}"><span class="sico">${open?L.icon:'🔒'}</span><b>${L.title}</b><span class="sst">${'⭐'.repeat(st)}<span class="off">${'⭐'.repeat(3-st)}</span></span></button></div>`}).join('');
  $$('#stops .stop').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.n;if(isUnlocked(n)){SFX.tap();openLevel(n)}else{SFX.bad();const m=`Finish stop ${n-1} first to open this stop!`;toast('🔒 '+m);say(m)}}));
  $('#total-stars').textContent=totalStars();
  $('#stk').innerHTML=LEVELS.map(L=>`<span class="${S.stars[L.id]?'got':''}" title="${L.badge}" aria-label="${L.badge} sticker ${S.stars[L.id]?'earned':'not earned yet'}">${L.icon}</span>`).join('');
  const msg=cs?(cs===1&&!S.stars[1]?'Hi! I am Tinku the Tuk-Tuk. Many people help us every day. Hop on, let us meet them!':`Hop on! Next stop: ${LEVELS[cs-1].title}.`):'Wow! You are a Helper Hero! Play any stop again to win more stars.';
  $('#map-guide').innerHTML=`<div class="guide">${TINKU}<p class="bubble">${msg}</p><button class="spk" data-msg="1" aria-label="Hear it">🔊</button></div>`;
  $('#map-guide .spk').onclick=()=>say(msg,true);
  $('#tg-sound').textContent=S.sound?'🔊':'🔇';$('#tg-sound').classList.toggle('off',!S.sound);
  $('#tg-voice').classList.toggle('off',!S.voice);
  return msg;
}

function openLevel(n){
  if(!isUnlocked(n))return;
  clean();closeModal();
  const L=LEVELS[n-1];CUR={id:n,icon:L.icon,title:L.title,badge:L.badge,done:false};
  $('#lv-icon').textContent=L.icon;$('#lv-name').innerHTML=`<span class="stopn">Stop ${n}: </span>${L.title}`;$('#toast').classList.remove('show');
  setProg(0);$('#lv-body').innerHTML='';show('level');
  setSpeak(`Stop ${n}. ${L.title}. ${L.goal}`);
  modal(`<div class="intro">${TINKU}<p class="stopno">Stop ${n} of 7</p><h2>${L.icon} ${L.title}</h2><p class="goal">🎯 ${L.goal}</p><div class="mbtns"><button class="btn" data-act="go">Let's go! 🛺</button><button class="btn ghostbtn" data-act="map">🗺️ Map</button></div></div>`);
  SFX.horn();say(SPEAK);
  bindActs({go:()=>{closeModal();RUN[n]($('#lv-body'))},map:goMap});
}

function finish(stars){
  if(!CUR||CUR.done)return;CUR.done=true;
  const n=CUR.id;S.stars[n]=Math.max(S.stars[n]||0,stars);
  if(n===S.unlocked&&n<7)S.unlocked=n+1;
  save();setProg(1);
  later(()=>{
    SFX.win();confetti();
    for(let k=0;k<stars;k++)later(()=>SFX.star(k),650+k*350);
    const head=stars===3?'Superstar! 🌟':stars===2?'Great job! 👏':'Well done! 👍';
    const sub=stars===3?'You won all 3 stars!':'Play again to win all 3 stars.';
    const last=n===7;
    modal(`<div class="done"><h2>${head}</h2><div class="bigstars">${[0,1,2].map(k=>`<span class="${k<stars?'':'off'}" style="--i:${k}">⭐</span>`).join('')}</div><p>${sub}</p><div class="sticker">${CUR.icon}</div><p>New sticker: <b>${CUR.badge}</b></p>${last?heroCert():''}<div class="mbtns">${last?'':'<button class="btn" data-act="next">Next stop 🛺</button>'}<button class="btn alt" data-act="again">🔁 Play again</button><button class="btn ghostbtn" data-act="map">🗺️ Map</button></div></div>`);
    say(`${head.replace(/[^A-Za-z! ]/g,'')} You won ${stars} star${stars>1?'s':''}. New sticker: ${CUR.badge}.${last?' You are a Helper Hero! All these people help us. We should respect them.':''}`);
    bindActs({next:()=>openLevel(n+1),again:()=>openLevel(n),map:goMap});
  },500);
}

/* ---------- drag helper (pointer events; tap still works) ---------- */
function makeDrag(el,targetSel,onDrop){
  let st=null,ghost=null,moved=false,over=null;
  const end=()=>{if(ghost){ghost.remove();ghost=null}el.classList.remove('lifted');if(over){over.classList.remove('hover');over=null}st=null};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;st={x:e.clientX,y:e.clientY,id:e.pointerId};moved=false});
  el.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;

      const m=q.t==='pick'?`The right helper is the ${H[q.a].label.toLowerCase()}. ${H[q.a].fact}`:(q.a?'It is true! ':'It is false! ')+q.why;
      fb.innerHTML=`<span>💡 ${m}</span>`;say(m);
      if(hearts<=0){later(()=>{modal(`<div><div style="font-size:4rem">😴</div><h2>Tinku needs a rest!</h2><p>You used all 3 hearts. Let us try the ride again. You can do it!</p><div class="mbtns"><button class="btn" data-act="retry">🔁 Try again</button><button class="btn ghostbtn" data-act="map">🗺️ Map</button></div></div>`);say('Tinku needs a rest! Let us try again. You can do it!');bindActs({retry:()=>openLevel(7),map:goMap})},2400)}
      else{const nb=document.createElement('button');nb.className='btn alt';nb.textContent='Next ▶';nb.addEventListener('click',()=>{SFX.tap();i++;move();ask()});fb.appendChild(nb)}
    }
  }
  move();ask();
}

const RUN={1:L1,2:L2,3:L3,4:L4,5:L5,6:L6,7:L7};

/* =================== BOOT =================== */
$('#load-tk').innerHTML=TINKU;$('#parade-tk').innerHTML=TINKU;
$('#crowd').innerHTML=['doctor','postman','police','teacher'].map(person).join('');
$('#go-start').addEventListener('click',()=>{ac();SFX.horn();renderMap();show('map');
  if(!S.welcomed){S.welcomed=true;save()}
  later(()=>say(renderMap()),300)});
$('#to-home').addEventListener('click',()=>{SFX.tap();clean();show('start')});
$('#lv-back').addEventListener('click',()=>{SFX.tap();goMap()});
$('#tg-sound').addEventListener('click',()=>{S.sound=!S.sound;save();ac();SFX.tap();renderMap()});
$('#tg-voice').addEventListener('click',()=>{S.voice=!S.voice;save();SFX.tap();if(!S.voice)hush();toast(S.voice?'🗣️ Read aloud is on':'🗣️ Read aloud is off');renderMap()});
$('#t-reset').addEventListener('click',()=>{SFX.tap();modal(`<div><div style="font-size:3rem">↺</div><h2>Start over?</h2><p>This clears all stars, stickers and the family card on this device.</p><div class="mbtns"><button class="btn red" data-act="yes">Yes, start over</button><button class="btn ghostbtn" data-act="no">Cancel</button></div></div>`);bindActs({yes:()=>{const keep={sound:S.sound,voice:S.voice};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);save();closeModal();renderMap();toast('↺ Fresh start!')},no:closeModal})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){const b=$('#mbox [data-act="no"],#mbox [data-act="map"]');if(b)b.click()}});
addEventListener('resize',()=>{if(raf){const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}});
setTimeout(()=>show('start'),1400);

window.__helperTown={H,Q2,R4,Q5,Q7,LEVELS,state:()=>S,open:openLevel};
})();

</script>
