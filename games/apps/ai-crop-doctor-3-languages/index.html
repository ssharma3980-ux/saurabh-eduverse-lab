<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Crop Doctor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Zilla+Slab:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap">
<style>
/* Layout: a deep-field green band with the school logo, a short hero, then one working column that walks
   Crop → Leaf photo → Signs → Diagnosis, like a field notebook. Turmeric yellow marks actions; red/amber/green mark severity only. */
:root{
  --band:#1E4A2C; --band-2:#2C6A3E; --band-fg:#FFFFFF; --band-dim:#C9DCC9;
  --bg:#F3F6EF; --panel:#FFFFFF; --line:#D7DFD0; --fg:#18251B; --dim:#596657; --soft:#E7EEE1;
  --accent:#E3A21A; --accent-ink:#8A5A00; --on-accent:#1E2A12;
  --leaf:#3F8F4A; --yellow:#E9C82E; --brown:#9A4B22; --good:#2E7D32; --warn:#A86A00; --bad:#B3261E;
  --display:"Zilla Slab","Noto Sans Devanagari","Noto Sans Gujarati",Rockwell,Georgia,serif; --body:"Lexend","Noto Sans Devanagari","Noto Sans Gujarati","Nirmala UI",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --band:#102A18; --band-2:#1B3F26; --band-fg:#FFFFFF; --band-dim:#A9C3AB;
  --bg:#0F1A12; --panel:#17251A; --line:#2C4031; --fg:#E8F0E6; --dim:#A6B6A5; --soft:#203324;
  --accent:#F0B43A; --accent-ink:#F6C766; --on-accent:#1E2A12;
  --leaf:#6CC077; --yellow:#F2D650; --brown:#D07A4B; --good:#6FD38A; --warn:#F2B957; --bad:#FF8A80; color-scheme:dark } }
:root[data-theme="dark"]{
  --band:#102A18; --band-2:#1B3F26; --band-fg:#FFFFFF; --band-dim:#A9C3AB;
  --bg:#0F1A12; --panel:#17251A; --line:#2C4031; --fg:#E8F0E6; --dim:#A6B6A5; --soft:#203324;
  --accent:#F0B43A; --accent-ink:#F6C766; --on-accent:#1E2A12;
  --leaf:#6CC077; --yellow:#F2D650; --brown:#D07A4B; --good:#6FD38A; --warn:#F2B957; --bad:#FF8A80; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.6 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.65rem} h3{font-size:1.2rem}
p{margin:0} a{color:var(--accent-ink)}
.wrap{max-width:1060px;margin:0 auto;padding-inline:20px}
.band{background:linear-gradient(160deg,var(--band) 0%,var(--band) 55%,var(--band-2) 100%);color:var(--band-fg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.top img{height:52px;width:auto;display:block}
.brand{font:700 1.2rem var(--display);text-align:end}
.brand small{display:block;font:400 .78rem var(--body);color:var(--band-dim)}
.hero{padding-block:22px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--band-dim);font-size:1.08rem;margin-top:12px;max-width:36em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.steps b{display:block} .steps small{color:var(--band-dim)}
main{padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.num{font:700 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.dim{color:var(--dim)} .small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .between{justify-content:space-between}
.btn{font:700 .98rem var(--body);background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.band .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,label:focus-within,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.crops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.crop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:500 .95rem var(--body);cursor:pointer}
.crop svg{width:44px;height:44px}
.crop.on{border-color:var(--leaf);background:var(--soft);font-weight:700}
.crop small{color:var(--dim);font-weight:400;font-size:.78rem}
.photo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.1fr);gap:16px;align-items:start}
.cv{display:flex;flex-direction:column;gap:6px;min-width:0}
.cv canvas{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#FFFFFF}
.cv span{font-size:.82rem;color:var(--dim)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.drop.over{border-color:var(--leaf);background:var(--soft)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.legend{display:grid;gap:6px;font-size:.9rem}
.legend div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.legend b{font-variant-numeric:tabular-nums}
.sw{width:14px;height:14px;border-radius:3px}
.meterline{font-weight:700}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.group h3{font-size:1.02rem;margin-bottom:8px;font-family:var(--body);font-weight:700}
.sym{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sym:hover{background:var(--soft)}
.sym input{width:19px;height:19px;margin-top:3px;accent-color:var(--leaf);flex:none}
.sym.on{background:var(--soft);border-color:var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:500 .9rem var(--body);border:0;background:var(--bg);color:var(--fg);padding:8px 14px;cursor:pointer;border-inline-start:1.5px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--leaf);color:#fff}
.sugg{border-inline-start:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:6px;font-size:.93rem}
.dx{display:grid;gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;background:var(--bg)}
.card.top1{border:2px solid var(--leaf)}
.card .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pill{display:inline-block;font:700 .74rem var(--body);letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.l{border-color:var(--good);color:var(--good)} .pill.p{border-color:var(--warn);color:var(--warn)} .pill.u{border-color:var(--dim)}
.conf{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center}
.conf .bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.conf .bar b{display:block;height:100%;background:var(--leaf)}
.conf strong{font-variant-numeric:tabular-nums;text-align:end}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cols h4{margin:0 0 6px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.cols ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.93rem}
.empty{text-align:center;padding:26px;color:var(--dim)}
.ai{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.how div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);display:grid;gap:4px;align-content:start}
.how b{font-family:var(--display);font-size:1.05rem}
.safe{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1.5px solid var(--accent);border-radius:12px;padding:16px;background:var(--soft)}
.phone{font:700 1.3rem var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.93rem}
footer{border-top:1px solid var(--line);padding-block:22px 36px;color:var(--dim);font-size:.85rem}
@media (max-width:820px){
  .hero,.photo,.groups,.cols,.how{grid-template-columns:minmax(0,1fr)}
  .crops{grid-template-columns:repeat(3,minmax(0,1fr))}
  .photo .cv{max-width:420px}
  .top img{height:42px} .panel{padding:16px} .brand small{display:none}
  .safe{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .conf .bar b,.stack i{transition:width .5s ease} }
.hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.langs{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang{background:transparent;color:#fff;border:0;border-inline-start:1px solid rgba(255,255,255,.25);padding:6px 11px;font:500 .9rem var(--body);cursor:pointer}
.lang:first-child{border-inline-start:0}
.lang.on{background:var(--accent);color:var(--on-accent);font-weight:700}
html:not([lang=en]) body{line-height:1.75}
html:not([lang=en]) :is(.num,.cols h4,.pill){letter-spacing:0;text-transform:none}
html:not([lang=en]) .hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.35}
html:not([lang=en]) :is(h2,h3){line-height:1.4}
</style>

<header class="band" id="hdr"></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="ftr"></div></footer>
<script>
const LANGS={en:'English',hi:'हिन्दी',gu:'ગુજરાતી'};
let LANG='en';const TR={"hi": {"Science project · Hanifa School, Borsad": "विज्ञान प्रोजेक्ट · हनीफ़ा स्कूल, बोरसद", "Is your crop sick?": "क्या आपकी फ़सल बीमार है?", "Find out in three steps.": "तीन चरणों में पता करें।", "Choose the crop, show a photo of the leaf, and tick the signs you see. AI Crop Doctor names the most likely problem, explains why, and tells you what to do today and how to prevent it next season.": "फ़सल चुनें, पत्ती की फ़ोटो दिखाएँ और जो लक्षण दिखें उन पर टिक करें। AI क्रॉप डॉक्टर सबसे संभावित समस्या बताता है, कारण समझाता है, और बताता है कि आज क्या करें और अगले मौसम में इससे कैसे बचें।", "Load the sample case": "नमूना केस खोलें", "Start fresh": "नए सिरे से शुरू करें", "Choose the crop": "फ़सल चुनें", "Tomato, cotton, groundnut, wheat or rice": "टमाटर, कपास, मूँगफली, गेहूँ या धान", "Check the leaf photo": "पत्ती की फ़ोटो जाँचें", "Measures green, yellow and brown areas": "हरा, पीला और भूरा हिस्सा मापता है", "Tick the signs": "लक्षणों पर टिक करें", "Get the likely problem and what to do": "संभावित समस्या और उपाय पाएँ", "Step 1": "चरण 1", "Which crop is sick?": "कौन-सी फ़सल बीमार है?", "Step 2": "चरण 2", "Optional, but it helps": "वैकल्पिक, पर इससे मदद मिलती है", "Place one leaf on <b>plain white paper</b> in daylight and take a photo from above. Then choose it here or drag it in.": "एक पत्ती को <b>सादे सफ़ेद काग़ज़</b> पर दिन की रोशनी में रखें और ऊपर से फ़ोटो लें। फिर उसे यहाँ चुनें या खींचकर लाएँ।", "Choose photo": "फ़ोटो चुनें", "Use sample leaf": "नमूना पत्ती लें", "Your photo": "आपकी फ़ोटो", "Colour map: where the damage is": "रंग नक्शा: नुक़सान कहाँ है", "No leaf found. Use a photo of a leaf on white paper.": "कोई पत्ती नहीं मिली। सफ़ेद काग़ज़ पर रखी पत्ती की फ़ोटो लें।", "Healthy green": "स्वस्थ हरा", "Yellowing": "पीलापन", "Brown or dead": "भूरा या मरा हुआ", "Looks mostly healthy": "ज़्यादातर स्वस्थ दिखती है", "Moderate damage": "मध्यम नुक़सान", "Severe damage": "गंभीर नुक़सान", "{0}% of the leaf is affected": "पत्ती का {0}% हिस्सा प्रभावित है", "The photo shows brown patches and yellowing.": "फ़ोटो में भूरे धब्बे और पीलापन दिख रहा है।", "The photo shows brown patches.": "फ़ोटो में भूरे धब्बे दिख रहे हैं।", "The photo shows yellowing.": "फ़ोटो में पीलापन दिख रहा है।", "Tick matching signs": "मिलते लक्षणों पर टिक करें", "This measures colour only. It cannot name the disease by itself; the signs in Step 3 do that.": "यह केवल रंग मापता है। यह अकेले बीमारी का नाम नहीं बता सकता; चरण 3 के लक्षण यह काम करते हैं।", "Ask AI to look at this photo": "AI से इस फ़ोटो को देखने को कहें", "Looking…": "देख रहा है…", "Ask AI (needs internet)": "AI से पूछें (इंटरनेट चाहिए)", "Sends the photo and your ticked signs to Claude, an AI model that can read images, for a second opinion.": "फ़ोटो और आपके चुने लक्षण Claude को भेजता है, जो तस्वीरें पढ़ सकने वाला एक AI मॉडल है, ताकि दूसरी राय मिल सके।", "Looking at the photo. This can take up to a minute.": "फ़ोटो देखी जा रही है। इसमें एक मिनट तक लग सकता है।", "AI help was not allowed in this view.": "इस दृश्य में AI मदद की अनुमति नहीं मिली।", "The AI could not answer right now. The diagnosis below still works without it.": "AI अभी जवाब नहीं दे सका। नीचे दिया निदान इसके बिना भी काम करता है।", "AI sees:": "AI को दिख रहा है:", "First steps:": "पहले कदम:", "AI answers can be wrong. Compare with the diagnosis below and confirm with an expert.": "AI के जवाब ग़लत हो सकते हैं। नीचे दिए निदान से मिलाएँ और विशेषज्ञ से पुष्टि करें।", "Step 3": "चरण 3", "Tick every sign you can see": "जो भी लक्षण दिखें, सब पर टिक करें", "{0} ticked": "{0} चुने गए", "Weather in the last week:": "पिछले हफ़्ते का मौसम:", "Diagnosis": "निदान", "Most likely: {0}": "सबसे संभावित: {0}", "Your diagnosis will appear here": "आपका निदान यहाँ दिखेगा", "Choose a crop in Step 1 to begin.": "शुरू करने के लिए चरण 1 में फ़सल चुनें।", "Tick at least one sign in Step 3.": "चरण 3 में कम से कम एक लक्षण पर टिक करें।", "No problem in our list matches these signs for {0}. Show the plant to your Krishi Vigyan Kendra.": "हमारी सूची में {0} के लिए इन लक्षणों से कोई समस्या मेल नहीं खाती। पौधे को अपने कृषि विज्ञान केंद्र में दिखाएँ।", "Why:": "क्यों:", "you ticked {0}.": "आपने {0} चुना।", " and ": " और ", "Not yet seen: {0}.": "अभी नहीं दिखा: {0}।", "Do this now": "अभी यह करें", "Prevent next season": "अगले मौसम में बचाव", "Check to confirm": "पुष्टि के लिए जाँचें", "The percentage shows how well your ticks match each problem's signs. It is not a laboratory test.": "प्रतिशत बताता है कि आपके चुने लक्षण हर समस्या के लक्षणों से कितना मेल खाते हैं। यह प्रयोगशाला जाँच नहीं है।", "For the judges": "निर्णायकों के लिए", "How AI Crop Doctor works": "AI क्रॉप डॉक्टर कैसे काम करता है", "1. Knowledge base": "1. ज्ञान आधार", "{0} crop problems, each with its signs, cause, treatment and prevention, written from agriculture guides.": "{0} फ़सल समस्याएँ, हर एक के लक्षण, कारण, उपचार और बचाव के साथ, कृषि मार्गदर्शिकाओं से लिखी गईं।", "2. Colour analysis": "2. रंग विश्लेषण", "Every pixel of the photo is sorted into green, yellow or brown by its hue, to measure how much of the leaf is damaged.": "फ़ोटो के हर पिक्सेल को उसके ह्यू (रंगत) के आधार पर हरा, पीला या भूरा छाँटा जाता है, ताकि पता चले कि पत्ती का कितना हिस्सा ख़राब है।", "3. Matching engine": "3. मिलान इंजन", "Each problem is scored on how many of its signs were seen and how many of the ticked signs it explains, then adjusted for the weather.": "हर समस्या को इस आधार पर अंक मिलते हैं कि उसके कितने लक्षण दिखे और चुने गए लक्षणों में से कितनों को वह समझाती है, फिर मौसम के अनुसार बदलाव होता है।", "4. Advice": "4. सलाह", "The top three problems are shown with the reason, first steps, prevention and how to confirm.": "शीर्ष तीन समस्याएँ कारण, पहले कदम, बचाव और पुष्टि के तरीक़े के साथ दिखाई जाती हैं।", "Type of AI: a rule-based expert system with image colour analysis. When online, an optional AI vision model gives a second opinion on the photo.": "AI का प्रकार: रंग विश्लेषण के साथ नियम-आधारित विशेषज्ञ प्रणाली। ऑनलाइन होने पर एक वैकल्पिक AI विज़न मॉडल फ़ोटो पर दूसरी राय देता है।", "Need an expert?": "विशेषज्ञ चाहिए?", "Call the Kisan Call Centre, free from any phone, 6 am to 10 pm.": "किसान कॉल सेंटर पर कॉल करें, किसी भी फ़ोन से मुफ़्त, सुबह 6 से रात 10 बजे तक।", "Never spray a chemical without advice. Read the label, wear gloves and a mask, and keep children away.": "सलाह के बिना कभी कोई रसायन न छिड़कें। लेबल पढ़ें, दस्ताने और मास्क पहनें, और बच्चों को दूर रखें।", "AI Crop Doctor is a school science project. It gives a likely diagnosis, not a certain one. Before spraying any chemical, confirm with an agriculture officer or Krishi Vigyan Kendra, read the label and wear gloves and a mask.": "AI क्रॉप डॉक्टर एक स्कूल विज्ञान प्रोजेक्ट है। यह संभावित निदान देता है, पक्का नहीं। कोई भी रसायन छिड़कने से पहले कृषि अधिकारी या कृषि विज्ञान केंद्र से पुष्टि करें, लेबल पढ़ें और दस्ताने व मास्क पहनें।", "Sample case:": "नमूना केस:", "a tomato leaf with ringed brown spots, after humid weather.": "नम मौसम के बाद छल्लेदार भूरे धब्बों वाली टमाटर की पत्ती।", "Likely": "संभावित", "Possible": "हो सकता है", "Less likely": "कम संभावित", "Tomato": "टमाटर", "Cotton": "कपास", "Groundnut": "मूँगफली", "Wheat": "गेहूँ", "Rice (paddy)": "धान (चावल)", "Vegetable": "सब्ज़ी", "Kharif cash crop": "ख़रीफ़ नक़दी फ़सल", "Oilseed": "तिलहन", "Rabi cereal": "रबी अनाज", "Kharif cereal": "ख़रीफ़ अनाज", "Brown spots with rings, like a target": "छल्लों वाले भूरे धब्बे, निशाने जैसे", "Small round brown or black spots": "छोटे गोल भूरे या काले धब्बे", "Angular, water-soaked spots between veins": "नसों के बीच कोणीय, पानी से भीगे जैसे धब्बे", "Diamond-shaped spots with a grey centre": "हीरे जैसे धब्बे, बीच में स्लेटी", "Orange or brown powder spots that rub off on a finger": "नारंगी या भूरे पाउडर वाले धब्बे जो उँगली पर लग जाते हैं", "Yellow powder in stripes along the leaf": "पत्ती पर धारियों में पीला पाउडर", "White powder on the leaf surface": "पत्ती की सतह पर सफ़ेद पाउडर", "White fuzzy growth under the leaf on damp mornings": "नम सुबह में पत्ती के नीचे सफ़ेद रोएँदार परत", "Large dark, wet-looking patches that spread fast": "बड़े गहरे, गीले दिखने वाले धब्बे जो तेज़ी से फैलते हैं", "Older, lower leaves turn evenly pale yellow": "पुरानी, निचली पत्तियाँ एक समान हल्की पीली हो जाती हैं", "Yellowing that starts at the leaf tip or edges": "पीलापन जो पत्ती की नोक या किनारों से शुरू होता है", "Leaf edges turn yellow, then reddish-brown": "पत्ती के किनारे पहले पीले, फिर लाल-भूरे हो जाते हैं", "Leaves curl or cup, plant looks stunted": "पत्तियाँ मुड़ती या कटोरी जैसी हो जाती हैं, पौधा बौना दिखता है", "Plant droops even when the soil is wet": "मिट्टी गीली होने पर भी पौधा मुरझाता है", "White threads or mould at the stem base": "तने के आधार पर सफ़ेद धागे या फफूँद", "Roots or stem base eaten, mud tunnels in soil": "जड़ें या तने का निचला हिस्सा खाया हुआ, मिट्टी में सुरंगें", "Round patches in the field dry up and turn brown": "खेत में गोल हिस्से सूखकर भूरे हो जाते हैं", "Holes in leaves, fruit or bolls, with droppings": "पत्तियों, फलों या टिंडों में छेद, साथ में बीट", "Flowers stay twisted shut like a rosette": "फूल गुलाब की तरह मुड़कर बंद रहते हैं", "Black powder instead of grain in the ear": "बालियों में दानों की जगह काला पाउडर", "Tiny insects under leaves (white flies, green hoppers, aphids)": "पत्तियों के नीचे छोटे कीट (सफ़ेद मक्खी, हरे फुदके, माहू)", "Leaves sticky, with a black sooty coating": "पत्तियाँ चिपचिपी, उन पर काली कालिख जैसी परत", "Caused by a fungus": "फफूँद से होने वाली", "Caused by bacteria": "बैक्टीरिया से होने वाली", "Caused by an insect pest": "कीट से होने वाली", "Caused by a virus": "वायरस से होने वाली", "A nutrient shortage": "पोषक तत्व की कमी", "On the leaves": "पत्तियों पर", "Leaf colour and shape": "पत्ती का रंग और आकार", "Stem, roots and whole plant": "तना, जड़ें और पूरा पौधा", "Flowers, fruit, grain and insects": "फूल, फल, दाना और कीट", "Humid or rainy": "नम या बरसाती", "Dry": "सूखा", "Not sure": "पता नहीं", "Early blight": "अगेती झुलसा (अर्ली ब्लाइट)", "Spores live on old leaves and in soil, and splash up in warm, humid weather.": "बीजाणु पुरानी पत्तियों और मिट्टी में रहते हैं और गर्म, नम मौसम में छींटों से ऊपर पहुँचते हैं।", "Target-like rings appear first on the oldest, lowest leaves.": "निशाने जैसे छल्ले पहले सबसे पुरानी, निचली पत्तियों पर दिखते हैं।", "Pick off and burn or bury the spotted lower leaves": "धब्बेदार निचली पत्तियाँ तोड़कर जला दें या गाड़ दें", "Water at the base of the plant, not over the leaves": "पौधे की जड़ के पास पानी दें, पत्तियों पर नहीं", "Spread mulch (straw) on the soil to stop splashing": "छींटे रोकने के लिए मिट्टी पर पुआल की परत (मल्च) बिछाएँ", "Show a sample to an agriculture officer or Krishi Vigyan Kendra before using any chemical spray": "कोई भी रसायन छिड़कने से पहले नमूना कृषि अधिकारी या कृषि विज्ञान केंद्र को दिखाएँ", "Do not grow tomato, potato or brinjal in the same plot for 2 seasons": "उसी खेत में 2 मौसम तक टमाटर, आलू या बैंगन न लगाएँ", "Stake plants and keep space between them for air": "पौधों को सहारा दें और हवा के लिए उनके बीच जगह रखें", "Use healthy seedlings from a clean nursery": "साफ़ नर्सरी से स्वस्थ पौध लें", "Late blight": "पछेती झुलसा (लेट ब्लाइट)", "Spreads very fast in cool, cloudy, wet weather; can destroy a field in a week.": "ठंडे, बादल वाले, गीले मौसम में बहुत तेज़ी से फैलता है; एक हफ़्ते में खेत नष्ट कर सकता है।", "Look under the leaf early in the morning for a white, fuzzy layer.": "सुबह-सुबह पत्ती के नीचे सफ़ेद, रोएँदार परत देखें।", "Pull out and destroy infected plants at once; do not compost them": "संक्रमित पौधे तुरंत उखाड़कर नष्ट करें; उनकी खाद न बनाएँ", "Tell the agriculture officer quickly, because it spreads to nearby farms": "कृषि अधिकारी को जल्दी बताएँ, क्योंकि यह आस-पास के खेतों में फैलता है", "Keep leaves dry; stop overhead watering": "पत्तियाँ सूखी रखें; ऊपर से पानी देना बंद करें", "Choose blight-resistant varieties": "झुलसा-रोधी किस्में चुनें", "Keep tomato away from potato fields that had blight": "टमाटर को उन आलू के खेतों से दूर रखें जिनमें झुलसा हुआ था", "Give wide spacing for air flow": "हवा के लिए ज़्यादा दूरी रखें", "Leaf curl virus": "पत्ती मोड़क वायरस (लीफ़ कर्ल)", "Whiteflies carry the virus from sick plants to healthy ones while feeding.": "सफ़ेद मक्खियाँ खाते समय बीमार पौधों से स्वस्थ पौधों तक वायरस ले जाती हैं।", "Turn the leaves over and tap: tiny white flies rise up.": "पत्तियाँ पलटकर थपथपाएँ: छोटी सफ़ेद मक्खियाँ उड़ती हैं।", "Pull out and destroy badly curled plants; a virus cannot be cured": "बहुत मुड़े पौधे उखाड़कर नष्ट करें; वायरस का इलाज नहीं होता", "Hang yellow sticky traps just above the crop to catch flying insects": "उड़ने वाले कीट पकड़ने के लिए फ़सल के ठीक ऊपर पीले चिपचिपे ट्रैप लटकाएँ", "Spray neem seed kernel extract (NSKE 5%) or neem oil on both sides of the leaves, in the evening": "शाम को पत्तियों के दोनों ओर नीम बीज गिरी अर्क (NSKE 5%) या नीम तेल छिड़कें", "Raise seedlings under insect-proof net": "पौध कीट-रोधी जाली के नीचे तैयार करें", "Remove weeds around the field where whiteflies hide": "खेत के आस-पास की खरपतवार हटाएँ जहाँ सफ़ेद मक्खी छिपती है", "Grow leaf-curl tolerant hybrids": "लीफ़ कर्ल सहनशील संकर किस्में लगाएँ", "Fusarium wilt": "फ़्यूज़ेरियम उकठा (विल्ट)", "Lives in the soil for years and enters through the roots.": "मिट्टी में सालों तक रहता है और जड़ों से पौधे में घुसता है।", "Cut the stem near the base: brown streaks inside mean wilt.": "आधार के पास तना काटें: अंदर भूरी धारियाँ हों तो उकठा है।", "Remove wilted plants with their roots": "मुरझाए पौधों को जड़ समेत हटाएँ", "Do not carry soil from that patch to other beds": "उस हिस्से की मिट्टी दूसरी क्यारियों में न ले जाएँ", "Improve drainage so water does not stand": "जल निकास सुधारें ताकि पानी न रुके", "Mix Trichoderma (a friendly fungus) with compost before planting": "बुआई से पहले ट्राइकोडर्मा (मित्र फफूँद) को कम्पोस्ट में मिलाएँ", "Rotate with cereals for 3 years or more": "3 साल या ज़्यादा के लिए अनाज फ़सलों के साथ फ़सल चक्र अपनाएँ", "Use wilt-resistant varieties": "उकठा-रोधी किस्में लगाएँ", "Pink bollworm": "गुलाबी सुंडी (पिंक बॉलवर्म)", "Moths lay eggs on flowers and bolls; caterpillars eat the seeds inside.": "पतंगे फूलों और टिंडों पर अंडे देते हैं; सुंडियाँ अंदर के बीज खाती हैं।", "Open a green boll: a small pink caterpillar inside confirms it.": "एक हरा टिंडा खोलें: अंदर छोटी गुलाबी सुंडी हो तो पक्का है।", "Pick and destroy rosette flowers and damaged bolls": "गुलाब जैसे बंद फूल और ख़राब टिंडे तोड़कर नष्ट करें", "Set pheromone traps to count moths and know when to act": "पतंगों की गिनती और सही समय जानने के लिए फ़ेरोमोन ट्रैप लगाएँ", "Sow on time so the crop finishes early": "समय पर बुआई करें ताकि फ़सल जल्दी पूरी हो", "Destroy crop stalks and leftover bolls after the last picking": "आख़िरी चुनाई के बाद डंठल और बचे टिंडे नष्ट करें", "Do not store seed cotton near the field": "बीज वाली कपास खेत के पास न रखें", "Jassid (leafhopper)": "जैसिड (हरा फुदका)", "Green hoppers suck sap from the leaf underside and inject a toxin.": "हरे फुदके पत्ती के नीचे से रस चूसते हैं और ज़हर छोड़ते हैं।", "Small green insects walk sideways under the leaf.": "छोटे हरे कीट पत्ती के नीचे तिरछे चलते हैं।", "Check 20 leaves across the field to see how many hoppers there are": "खेत भर में 20 पत्तियाँ देखें कि कितने फुदके हैं", "Grow hairy-leaf varieties that hoppers dislike": "रोएँदार पत्ती वाली किस्में लगाएँ जो फुदकों को पसंद नहीं", "Avoid giving too much nitrogen fertiliser": "बहुत ज़्यादा नाइट्रोजन उर्वरक न दें", "Whitefly and cotton leaf curl": "सफ़ेद मक्खी और कपास पत्ती मोड़क", "Whiteflies suck sap, leave sticky honeydew and spread leaf curl virus.": "सफ़ेद मक्खियाँ रस चूसती हैं, चिपचिपा मधुरस छोड़ती हैं और पत्ती मोड़क वायरस फैलाती हैं।", "Shake the plant: a cloud of tiny white flies rises.": "पौधा हिलाएँ: छोटी सफ़ेद मक्खियों का झुंड उड़ता है।", "Remove weeds that host whiteflies": "सफ़ेद मक्खी को आश्रय देने वाली खरपतवार हटाएँ", "Avoid late sowing": "देर से बुआई न करें", "Do not spray the same insecticide again and again": "एक ही कीटनाशक बार-बार न छिड़कें", "Bacterial blight": "जीवाणु झुलसा (बैक्टीरियल ब्लाइट)", "Bacteria spread by rain splash, wind and infected seed.": "बैक्टीरिया बारिश के छींटों, हवा और संक्रमित बीज से फैलते हैं।", "Hold the leaf to light: spots look oily and are limited by veins.": "पत्ती को रोशनी में देखें: धब्बे तैलीय दिखते हैं और नसों तक सीमित रहते हैं।", "Remove badly spotted leaves": "ज़्यादा धब्बेदार पत्तियाँ हटाएँ", "Do not work in the field when plants are wet": "पौधे गीले हों तो खेत में काम न करें", "Use treated, certified seed": "उपचारित, प्रमाणित बीज लें", "Grow resistant varieties": "रोधी किस्में लगाएँ", "Rotate with a non-cotton crop": "कपास के अलावा दूसरी फ़सल के साथ फ़सल चक्र अपनाएँ", "Tikka leaf spot": "टिक्का पत्ती धब्बा", "Spores from old crop leftovers infect new leaves in humid weather.": "पुरानी फ़सल के अवशेषों से बीजाणु नम मौसम में नई पत्तियों को संक्रमित करते हैं।", "Round dark spots, often with a yellow ring, on both sides of the leaf.": "गोल गहरे धब्बे, अक्सर पीले घेरे के साथ, पत्ती के दोनों ओर।", "Collect and burn fallen spotted leaves": "गिरी हुई धब्बेदार पत्तियाँ इकट्ठी करके जलाएँ", "Rotate with cereals such as bajra or jowar": "बाजरा या ज्वार जैसे अनाज के साथ फ़सल चक्र अपनाएँ", "Remove volunteer groundnut plants": "अपने-आप उगे मूँगफली के पौधे हटाएँ", "Use treated seed": "उपचारित बीज लें", "Groundnut rust": "मूँगफली का रतुआ (रस्ट)", "Wind carries rust spores over long distances.": "हवा रतुआ के बीजाणुओं को दूर तक ले जाती है।", "Rub a spot with a white tissue: orange-brown powder comes off.": "धब्बे को सफ़ेद टिशू से रगड़ें: नारंगी-भूरा पाउडर निकलता है।", "Check the underside of leaves across the field": "खेत भर में पत्तियों का निचला हिस्सा देखें", "Grow rust-tolerant varieties": "रतुआ-सहनशील किस्में लगाएँ", "Sow early": "जल्दी बुआई करें", "Rotate crops": "फ़सल चक्र अपनाएँ", "Stem rot": "तना सड़न", "A soil fungus that attacks the stem base in warm, wet soil.": "मिट्टी की एक फफूँद जो गर्म, गीली मिट्टी में तने के आधार पर हमला करती है।", "White threads and small mustard-seed-like balls at the stem base.": "तने के आधार पर सफ़ेद धागे और सरसों के दाने जैसी छोटी गोलियाँ।", "Remove affected plants with the soil around the base": "प्रभावित पौधों को आधार के आस-पास की मिट्टी समेत हटाएँ", "Apply Trichoderma mixed with compost around nearby plants": "आस-पास के पौधों के चारों ओर कम्पोस्ट में मिला ट्राइकोडर्मा डालें", "Deep ploughing in summer to expose the fungus to sun": "फफूँद को धूप दिखाने के लिए गर्मी में गहरी जुताई करें", "Rotate with cereals": "अनाज फ़सलों के साथ फ़सल चक्र अपनाएँ", "Add well-rotted compost, not fresh residue": "ताज़ा अवशेष नहीं, अच्छी सड़ी कम्पोस्ट डालें", "Yellow (stripe) rust": "पीला (धारीदार) रतुआ", "Spreads by wind in cool, humid weather.": "ठंडे, नम मौसम में हवा से फैलता है।", "Yellow powder in lines along the leaf that stains your finger.": "पत्ती पर लकीरों में पीला पाउडर जो उँगली पर लग जाता है।", "Tell the agriculture officer quickly; it spreads across fields": "कृषि अधिकारी को जल्दी बताएँ; यह खेतों में फैलता है", "Grow rust-resistant varieties recommended for your area": "अपने क्षेत्र के लिए सुझाई गई रतुआ-रोधी किस्में लगाएँ", "Sow on time": "समय पर बुआई करें", "Brown (leaf) rust": "भूरा (पत्ती) रतुआ", "Wind-borne spores; favours mild temperatures with dew.": "हवा से फैलने वाले बीजाणु; ओस वाले हल्के तापमान में बढ़ता है।", "Scattered orange-brown powder spots on the upper leaf surface.": "पत्ती की ऊपरी सतह पर बिखरे नारंगी-भूरे पाउडर वाले धब्बे।", "Avoid very late sowing": "बहुत देर से बुआई न करें", "Loose smut": "अनावृत कंडुआ (लूज़ स्मट)", "Carried inside the seed; black spores blow to healthy flowers.": "बीज के अंदर रहता है; काले बीजाणु उड़कर स्वस्थ फूलों तक पहुँचते हैं।", "Ears are full of black powder instead of grain.": "बालियों में दानों की जगह काला पाउडर भरा होता है।", "Carefully pull out smutted plants into a bag before the powder blows away": "पाउडर उड़ने से पहले कंडुआ वाले पौधों को सावधानी से थैले में उखाड़ें", "Use certified, treated seed next season": "अगले मौसम में प्रमाणित, उपचारित बीज लें", "Do not keep seed from an infected field": "संक्रमित खेत का बीज न रखें", "Termites": "दीमक", "Termites eat roots and stems, mostly in dry soil.": "दीमक जड़ें और तने खाती है, ज़्यादातर सूखी मिट्टी में।", "Dig out a wilted plant: roots are eaten and soil has mud tunnels.": "मुरझाया पौधा खोदें: जड़ें खाई हुई हों और मिट्टी में सुरंगें हों।", "Water the field; termites dislike moist soil": "खेत में पानी दें; दीमक को नम मिट्टी पसंद नहीं", "Destroy termite mounds near the field": "खेत के पास दीमक के टीले नष्ट करें", "Use only well-rotted manure; raw dung attracts termites": "केवल अच्छी सड़ी खाद डालें; कच्चा गोबर दीमक को बुलाता है", "Remove old crop stubble": "पुराने फ़सल ठूँठ हटाएँ", "Rice blast": "धान का ब्लास्ट (झोंका)", "Spores spread by wind; heavy nitrogen and long leaf wetness help it.": "बीजाणु हवा से फैलते हैं; ज़्यादा नाइट्रोजन और पत्तियों का देर तक गीला रहना इसे बढ़ाता है।", "Spindle-shaped spots with a grey centre and brown edge.": "तकले जैसे धब्बे, बीच में स्लेटी और किनारा भूरा।", "Stop extra nitrogen (urea) for now": "अभी अतिरिक्त नाइट्रोजन (यूरिया) बंद करें", "Grow blast-resistant varieties": "ब्लास्ट-रोधी किस्में लगाएँ", "Use balanced fertiliser based on a soil test": "मिट्टी जाँच के आधार पर संतुलित उर्वरक दें", "Treat seed before sowing": "बुआई से पहले बीज उपचार करें", "Bacterial leaf blight": "जीवाणु पत्ती झुलसा", "Bacteria enter through wounds and spread with irrigation water and storms.": "बैक्टीरिया घावों से घुसते हैं और सिंचाई के पानी व तूफ़ान से फैलते हैं।", "Yellow, wavy stripes running down from the leaf tip.": "पत्ती की नोक से नीचे की ओर पीली, लहरदार धारियाँ।", "Drain the field for a few days": "कुछ दिनों के लिए खेत का पानी निकाल दें", "Stop extra nitrogen": "अतिरिक्त नाइट्रोजन बंद करें", "Do not cut the tips of seedlings before transplanting": "रोपाई से पहले पौध की नोकें न काटें", "Use clean seed": "साफ़ बीज लें", "Brown spot": "भूरा धब्बा", "Common in poor, nutrient-hungry soil; carried on seed.": "कमज़ोर, पोषक-रहित मिट्टी में आम; बीज के साथ आता है।", "Oval brown spots with a light centre, many per leaf.": "हल्के बीच वाले अंडाकार भूरे धब्बे, हर पत्ती पर कई।", "Get the soil tested and correct the fertiliser": "मिट्टी की जाँच कराएँ और उर्वरक सुधारें", "Add compost and balanced fertiliser": "कम्पोस्ट और संतुलित उर्वरक डालें", "Brown planthopper": "भूरा फुदका (ब्राउन प्लांटहॉपर)", "Hoppers crowd at the base of plants and suck sap, drying patches of the field.": "फुदके पौधों के आधार पर जमा होकर रस चूसते हैं, जिससे खेत के हिस्से सूख जाते हैं।", "Tap the plant base over water: brown hoppers fall on the surface.": "पानी के ऊपर पौधे का आधार थपथपाएँ: भूरे फुदके पानी पर गिरते हैं।", "Drain standing water for 3 to 4 days": "3 से 4 दिन के लिए खड़ा पानी निकाल दें", "Open a gap every few rows so light and air reach the base": "कुछ पंक्तियों के बाद जगह खोलें ताकि रोशनी और हवा आधार तक पहुँचे", "Avoid extra nitrogen": "अतिरिक्त नाइट्रोजन से बचें", "Grow hopper-resistant varieties": "फुदका-रोधी किस्में लगाएँ", "Avoid very close planting": "बहुत पास-पास रोपाई न करें", "Nitrogen deficiency": "नाइट्रोजन की कमी", "The plant moves nitrogen from old leaves to new ones, so old leaves yellow first.": "पौधा नाइट्रोजन पुरानी पत्तियों से नई पत्तियों में भेजता है, इसलिए पुरानी पत्तियाँ पहले पीली होती हैं।", "Yellowing is even across the leaf, with no spots or powder.": "पीलापन पूरी पत्ती पर एक समान होता है, कोई धब्बा या पाउडर नहीं।", "Get a soil test (Soil Health Card lab)": "मिट्टी की जाँच कराएँ (मृदा स्वास्थ्य कार्ड प्रयोगशाला)", "Add well-rotted compost or the fertiliser the soil test advises": "अच्छी सड़ी कम्पोस्ट या मिट्टी जाँच में बताया उर्वरक डालें", "Test soil every 2 to 3 years": "हर 2 से 3 साल में मिट्टी जाँचें", "Grow a pulse crop in rotation to add nitrogen": "नाइट्रोजन बढ़ाने के लिए फ़सल चक्र में दलहन लगाएँ", "Aphids": "माहू (एफ़िड)", "Soft green or black insects suck sap from young shoots; ants often guard them.": "मुलायम हरे या काले कीट नई टहनियों से रस चूसते हैं; अक्सर चींटियाँ उनकी रक्षा करती हैं।", "Clusters of tiny soft insects on tender shoots and under leaves.": "कोमल टहनियों पर और पत्तियों के नीचे छोटे मुलायम कीटों के झुंड।", "Wash them off with a strong jet of water": "पानी की तेज़ धार से उन्हें धो दें", "Protect ladybird beetles, which eat aphids": "माहू खाने वाले लेडीबर्ड भृंगों को बचाएँ", "Avoid too much nitrogen": "बहुत ज़्यादा नाइट्रोजन से बचें", "Keep borders weed-free": "मेड़ों को खरपतवार से मुक्त रखें", "Powdery mildew": "चूर्णिल आसिता (पाउडरी मिल्ड्यू)", "Spreads in dry days with cool, humid nights.": "सूखे दिनों और ठंडी, नम रातों में फैलती है।", "White powder that wipes off, leaving a pale patch.": "सफ़ेद पाउडर जो पोंछने पर हट जाता है और हल्का धब्बा छोड़ता है।", "Remove the worst affected leaves": "सबसे ज़्यादा प्रभावित पत्तियाँ हटाएँ", "Give space for air flow": "हवा के लिए जगह दें", "Grow tolerant varieties": "सहनशील किस्में लगाएँ"}, "gu": {"Science project · Hanifa School, Borsad": "વિજ્ઞાન પ્રોજેક્ટ · હનીફા સ્કૂલ, બોરસદ", "Is your crop sick?": "શું તમારો પાક બીમાર છે?", "Find out in three steps.": "ત્રણ પગલાંમાં જાણો.", "Choose the crop, show a photo of the leaf, and tick the signs you see. AI Crop Doctor names the most likely problem, explains why, and tells you what to do today and how to prevent it next season.": "પાક પસંદ કરો, પાનનો ફોટો બતાવો અને જે લક્ષણો દેખાય તેના પર ટિક કરો. AI ક્રોપ ડૉક્ટર સૌથી સંભવિત સમસ્યા જણાવે છે, કારણ સમજાવે છે, અને કહે છે કે આજે શું કરવું અને આવતી સીઝનમાં તેનાથી કેવી રીતે બચવું.", "Load the sample case": "નમૂનાનો કેસ ખોલો", "Start fresh": "નવેસરથી શરૂ કરો", "Choose the crop": "પાક પસંદ કરો", "Tomato, cotton, groundnut, wheat or rice": "ટામેટાં, કપાસ, મગફળી, ઘઉં અથવા ડાંગર", "Check the leaf photo": "પાનનો ફોટો તપાસો", "Measures green, yellow and brown areas": "લીલો, પીળો અને કથ્થઈ ભાગ માપે છે", "Tick the signs": "લક્ષણો પર ટિક કરો", "Get the likely problem and what to do": "સંભવિત સમસ્યા અને ઉપાય મેળવો", "Step 1": "પગલું 1", "Which crop is sick?": "કયો પાક બીમાર છે?", "Step 2": "પગલું 2", "Optional, but it helps": "વૈકલ્પિક, પણ મદદરૂપ", "Place one leaf on <b>plain white paper</b> in daylight and take a photo from above. Then choose it here or drag it ા જવાબ ખોટા હોઈ શકે. નીચેના નિદાન સાથે સરખાવો અને નિષ્ણાત પાસે ખાતરી કરો.", "Step 3": "પગલું 3", "Tick every sign you can see": "જે પણ લક્ષણો દેખાય તે બધાં પર ટિક કરો", "{0} ticked": "{0} પસંદ કર્યાં", "Weather in the last week:": "છેલ્લા અઠવાડિયાનું હવામાન:", "Diagnosis": "નિદાન", "Most likely: {0}": "સૌથી સંભવિત: {0}", "Your diagnosis will appear here": "તમારું નિદાન અહીં દેખાશે", "Choose a crop in Step 1 to begin.": "શરૂ કરવા પગલું 1માં પાક પસંદ કરો.", "Tick at least one sign in Step 3.": "પગલું 3માં ઓછામાં ઓછા એક લક્ષણ પર ટિક કરો.", "No problem in our list matches these signs for {0}. Show the plant to your Krishi Vigyan Kendra.": "અમારી યાદીમાં {0} માટે આ લક્ષણો સાથે કોઈ સમસ્યા મેળ ખાતી નથી. છોડ તમારા કૃષિ વિજ્ઞાન કેન્દ્રમાં બતાવો.", "Why:": "કેમ:", "you ticked {0}.": "તમે {0} પસંદ કર્યું.", " and ": " અને ", "Not yet seen: {0}.": "હજી નથી દેખાયું: {0}.", "Do this now": "હમણાં આ કરો", "Prevent next season": "આવતી સીઝનમાં બચાવ", "Check to confirm": "ખાતરી માટે તપાસો", "The percentage shows how well your ticks match each problem's signs. It is not a laboratory test.": "ટકાવારી બતાવે છે કે તમારાં પસંદ કરેલાં લક્ષણો દરેક સમસ્યાનાં લક્ષણો સાથે કેટલાં મેળ ખાય છે. આ પ્રયોગશાળાની તપાસ નથી.", "For the judges": "નિર્ણાયકો માટે", "How AI Crop Doctor works": "AI ક્રોપ ડૉક્ટર કેવી રીતે કામ કરે છે", "1. Knowledge base": "1. જ્ઞાન આધાર", "{0} crop problems, each with its signs, cause, treatment and prevention, written from agriculture guides.": "{0} પાક સમસ્યાઓ, દરેકનાં લક્ષણો, કારણ, સારવાર અને બચાવ સાથે, કૃષિ માર્ગદર્શિકાઓમાંથી લખેલી.", "2. Colour analysis": "2. રંગ વિશ્લેષણ", "Every pixel of the photo is sorted into green, yellow or brown by its hue, to measure how much of the leaf is damaged.": "ફોટોના દરેક પિક્સેલને તેના હ્યૂ (રંગછટા) પ્રમાણે લીલો, પીળો કે કથ્થઈ ગોઠવવામાં આવે છે, જેથી ખબર પડે કે પાનનો કેટલો ભાગ ખરાબ છે.", "3. Matching engine": "3. મેળ એન્જિન", "Each problem is scored on how many of its signs were seen and how many of the ticked signs it explains, then adjusted for the weather.": "દરેક સમસ્યાને એ આધારે ગુણ મળે છે કે તેનાં કેટલાં લક્ષણો દેખાયાં અને પસંદ કરેલાં લક્ષણોમાંથી કેટલાંને તે સમજાવે છે, પછી હવામાન પ્રમાણે ફેરફાર થાય છે.", "4. Advice": "4. સલાહ", "The top three problems are shown with the reason, first steps, prevention and how to confirm.": "ટોચની ત્રણ સમસ્યાઓ કારણ, પહેલાં પગલાં, બચાવ અને ખાતરીની રીત સાથે બતાવવામાં આવે છે.", "Type of AI: a rule-based expert system with image colour analysis. When online, an optional AI vision model gives a second opinion on the photo.": "AIનો પ્રકાર: રંગ વિશ્લેષણ સાથેની નિયમ-આધારિત નિષ્ણાત પ્રણાલી. ઑનલાઇન હોય ત્યારે એક વૈકલ્પિક AI વિઝન મૉડલ ફોટો પર બીજો અભિપ્રાય આપે છે.", "Need an expert?": "નિષ્ણાત જોઈએ છે?", "Call the Kisan Call Centre, free from any phone, 6 am to 10 pm.": "કિસાન કૉલ સેન્ટરને કૉલ કરો, કોઈ પણ ફોનથી મફત, સવારે 6 થી રાત્રે 10 સુધી.", "Never spray a chemical without advice. Read the label, wear gloves and a mask, and keep children away.": "સલાહ વિના ક્યારેય કોઈ રસાયણ છાંટશો નહીં. લેબલ વાંચો, હાથમોજાં અને માસ્ક પહેરો, અને બાળકોને દૂર રાખો.", "AI Crop Doctor is a school science project. It gives a likely diagnosis, not a certain one. Before spraying any chemical, confirm with an agriculture officer or Krishi Vigyan Kendra, read the label and wear gloves and a mask.": "AI ક્રોપ ડૉક્ટર શાળાનો વિજ્ઞાન પ્રોજેક્ટ છે. તે સંભવિત નિદાન આપે છે, ચોક્કસ નહીં. કોઈ પણ રસાયણ છાંટતા પહેલાં કૃષિ અધિકારી અથવા કૃષિ વિજ્ઞાન કેન્દ્ર પાસે ખાતરી કરો, લેબલ વાંચો અને હાથમોજાં તથા માસ્ક પહેરો.", "Sample case:": "નમૂનાનો કેસ:", "a tomato leaf with ringed brown spots, after humid weather.": "ભેજવાળા હવામાન પછી વલયવાળા કથ્થઈ ડાઘવાળું ટામેટાંનું પાન.", "Likely": "સંભવિત", "Possible": "શક્ય", "Less likely": "ઓછું સંભવિત", "Tomato": "ટામેટાં", "Cotton": "કપાસ", "Groundnut": "મગફળી", "Wheat": "ઘઉં", "Rice (paddy)": "ડાંગર (ચોખા)", "Vegetable": "શાકભાજી", "Kharif cash crop": "ખરીફ રોકડિયો પાક", "Oilseed": "તેલીબિયાં", "Rabi cereal": "રવી ધાન્ય", "Kharif cereal": "ખરીફ ધાન્ય", "Brown spots with rings, like a target": "વલયવાળા કથ્થઈ ડાઘ, નિશાન જેવા", "Small round brown or black spots": "નાના ગોળ કથ્થઈ અથવા કાળા ડાઘ", "Angular, water-soaked spots between veins": "નસો વચ્ચે ખૂણાદાર, પાણી પીધેલા જેવા ડાઘ", "Diamond-shaped spots with a grey centre": "હીરા આકારના ડાઘ, વચ્ચે રાખોડી", "Orange or brown powder spots that rub off on a finger": "નારંગી અથવા કથ્થઈ પાઉડરવાળા ડાઘ જે આંગળી પર લાગી જાય", "Yellow powder in stripes along the leaf": "પાન પર પટ્ટાઓમાં પીળો પાઉડર", "White powder on the leaf surface": "પાનની સપાટી પર સફેદ પાઉડર", "White fuzzy growth under the leaf on damp mornings": "ભેજવાળી સવારે પાનની નીચે સફેદ રુવાંટીવાળું પડ", "Large dark, wet-looking patches that spread fast": "મોટા ઘેરા, ભીના દેખાતા ડાઘ જે ઝડપથી ફેલાય", "Older, lower leaves turn evenly pale yellow": "જૂનાં, નીચેનાં પાન એકસરખાં આછાં પીળાં થાય", "Yellowing that starts at the leaf tip or edges": "પીળાશ જે પાનની ટોચ કે કિનારીથી શરૂ થાય", "Leaf edges turn yellow, then reddish-brown": "પાનની કિનારી પહેલાં પીળી, પછી લાલ-કથ્થઈ થાય", "Leaves curl or cup, plant looks stunted": "પાન વળે કે વાટકી જેવાં થાય, છોડ ઠીંગણો દેખાય", "Plant droops even when the soil is wet": "જમીન ભીની હોય છતાં છોડ કરમાય", "White threads or mould at the stem base": "થડના નીચલા ભાગે સફેદ તાંતણા અથવા ફૂગ", "Roots or stem base eaten, mud tunnels in soil": "મૂળ કે થડનો નીચલો ભાગ ખવાયેલો, જમીનમાં માટીની ટનલ", "Round patches in the field dry up and turn brown": "ખેતરમાં ગોળ ભાગ સુકાઈને કથ્થઈ થઈ જાય", "Holes in leaves, fruit or bolls, with droppings": "પાન, ફળ કે જીંડવાંમાં કાણાં, સાથે હગાર", "Flowers stay twisted shut like a rosette": "ફૂલ ગુલાબની જેમ વળીને બંધ રહે", "Black powder instead of grain in the ear": "ડૂંડીમાં દાણાને બદલે કાળો પાઉડર", "Tiny insects under leaves (white flies, green hoppers, aphids)": "પાનની નીચે નાના કીટ (સફેદ માખી, લીલા તડતડિયા, મોલો)", "Leaves sticky, with a black sooty coating": "પાન ચીકણાં, તેના પર કાળી મેશ જેવું પડ", "Caused by a fungus": "ફૂગથી થતો", "Caused by bacteria": "બેક્ટેરિયાથી થતો", "Caused by an insect pest": "જીવાતથી થતો", "Caused by a virus": "વાયરસથી થતો", "A nutrient shortage": "પોષક તત્ત્વની ઊણપ", "On the leaves": "પાન પર", "Leaf colour and shape": "પાનનો રંગ અને આકાર", "Stem, roots and whole plant": "થડ, મૂળ અને આખો છોડ", "Flowers, fruit, grain and insects": "ફૂલ, ફળ, દાણા અને જીવાત", "Humid or rainy": "ભેજવાળું અથવા વરસાદી", "Dry": "સૂકું", "Not sure": "ખબર નથી", "Early blight": "આગોતરો સુકારો (અર્લી બ્લાઇટ)", "Spores live on old leaves and in soil, and splash up in warm, humid weather.": "બીજાણુ જૂનાં પાન અને જમીનમાં રહે છે અને ગરમ, ભેજવાળા હવામાનમાં છાંટા સાથે ઉપર પહોંચે છે.", "Target-like rings appear first on the oldest, lowest leaves.": "નિશાન જેવા વલય સૌથી પહેલાં સૌથી જૂનાં, નીચેનાં પાન પર દેખાય છે.", "Pick off and burn or bury the spotted lower leaves": "ડાઘવાળાં નીચેનાં પાન તોડીને બાળી દો અથવા દાટી દો", "Water at the base of the plant, not over the leaves": "છોડના થડ પાસે પાણી આપો, પાન પર નહીં", "Spread mulch (straw) on the soil to stop splashing": "છાંટા રોકવા જમીન પર પરાળનું આવરણ (મલ્ચ) પાથરો", "Show a sample to an agriculture officer or Krishi Vigyan Kendra before using any chemical spray": "કોઈ પણ રસાયણ છાંટતા પહેલાં નમૂનો કૃષિ અધિકારી અથવા કૃષિ વિજ્ઞાન કેન્દ્રને બતાવો", "Do not grow tomato, potato or brinjal in the same plot for 2 seasons": "એ જ ખેતરમાં 2 સીઝન સુધી ટામેટાં, બટાકા કે રીંગણ ન વાવો", "Stake plants and keep space between them for air": "છોડને ટેકો આપો અને હવા માટે વચ્ચે જગ્યા રાખો", "Use healthy seedlings from a clean nursery": "સ્વચ્છ નર્સરીમાંથી તંદુરસ્ત રોપા લો", "Late blight": "પાછોતરો સુકારો (લેટ બ્લાઇટ)", "Spreads very fast in cool, cloudy, wet weather; can destroy a field in a week.": "ઠંડા, વાદળછાયા, ભીના હવામાનમાં ખૂબ ઝડપથી ફેલાય છે; એક અઠવાડિયામાં ખેતર બરબાદ કરી શકે.", "Look under the leaf early in the morning for a white, fuzzy layer.": "વહેલી સવારે પાનની નીચે સફેદ, રુવાંટીવાળું પડ જુઓ.", "Pull out and destroy infected plants at once; do not compost them": "ચેપવાળા છોડ તરત ઉખાડીને નાશ કરો; તેનું ખાતર ન બનાવો", "Tell the agriculture officer quickly, because it spreads to nearby farms": "કૃષિ અધિકારીને ઝડપથી જણાવો, કારણ કે તે આસપાસનાં ખેતરોમાં ફેલાય છે", "Keep leaves dry; stop overhead watering": "પાન સૂકાં રાખો; ઉપરથી પાણી આપવાનું બંધ કરો", "Choose blight-resistant varieties": "સુકારા-પ્રતિરોધક જાતો પસંદ કરો", "Keep tomato away from potato fields that had blight": "જ્યાં સુકારો થયો હોય એવાં બટાકાનાં ખેતરોથી ટામેટાં દૂર રાખો", "Give wide spacing for air flow": "હવા માટે વધુ અંતર રાખો", "Leaf curl virus": "પાન વળવાનો વાયરસ (લીફ કર્લ)", "Whiteflies carry the virus from sick plants to healthy ones while feeding.": "સફેદ માખીઓ ખાતી વખતે બીમાર છોડમાંથી તંદુરસ્ત છોડ સુધી વાયરસ લઈ જાય છે.", "Turn the leaves over and tap: tiny white flies rise up.": "પાન ઉલટાવીને ટપારો: નાની સફેદ માખીઓ ઊડે છે.", "Pull out and destroy badly curled plants; a virus cannot be cured": "ખૂબ વળી ગયેલા છોડ ઉખાડીને નાશ કરો; વાયરસનો ઇલાજ નથી", "Hang yellow sticky traps just above the crop to catch flying insects": "ઊડતી જીવાત પકડવા પાકની બરાબર ઉપર પીળા ચીકણા ટ્રૅપ લટકાવો", "Spray neem seed kernel extract (NSKE 5%) or neem oil on both sides of the leaves, in the evening": "સાંજે પાનની બંને બાજુ લીમડાના બીજના મીંજનો અર્ક (NSKE 5%) અથવા લીમડાનું તેલ છાંટો", "Raise seedlings under insect-proof net": "જીવાત-રોધક જાળી નીચે રોપા ઉછેરો", "Remove weeds around the field where whiteflies hide": "ખેતર આસપાસનું નીંદણ દૂર કરો જ્યાં સફેદ માખી છુપાય છે", "Grow leaf-curl tolerant hybrids": "લીફ કર્લ સહનશીલ હાઇબ્રિડ જાતો વાવો", "Fusarium wilt": "ફ્યુઝેરિયમ સુકારો (વિલ્ટ)", "Lives in the soil for years and enters through the roots.": "જમીનમાં વર્ષો સુધી રહે છે અને મૂળ દ્વારા પ્રવેશે છે.", "Cut the stem near the base: brown streaks inside mean wilt.": "થડ નીચેથી કાપો: અંદર કથ્થઈ લીટીઓ હોય તો સુકારો છે.", "Remove wilted plants with their roots": "કરમાયેલા છોડ મૂળ સહિત દૂર કરો", "Do not carry soil from that patch to other beds": "એ ભાગની માટી બીજા ક્યારામાં ન લઈ જાઓ", "Improve drainage so water does not stand": "પાણીનો નિકાલ સુ /* ================= DIAGNOSIS ENGINE ================= */
function diagnose(){
  if(!S.crop||!S.sym.size)return [];
  return D.filter(d=>d.crops.includes('*')||d.crops.includes(S.crop)).map(d=>{
    const keys=Object.keys(d.sym),tot=keys.reduce((a,k)=>a+d.sym[k],0);
    const hit=keys.filter(k=>S.sym.has(k)),miss=keys.filter(k=>!S.sym.has(k));
    const extra=[...S.sym].filter(k=>!(k in d.sym));
    const recall=hit.reduce((a,k)=>a+d.sym[k],0)/tot, precision=hit.length/S.sym.size;
    let sc=0.6*recall+0.4*precision;   // how much of the problem is seen, and how much of what is seen it explains
    if(S.weather==='humid')sc+=0.06*d.humid; if(S.weather==='dry')sc-=0.06*d.humid;
    if(d.crops.includes('*'))sc-=0.08;   // general problems rank below crop-specific ones on a tie
    return {d,score:Math.max(0,Math.min(99,Math.round(sc*100))),hit,miss,extra};
  }).filter(r=>r.hit.length).sort((a,b)=>b.score-a.score).slice(0,3);
}

function hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return [h,mx?d/mx:0,mx]}
function classify(r,g,b){const [h,s,v]=hsv(r,g,b);
  if(v>0.82&&s<0.16)return 0;            // white paper background
  if(v<0.12)return 3;                     // very dark: dead tissue
  if(s<0.18)return 0;                     // grey background or glare
  if(h>=68&&h<=170)return 1;              // green, healthy
  if(h>=42&&h<68&&v>0.45)return 2;        // yellow
  if(h<42||h>330)return 3;                // brown / reddish
  return 0}
function analyse(img){
  const W=480,H=360,a=document.createElement('canvas');a.width=W;a.height=H;const x=a.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);const k=Math.min(W/img.width,H/img.height),w=img.width*k,h=img.height*k;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  const id=x.getImageData(0,0,W,H),p=id.data,map=x.createImageData(W,H),m=map.data,c=[0,0,0,0];
  for(let i=0;i<p.length;i+=4){const t=classify(p[i],p[i+1],p[i+2]);c[t]++;
    const col=t===1?[198,226,196]:t===2?[240,205,40]:t===3?[190,40,30]:[255,255,255];m[i]=col[0];m[i+1]=col[1];m[i+2]=col[2];m[i+3]=255}
  const leaf=c[1]+c[2]+c[3];
  return {src:a.toDataURL('image/jpeg',.85),map,W,H,leaf,green:leaf?c[1]/leaf*100:0,yellow:leaf?c[2]/leaf*100:0,brown:leaf?c[3]/leaf*100:0,cover:leaf/(W*H)*100}}
function sampleLeaf(){
  const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');x.fillStyle='#FFFFFF';x.fillRect(0,0,640,480);
  x.save();x.translate(320,240);x.rotate(-0.35);
  x.beginPath();x.moveTo(-250,0);x.bezierCurveTo(-150,-170,140,-170,250,0);x.bezierCurveTo(140,170,-150,170,-250,0);x.closePath();
  const g=x.createLinearGradient(0,-150,0,150);g.addColorStop(0,'#4E9A3A');g.addColorStop(1,'#2F7A2E');x.fillStyle=g;x.fill();
  x.strokeStyle='#8CC56A';x.lineWidth=4;x.beginPath();x.moveTo(-250,0);x.lineTo(240,0);x.stroke();x.lineWidth=2;
  for(let i=-180;i<=180;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i+50,-95);x.moveTo(i,0);x.lineTo(i+50,95);x.stroke()}
  const spots=[[-150,-45,26],[-95,55,22],[-30,-70,18],[40,40,28],[110,-30,20],[-170,40,14],[160,35,15],[0,95,13]];
  spots.forEach(([sx,sy,r])=>{x.fillStyle='rgba(222,200,60,.9)';x.beginPath();x.arc(sx,sy,r*1.45,0,7);x.fill();
    [[1,'#6E3B1C'],[.72,'#9A5A2A'],[.48,'#5A2E14'],[.24,'#8B4A22']].forEach(([f,col])=>{x.fillStyle=col;x.beginPath();x.arc(sx,sy,r*f,0,7);x.fill()})});
  x.restore();return c}
function suggestions(a){const s=[];
  if(a.brown>=8)s.push(['rings','spots']);
  if(a.yellow>=15)s.push(['yellowold']);
  return s.flat()}

 <div class="langs" role="group" aria-label="Language / भाषा / ભાષા">${Object.entries(LANGS).map(([k,v])=>`<button class="lang ${LANG===k?'on':''}" data-act="lang" data-v="${k}" lang="${k}" aria-pressed="${LANG===k}">${v}</button>`).join('')}</div></div></div>
 <div class="wrap hero"><div><h1>${t('Is your crop sick?')} <span>${t('Find out in three steps.')}</span></h1>

function vCrop(){return `<section class="panel" aria-labelledby="h1"><div class="head"><span class="num">${t('Step 1')}</span><h2 id="h1">${t('Which crop is sick?')}</h2></div>
 <div class="crops">${Object.entries(CROPS).map(([k,v])=>`<button class="crop ${S.crop===k?'on':''}" data-act="crop" data-v="${k}" aria-pressed="${S.crop===k}">${ICON[k]}<span>${v}</span><small>${CROP_SUB[k]}</small></button>`).join('')}</div></section>`}
function vPhoto(){const a=S.photo;return `<section class="panel" aria-labelledby="h2"><div class="head"><span class="num">${t('Step 2')}</span><h2 id="h2">${t('Check the leaf photo')}</h2><span class="dim small">${t('Optional, but it helps')}</span></div>
 <div class="drop" id="drop"><p class="small">${t('Place one leaf on <b>plain white paper</b> in daylight and take a photo from above. Then choose it here or drag it in.')}</p>
  <div class="row"><label class="btn sm" for="file" style="cursor:pointer">${t('Choose photo')}<input type="file" id="file" accept="image/*" hidden></label><button class="btn sm ghost" data-act="sampleleaf">${t('Use sample leaf')}</button></div></div>
 ${a?`<div class="photo">
   <div class="cv"><canvas id="cv1" width="${a.W}" height="${a.H}" role="img" aria-label="${t('Your photo')}"></canvas><span>${t('Your photo')}</span></div>
   <div class="cv"><canvas id="cv2" width="${a.W}" height="${a.H}" role="img" aria-label="${t('Colour map: where the damage is')}"></canvas><span>${t('Colour map: where the damage is')}</span></div>
   <div style="display:grid;gap:12px">
    ${a.cover<3?`<p class="sugg">${t('No leaf found. Use a photo of a leaf on white paper.')}</p>`:`
    <div class="stack" aria-hidden="true"><i style="width:${a.green}%;background:var(--leaf)"></i><i style="width:${a.yellow}%;background:var(--yellow)"></i><i style="width:${a.brown}%;background:var(--brown)"></i></div>
    <div class="legend"><div><span class="sw" style="background:var(--leaf)"></span>${t('Healthy green')}<b>${Math.round(a.green)}%</b></div><div><span class="sw" style="background:var(--yellow)"></span>${t('Yellowing')}<b>${Math.round(a.yellow)}%</b></div><div><span class="sw" style="background:var(--brown)"></span>${t('Brown or dead')}<b>${Math.round(a.brown)}%</b></div></div>
    ${(()=>{const dmg=a.yellow+a.brown,l=dmg<10?['var(--good)',t('Looks mostly healthy')]:dmg<30?['var(--warn)',t('Moderate damage')]:['var(--bad)',t('Severe damage')];return `<p class="meterline" style="color:${l[0]}">${l[1]}: ${t('{0}% of the leaf is affected',Math.round(dmg))}</p>`})()}
    ${suggestions(a).length?`<p class="sugg">${a.brown>=8&&a.yellow>=15?t('The photo shows brown patches and yellowing.'):a.brown>=8?t('The photo shows brown patches.'):t('The photo shows yellowing.')} <button class="btn sm" data-act="addsugg" style="margin-inline-start:6px">${t('Tick matching signs')}</button></p>`:''}
    <p class="small dim">${t('This measures colour only. It cannot name the disease by itself; the signs in Step 3 do that.')}</p>`}
   </div></div>`:''}
 ${a&&SAMPLE_FN?vAI():''}</section>`}
function vAI(){const ai=S.ai;return `<div class="ai"><div class="row between"><b>${t('Ask AI to look at this photo')}</b><button class="btn sm" data-act="ai" ${ai&&ai.state==='busy'?'disabled':''}>${ai&&ai.state==='busy'?t('Looking…'):t('Ask AI (needs internet)')}</button></div>
 ${!ai?`<p class="small dim">${t('Sends the photo and your ticked signs to Claude, an AI model that can read images, for a second opinion.')}</p>`:ai.state==='busy'?`<p class="small dim">${t('Looking at the photo. This can take up to a minute.')}</p>`:ai.state==='err'?`<p class="small" style="color:var(--bad)">${ai.code==='not_granted'?t('AI help was not allowed in this view.'):t('The AI could not answer right now. The diagnosis below still works without it.')}</p>`:(()=>{const r=ai.r||{};return `<div style="display:grid;gap:8px">${(r.visible_signs||[]).length?`<p class="small"><b>${t('AI sees:')}</b> ${esc(r.visible_signs.join('; '))}</p>`:''}
  ${(r.likely_problems||[]).map(p=>`<p class="small"><b>${esc(p.name)}</b> <span class="pill">${esc(p.cause)} · ${esc(p.confidence)}</span><br>${esc(p.why)}</p>`).join('')}
  ${r.advice?`<p class="small"><b>${t('First steps:')}</b> ${esc(r.advice)}</p>`:''}${r.note?`<p class="small dim">${esc(r.note)}</p>`:''}
  <p class="small dim">${t('AI answers can be wrong. Compare with the diagnosis below and confirm with an expert.')}</p></div>`})()}</div>`}
function vSigns(){return `<section class="panel" aria-labelledby="h3"><div class="head"><span class="num">${t('Step 3')}</span><h2 id="h3">${t('Tick every sign you can see')}</h2><span class="dim small">${t('{0} ticked',S.sym.size)}</span></div>
 <div class="groups">${SYM_GROUPS.map(([g,list])=>`<div class="group"><h3>${t(g)}</h3>${list.map(([k,v])=>`<label class="sym ${S.sym.has(k)?'on':''}"><input type="checkbox" id="s_${k}" data-sym="${k}" ${S.sym.has(k)?'checked':''}><span>${t(v)}</span></label>`).join('')}</div>`).join('')}</div>
 <div class="row"><b>${t('Weather in the last week:')}</b><div class="seg">${[['humid','Humid or rainy'],['dry','Dry'],['','Not sure']].map(([k,v])=>`<button data-act="weather" data-v="${k}" class="${S.weather===k?'on':''}" aria-pressed="${S.weather===k}">${t(v)}</button>`).join('')}</div></div></section>`}
function vResult(){const R=diagnose();
 return `<section class="panel" aria-labelledby="h4" id="result"><div class="head"><span class="num">${t('Diagnosis')}</span><h2 id="h4">${R.length?t('Most likely: {0}',R[0].d.name):t('Your diagnosis will appear here')}</h2></div>
 ${!S.crop?`<p class="empty">${t('Choose a crop in Step 1 to begin.')}</p>`:!S.sym.size?`<p class="empty">${t('Tick at least one sign in Step 3.')}</p>`:!R.length?`<p class="empty">${t('No problem in our list matches these signs for {0}. Show the plant to your Krishi Vigyan Kendra.',CROPS[S.crop])}</p>`:
 `<div class="dx">${R.map((r,i)=>{const d=r.d,b=bandOf(r.score);return `<article class="card ${i===0?'top1':''}"><div class="hd"><div><h3>${i+1}. ${d.name}</h3><p class="small dim"><i>${d.sci}</i></p></div><div class="row"><span class="pill">${TYPE_NOTE[d.type]}</span><span class="pill ${b[0]}">${b[1]}</span></div></div>
   <div class="conf"><div class="bar"><b style="width:${r.score}%"></b></div><strong>${r.score}%</strong></div>
   <p class="small"><b>${t('Why:')}</b> ${t('you ticked {0}.',r.hit.map(k=>'“'+lower(SYM[k])+'”').join(t(' and ')))}${r.miss.length?' '+t('Not yet seen: {0}.',r.miss.map(k=>lower(SYM[k])).join('; ')):''} ${d.spread}</p>
   <div class="cols"><div><h4>${t('Do this now')}</h4><ul>${d.now.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>${t('Prevent next season')}</h4><ul>${d.prev.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>${t('Check to confirm')}</h4><ul><li>${d.check}</li></ul></div></div></article>`}).join('')}</div>
  <p class="small dim">${t("The percentage shows how well your ticks match each problem's signs. It is not a laboratory test.")}</p>`}
 </section>`}
function vHow(){return `<section class="panel" aria-labelledby="h5"><div class="head"><span class="num">${t('For the judges')}</span><h2 id="h5">${t('How AI Crop Doctor works')}</h2></div>
 <div class="how"><div><b>${t('1. Knowledge base')}</b><span class="small dim">${t('{0} crop problems, each with its signs, cause, treatment and prevention, written from agriculture guides.',D.length)}</span></div>
 <div><b>${t('2. Colour analysis')}</b><span class="small dim">${t('Every pixel of the photo is sorted into green, yellow or brown by its hue, to measure how much of the leaf is damaged.')}</span></div>
 <div><b>${t('3. Matching engine')}</b><span class="small dim">${t('Each problem is scored on how many of its signs were seen and how many of the ticked signs it explains, then adjusted for the weather.')}</span></div>
 <div><b>${t('4. Advice')}</b><span class="small dim">${t('The top three problems are shown with the reason, first steps, prevention and how to confirm.')}</span></div></div>
 <p class="small dim">${t('Type of AI: a rule-based expert system with image colour analysis. When online, an optional AI vision model gives a second opinion on the photo.')}</p></section>
 <section class="safe"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--accent)"/><path d="M15 12c1 6 4 12 9 17 3 3 6 4 8 3l1-4-5-3-3 2c-3-2-5-5-6-8l2-3-3-5z" fill="var(--on-accent)"/></svg>
 <div><p><b>${t('Need an expert?')}</b> ${t('Call the Kisan Call Centre, free from any phone, 6 am to 10 pm.')}</p><p class="phone">1800-180-1551</p><p class="small dim">${t('Never spray a chemical without advice. Read the label, wear gloves and a mask, and keep children away.')}</p></div></section>`}
function render(){
  document.documentElement.lang=LANG;
  document.getElementById('hdr').innerHTML=vHeader();
  document.getElementById('ftr').textContent=t('AI Crop Doctor is a school science project. It gives a likely diagnosis, not a certain one. Before spraying any chemical, confirm with an agriculture officer or Krishi Vigyan Kendra, read the label and wear gloves and a mask.');
  app.innerHTML=(S.sample?`<div class="banner"><span><b>${t('Sample case:')}</b> ${t('a tomato leaf with ringed brown spots, after humid weather.')}</span><button class="btn sm ghost" data-act="fresh">${t('Start fresh')}</button></div>`:'')+vCrop()+vPhoto()+vSigns()+vResult()+vHow();
  if(S.photo){const i=new Image();i.onload=()=>{const c=document.getElementById('cv1');if(c)c.getContext('2d').drawImage(i,0,0)};i.src=S.photo.src;const c2=document.getElementById('cv2');if(c2)c2.getContext('2d').putImageData(S.photo.map,0,0)}}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function usePhoto(img){S.photo=analyse(img);S.ai=null;render()}
function loadSample(){S.crop='tomato';S.sym=new Set(['rings','yellowold']);S.weather='humid';S.sample=true;S.photo=analyse(sampleLeaf());S.ai=null;render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='lang'){if(LANGS[v]){LANG=v;try{localStorage.setItem('crop-doctor-lang',v)}catch(x){}}}
  else if(a==='crop'){S.crop=v;S.sample=false}
  else if(a==='weather'){S.weather=v}
  else if(a==='sample'){loadSample();document.getElementById('app').scrollIntoView({behavior:'smooth'});return}
  else if(a==='fresh'){S.crop='';S.sym=new Set();S.weather='';S.photo=null;S.sample=false;S.ai=null}
  else if(a==='sampleleaf'){usePhoto(sampleLeaf());return}
  else if(a==='addsugg'){suggestions(S.photo).forEach(k=>S.sym.add(k))}
  else if(a==='ai'){askAI();return}
  else return;render()});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.sym){el.checked?S.sym.add(el.dataset.sym):S.sym.delete(el.dataset.sym);S.sample=false;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.id==='file'&&el.files[0]){const r=new FileReader();r.onload=async()=>{try{usePhoto(await loadImage(r.result))}catch(x){}};r.readAsDataURL(el.files[0])}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=async()=>{try{usePhoto(await loadImage(r.result))}catch(x){}};r.readAsDataURL(f)}});
try{const l=localStorage.getItem('crop-doctor-lang');if(LANGS[l])LANG=l}catch(e){}
loadSample();
</script>
