<title>AI Crop Doctor Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700&family=Hind+Vadodara:wght@400;500;600&family=Hind:wght@400;500;600&family=Baloo+2:wght@500;700&display=swap">
<style>
/* Layout: a field-green masthead carrying the school logo, then a two-pane bench: photo on the left, the diagnosis slip on the right; stacks on phones. */
:root{
  --bg:#f3f6ee; --surface:#ffffff; --ink:#1b2a1f; --muted:#5a6b5d; --line:#d5dfcf;
  --field:#1f5a37; --field-deep:#143f26; --on-field:#ffffff; --on-field-soft:#cfe3d3;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#1f7a3d; --good-bg:#e2f3e5; --bad:#b3401c; --bad-bg:#fbe7dd; --warn:#8a6100; --warn-bg:#fbf0cf;
  --display:"Baloo Bhai 2","Baloo 2","Hind Vadodara","Hind","Noto Sans Gujarati",system-ui,sans-serif;
  --body:"Hind Vadodara","Hind","Noto Sans Gujarati",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101812; --surface:#18231b; --ink:#e8f0e6; --muted:#9db0a0; --line:#2c3b2f;
  --field:#1b4d30; --field-deep:#0f301d; --on-field:#ffffff; --on-field-soft:#b9d2be;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#7ed492; --good-bg:#173321; --bad:#f29a78; --bad-bg:#3a1f15; --warn:#e9c665; --warn-bg:#33290f;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101812; --surface:#18231b; --ink:#e8f0e6; --muted:#9db0a0; --line:#2c3b2f;
  --field:#1b4d30; --field-deep:#0f301d; --on-field:#ffffff; --on-field-soft:#b9d2be;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#7ed492; --good-bg:#173321; --bad:#f29a78; --bad-bg:#3a1f15; --warn:#e9c665; --warn-bg:#33290f;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,label.btn:focus-within,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.mast{background:linear-gradient(160deg,var(--field),var(--field-deep));color:var(--on-field);padding-inline:16px;padding-block:18px}
.mast-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.mast img{height:68px;width:auto;flex:none}
.mast-txt{flex:1 1 260px;min-width:0}
.mast h1{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:700}
.mast .sub{color:var(--on-field-soft);font-size:.95rem}
.seg{display:flex;border:1px solid var(--on-field-soft);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:transparent;color:var(--on-field);border:0;padding:6px 16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--on-field);color:var(--field-deep)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.pane{min-width:0;display:flex;flex-direction:column;gap:14px}
.pane h2{font-size:1.25rem;font-weight:700}

.drop{background:var(--surface);border:2px dashed var(--line);border-radius:14px;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted);overflow:hidden}
.drop.over{border-color:var(--accent)}
.drop.has{padding:0;border-style:solid}
.drop img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--field-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);font-weight:600}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:1.2rem;font-weight:700;flex-basis:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tips{color:var(--muted);font-size:.92rem;padding-left:1.2em;margin:0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.95rem}

.slip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.eg{align-self:flex-start;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 10px;border-radius:999px}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.verdict h3{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;min-width:0;overflow-wrap:anywhere}
.pill{font-weight:600;font-size:.9rem;padding:3px 12px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.crop{color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--field)}
.sec h4{margin:0 0 4px;font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--field)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sec h4{color:var(--good)} }
:root[data-theme="dark"] .sec h4{color:var(--good)}
.sec ul,.sec ol{margin:0;padding-left:1.3em}
.sec li{margin-block:2px}
.expert{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:.95rem}
.busy{display:flex;align-items:center;gap:12px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.tally{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.tally .score{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tally .lbl{flex:1 1 180px;min-width:0;color:var(--muted);font-size:.95rem}
.small{flex:0 1 auto;min-height:40px;font-size:.95rem}
footer{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 28px;color:var(--muted);font-size:.9rem}

.drop video{display:block;width:100%;max-height:420px;background:var(--field-deep)}
.view{display:block;width:100%;max-width:260px;border-radius:10px;border:1px solid var(--line)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.92rem;font-variant-numeric:tabular-nums}
.bars .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bars .bar i{display:block;height:100%}
.cap{color:var(--muted);font-size:.88rem}
label.pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-weight:600}
label.pick select{flex:1 1 180px;min-height:44px;padding:6px 10px;border:1.5px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
:root{--shadow:0 10px 30px rgba(20,63,38,.13),0 2px 6px rgba(20,63,38,.08)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4)} }
:root[data-theme="dark"]{--shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4)}
body{background-image:radial-gradient(900px 420px at 100% 0,var(--good-bg),transparent 70%),radial-gradient(700px 400px at 0 100%,var(--warn-bg),transparent 70%);background-attachment:fixed}
.mast{position:relative;overflow:hidden;padding-block:28px;box-shadow:var(--shadow)}
.mast::before{content:"";position:absolute;right:-90px;top:-130px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 60%,transparent),transparent 70%)}
.mast canvas{position:absolute;inset:0;width:100%;height:100%}
.mast-in{position:relative}
.mast h1{text-shadow:0 2px 14px rgba(0,0,0,.35)}
.mast img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.seg{background:rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.drop,.slip,.tally,details{box-shadow:var(--shadow)}
.drop{position:relative;border-radius:20px}
.slip,.tally{border-radius:20px}
.ph{display:flex;flex-direction:column;align-items:center;gap:10px}
.sway{transform-origin:50% 95%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.drop.scan::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--accent) 40%,transparent) 88%,var(--accent));animation:scan 1.1s ease-in-out infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.btn{transition:transform .15s,box-shadow .15s;box-shadow:0 2px 0 var(--line)}
.btn:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14)}
.btn.go{background:linear-gradient(135deg,#ffa23f,var(--accent) 55%,#e06a0c);border:0;min-height:58px;font-size:1.35rem;border-radius:14px}
.btn.go:not([disabled]){box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 50%,transparent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 85%,transparent)}}
.slip>*{animation:rise .45s ease-out backwards}
.slip>*:nth-child(2){animation-delay:.05s}.slip>*:nth-child(3){animation-delay:.1s}.slip>*:nth-child(4){animation-delay:.15s}.slip>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px)}}
.verdict{align-items:center;padding:14px 16px;border-radius:16px}
.verdict.vgood{background:linear-gradient(120deg,var(--good-bg),var(--surface))}
.verdict.vbad{background:linear-gradient(120deg,var(--bad-bg),var(--surface))}
.verdict .pill{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.vic{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--surface)}
.vic svg{width:26px;height:26px;stroke-width:3}
.vgood .vic{background:var(--good)}.vbad .vic{background:var(--bad)}
.ic{display:inline-flex;width:30px;height:30px;border-radius:9px;background:var(--good-bg);color:var(--good);align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
.sawrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-block:6px 10px}
.sawrow .bars{flex:1 1 200px;min-width:0}
.donut{flex:none;line-height:0}
.donut svg{animation:spinin .8s ease-out}
@keyframes spinin{from{transform:rotate(-120deg)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:6px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .ic{margin:0 0 4px}
.tk{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.tv{font-size:.95rem;line-height:1.35}
.view{box-shadow:var(--shadow)}
.tally .score{background:linear-gradient(135deg,var(--good),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2rem}
@media (prefers-reduced-motion: reduce){.sway,.btn.go,.slip>*,.donut svg,.drop.scan::after{animation:none!important}.btn{transition:none}}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem}
details summary{cursor:pointer;font-weight:600}
details input{width:100%;margin-block:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
</style>

  }catch(e){stream=null;msgKey="camfail";renderAll();try{$("in-cam").click()}catch(_){}}
};
const drop=$("drop");
drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");setFile(e.dataTransfer.files[0])};

// Colour analysis: separate the leaf from a light background, then measure green, yellow and brown areas.
function analyse(image){
  const W=220,H=Math.max(1,Math.round(W*image.naturalHeight/image.naturalWidth)),c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.drawImage(image,0,0,W,H);const im=x.getImageData(0,0,W,H),p=im.data;let leaf=0,g=0,y=0,b=0;
  for(let i=0;i<p.length;i+=4){
    const R=p[i]/255,G=p[i+1]/255,B=p[i+2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),dl=mx-mn,s=mx?dl/mx:0;
    let h=0;if(dl){h=mx===R?((G-B)/dl)%6:mx===G?(B-R)/dl+2:(R-G)/dl+4;h*=60;if(h<0)h+=360}
    const isLeaf=(s>0.22&&mx>0.12&&(h<175||h>345))||(mx<0.3&&s>0.1&&(h<175||h>345));
    if(!isLeaf){p[i]=p[i+1]=p[i+2]=235;continue}
    leaf++;
    if(h>=68&&h<175&&mx>=0.22){g++;p[i]=R*110+40;p[i+1]=G*150+60;p[i+2]=B*110+40}
    else if(h>=42&&h<68&&mx>=0.45){y++;p[i]=255;p[i+1]=150;p[i+2]=0}
    else{b++;p[i]=220;p[i+1]=30;p[i+2]=40}
  }
  x.putImageData(im,0,0);
  if(leaf<W*H*0.06)return{key:"none",mode:"C"};
  const fr={g:g/leaf,y:y/leaf,b:b/leaf};
  const key=fr.b>=0.08&&fr.b>=fr.y*0.6?"spot":fr.y>=0.22?"yellow":fr.b>=0.08?"spot":"healthy";
  return{key,fr,view:c,mode:"C"};
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)})}
async function classify(image){
  if(!model){
    if(!window.tmImage){await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js");await loadScript("https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js")}
    const u=modelUrl.replace(/\/?$/,"/");model=await tmImage.load(u+"model.json",u+"metadata.json");
  }
  const pr=await model.predict(image);pr.sort((a,b)=>b.probability-a.probability);
  const top=pr[0],n=top.className.toLowerCase(),hit=KEYS.find(([w])=>n.includes(w));
  return{key:hit?hit[1]:"other",label:top.className,conf:Math.round(top.probability*100),mode:"M"};
}
$("go").onclick=async()=>{
  if(!img||busy)return;busy=true;msgKey=null;renderAll();
  await new Promise(r=>setTimeout(r,1300));
  let r=analyse(img);
  if(modelUrl&&r.key!=="none"){try{const m=await classify(img);m.fr=r.fr;m.view=r.view;r=m}catch(e){msgKey="modelfail"}}
  current=r;isExample=false;marked=r.key==="none";busy=false;renderAll();
};
$("save").onclick=()=>{modelUrl=$("model").value.trim();model=null;store.set("cropweb-model",modelUrl);$("save").textContent="✔"};
function mark(ok){if(marked)return;marked=true;tally.total++;if(ok)tally.ok++;store.set("cropweb-tally",JSON.stringify(tally));renderAll()}
$("ok").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
$("reset").onclick=()=>{if(!resetArmed){resetArmed=true;renderAll();setTimeout(()=>{resetArmed=false;renderAll()},3000);return}resetArmed=false;tally={ok:0,total:0};store.set("cropweb-tally",JSON.stringify(tally));renderAll()};
$("crop").onchange=e=>{crop=e.target.value;store.set("cropweb-crop",crop);renderAll()};
renderAll();
try{(function(){const c=$("fx"),x=c.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;let W=0,H=0,L=[];
function size(){const r=c.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
function mk(){return{x:Math.random()*W,y:Math.random()*H,s:12+Math.random()*30,a:Math.random()*6.28,va:(Math.random()-.5)*.006,vx:.1+Math.random()*.25,vy:.04+Math.random()*.1,o:.05+Math.random()*.1}}
function leaf(l){x.save();x.translate(l.x,l.y);x.rotate(l.a);x.globalAlpha=l.o;x.fillStyle="#fff";x.beginPath();x.moveTo(0,-l.s);x.bezierCurveTo(l.s*.8,-l.s*.5,l.s*.8,l.s*.5,0,l.s);x.bezierCurveTo(-l.s*.8,l.s*.5,-l.s*.8,-l.s*.5,0,-l.s);x.fill();x.globalAlpha=Math.min(1,l.o*2.5);x.strokeStyle="#143f26";x.lineWidth=1;x.beginPath();x.moveTo(0,-l.s*.8);x.lineTo(0,l.s*.9);x.stroke();x.restore()}
function frame(){x.clearRect(0,0,W,H);for(const l of L){if(!still){l.x+=l.vx;l.y+=l.vy;l.a+=l.va;if(l.x>W+50)l.x=-50;if(l.y>H+50)l.y=-50}leaf(l)}if(!still)requestAnimationFrame(frame)}
size();L=Array.from({length:Math.max(12,Math.round(W/60))},mk);frame();addEventListener("resize",()=>{size();if(still)frame()});})()}catch(e){}
</script>
