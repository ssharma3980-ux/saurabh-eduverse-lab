<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Crop Doctor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
/* Layout: a field-green masthead carrying the school logo, then a two-pane bench: photo on the left, the diagnosis slip on the right; stacks on phones. */
:root{
  --bg:#f3f6ee; --surface:#ffffff; --ink:#1b2a1f; --muted:#5a6b5d; --line:#d5dfcf;
  --field:#1f5a37; --field-deep:#143f26; --on-field:#ffffff; --on-field-soft:#cfe3d3;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#1f7a3d; --good-bg:#e2f3e5; --bad:#b3401c; --bad-bg:#fbe7dd; --warn:#8a6100; --warn-bg:#fbf0cf;
  --display:"Baloo Bhai 2","Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;
  --body:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101812; --surface:#18231b; --ink:#e8f0e6; --muted:#9db0a0; --line:#2c3b2f;
  --field:#1b4d30; --field-deep:#0f301d; --on-field:#ffffff; --on-field-soft:#b9d2be;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#7ed492; --good-bg:#173321; --bad:#f29a78; --bad-bg:#3a1f15; --warn:#e9c665; --warn-bg:#33290f;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101812; --surface:#18231b; --ink:#e8f0e6; --muted:#9db0a0; --line:#2c3b2f;
  --field:#1b4d30; --field-deep:#0f301d; --on-field:#ffffff; --on-field-soft:#b9d2be;
  --accent:#f58220; --on-accent:#2a1500;
  --good:#7ed492; --good-bg:#173321; --bad:#f29a78; --bad-bg:#3a1f15; --warn:#e9c665; --warn-bg:#33290f;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,label.btn:focus-within,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.mast{background:linear-gradient(160deg,var(--field),var(--field-deep));color:var(--on-field);padding-inline:16px;padding-block:18px}
.mast-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.mast img{height:68px;width:auto;flex:none}
.mast-txt{flex:1 1 260px;min-width:0}
.mast h1{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:700}
.mast .sub{color:var(--on-field-soft);font-size:.95rem}
.seg{display:flex;border:1px solid var(--on-field-soft);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:transparent;color:var(--on-field);border:0;padding:6px 16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--on-field);color:var(--field-deep)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.pane{min-width:0;display:flex;flex-direction:column;gap:14px}
.pane h2{font-size:1.25rem;font-weight:700}

.drop{background:var(--surface);border:2px dashed var(--line);border-radius:14px;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted);overflow:hidden}
.drop.over{border-color:var(--accent)}
.drop.has{padding:0;border-style:solid}
.drop img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--field-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);font-weight:600}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:1.2rem;font-weight:700;flex-basis:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tips{color:var(--muted);font-size:.92rem;padding-left:1.2em;margin:0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.95rem}

.slip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.eg{align-self:flex-start;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 10px;border-radius:999px}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.verdict h3{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;min-width:0;overflow-wrap:anywhere}
.pill{font-weight:600;font-size:.9rem;padding:3px 12px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.crop{color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--field)}
.sec h4{margin:0 0 4px;font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--field)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sec h4{color:var(--good)} }
:root[data-theme="dark"] .sec h4{color:var(--good)}
.sec ul,.sec ol{margin:0;padding-left:1.3em}
.sec li{margin-block:2px}
.expert{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:.95rem}
.busy{display:flex;align-items:center;gap:12px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.tally{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.tally .score{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tally .lbl{flex:1 1 180px;min-width:0;color:var(--muted);font-size:.95rem}
.small{flex:0 1 auto;min-height:40px;font-size:.95rem}
footer{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 28px;color:var(--muted);font-size:.9rem}
</style>

    sub:"હનીફા સ્કૂલ, બોરસદ · ગણિત-વિજ્ઞાન પ્રદર્શન 2026-27 · વિભાગ 1-A: બહેતર જીવન માટે AI",

    drop:"પાનનો ફોટો અહીં દેખાશે. નીચેથી ફોટો પાડો અથવા અપલોડ કરો.",
    cam:"📷 ફોટો પાડો", up:"🖼 ફોટો અપલોડ કરો", go:"પાન તપાસો", stop:"રોકો",
    tips:["એક જ પાન, સફેદ કાગળ પર રાખો.","સારા પ્રકાશમાં, પાન આખું દેખાય તેમ ફોટો પાડો.","ડાઘવાળો ભાગ સ્પષ્ટ દેખાવો જોઈએ."],
    busy:"AI પાનને ધ્યાનથી જોઈ રહ્યું છે… 10 થી 40 સેકન્ડ લાગી શકે.",
    example:"ઉદાહરણ", crop:"પાક", conf:"AI નો વિશ્વાસ",
    healthy:"તંદુરસ્ત", diseased:"રોગ જણાયો", unclear:"સ્પષ્ટ નથી",
    signs:"ફોટામાં શું દેખાયું", cause:"કારણ", remedy:"ઉપાય", prevention:"ફરી ન થાય તે માટે",
    speak:"🔊 સાંભળો", notplant:"આ ફોટામાં પાન દેખાતું નથી. પાનનો નજીકથી ફોટો આપો.",
    tally:"સાચા જવાબ / કુલ તપાસ. દરેક તપાસ પછી નોંધો:", ok:"✔ સાચું", no:"✘ ખોટું", reset:"શૂન્ય કરો", reset2:"ફરી દબાવો",
    foot:"AI ભૂલ કરી શકે છે. દવા છાંટતા પહેલાં કૃષિ વિજ્ઞાન કેન્દ્ર અથવા આણંદ કૃષિ યુનિવર્સિટીના નિષ્ણાતની સલાહ લો.",
    noai:"AI જોડાયું નથી. આ પેજ Claude માં સાઇન-ઇન કરીને ખોલો અને ઇન્ટરનેટ ચાલુ રાખો.",
    err:{not_granted:"Claude વાપરવાની મંજૂરી મળી નથી. પેજ ફરી ખોલો અને Allow દબાવો.",rate_limited:"હમણાં ઘણી તપાસ થઈ. થોડી વાર પછી ફરી પ્રયત્ન કરો.",image_rejected:"આ ફોટો વાંચી શકાયો નથી. બીજો JPG અથવા PNG ફોટો આપો.",session_expired:"Claude માં ફરી સાઇન-ઇન કરો.",refused:"AI આ ફોટો તપાસી શક્યું નથી. બીજો ફોટો આપો.",invalid_json:"જવાબ અધૂરો આવ્યો. ફરી 'પાન તપાસો' દબાવો.",other:"જોડાણમાં તકલીફ પડી. ઇન્ટરનેટ તપાસો અને ફરી પ્રયત્ન કરો."}
  },
  en: {
    title:"AI Crop Doctor",
    sub:"Hanifa School, Borsad · Maths-Science Exhibition 2026-27 · Section 1-A: AI for Better Life",
    step1:"1. Give a leaf photo", step2:"2. AI diagnosis",
    drop:"The leaf photo will appear here. Take a photo or upload one below.",
    cam:"📷 Take photo", up:"🖼 Upload photo", go:"Check the leaf", stop:"Stop",
    tips:["Place one leaf on white paper.","Use good light and keep the whole leaf in the frame.","The spotted part should be clearly visible."],
    busy:"The AI is looking closely at the leaf… this can take 10 to 40 seconds.",
    example:"Example", crop:"Crop", conf:"AI confidence",
    healthy:"Healthy", diseased:"Disease found", unclear:"Not clear",

    tally:"Correct answers / total checks. Mark after each check:", ok:"✔ Correct", no:"✘ Wrong", reset:"Reset", reset2:"Tap again",

    noai:"The AI is not connected. Open this page while signed in to Claude, with the internet on.",
    err:{not_granted:"Permission to use Claude was not given. Reopen the page and tap Allow.",rate_limited:"Too many checks just now. Try again in a little while.",image_rejected:"This photo could not be read. Give another JPG or PNG photo.",session_expired:"Sign in to Claude again.",refused:"The AI could not check this photo. Give another photo.",invalid_json:"The answer came back incomplete. Tap 'Check the leaf' again.",other:"There was a connection problem. Check the internet and try again."}
  }
};

const EXAMPLE = {
  is_plant:true, status:"diseased", confidence:86,
  crop:{en:"Tomato",gu:"ટામેટા"},
  name:{en:"Early blight",gu:"આગોતરો સુકારો"},
  signs:{en:["Brown spots with ring patterns, like a target","Yellowing around the spots","Older, lower leaf affected first"],gu:["નિશાન જેવા ગોળ વલયવાળા કથ્થઈ ડાઘ","ડાઘની આસપાસ પીળાશ","નીચેના જૂના પાન પર પહેલા અસર"]},
  cause:{en:"A fungus (Alternaria) that spreads in warm, humid weather and through water splashing from the soil.",gu:"ફૂગ (અલ્ટરનેરિયા), જે ગરમ અને ભેજવાળા વાતાવરણમાં અને જમીન પરથી ઊડતા પાણીના છાંટાથી ફેલાય છે."},
  remedy:{en:["Remove the infected leaves and destroy them away from the field","Water at the base of the plant, not over the leaves","Spray neem-based solution on the remaining leaves"],gu:["રોગવાળા પાન તોડીને ખેતરથી દૂર નાશ કરો","પાણી પાન પર નહીં, છોડના થડ પાસે આપો","બાકીના પાન પર લીમડા આધારિત દ્રાવણ છાંટો"]},
  prevention:{en:["Keep space between plants for air flow","Do not grow tomato in the same plot every year","Cover the soil with mulch"],gu:["હવાની અવરજવર માટે છોડ વચ્ચે જગ્યા રાખો","દર વર્ષે એક જ જગ્યાએ ટામેટા ન વાવો","જમીન પર આચ્છાદન (મલ્ચ) કરો"]},
  expert:{en:"If more than a quarter of the plants are affected, contact the Krishi Vigyan Kendra.",gu:"ચોથા ભાગથી વધુ છોડમાં રોગ હોય તો કૃષિ વિજ્ઞાન કેન્દ્રનો સંપર્ક કરો."}
};

const PROMPT = `You are the engine of "AI Crop Doctor", a school science-exhibition project in Anand district, Gujarat, India. The attached image is a photo a student or farmer took of a plant leaf.

Look carefully at the leaf: colour, spots, rings, powder, curling, holes, wilting. Identify the crop if you can, and decide whether the leaf is healthy or shows a disease, pest damage or nutrient deficiency. Name the most likely problem. If the photo does not show a plant or leaf, set is_plant to false. If you cannot tell, use status "unclear" and a low confidence; do not guess a name confidently.

Remedies must be simple, safe and low-cost for a small farmer: removing infected parts, watering habits, spacing, neem-based sprays, crop rotation. Do not give chemical pesticide names or doses; instead tell the farmer when to consult an agriculture expert.

Write every text field twice: plain English ("en") and simple, natural Gujarati in Gujarati script ("gu") that a farmer understands. Keep each list to 2-4 short items.

Reply with only one JSON object in exactly this shape:
{"is_plant":true,"status":"healthy|diseased|unclear","confidence":0-100,"crop":{"en":"","gu":""},"name":{"en":"","gu":""},"signs":{"en":[""],"gu":[""]},"cause":{"en":"","gu":""},"remedy":{"en":[""],"gu":[""]},"prevention":{"en":[""],"gu":[""]},"expert":{"en":"","gu":""}}
For a healthy leaf, "name" is "Healthy leaf" / "તંદુરસ્ત પાન", "cause" is empty, and "remedy" holds care tips.`;

const $ = id => document.getElementById(id);
let lang = "gu", file = null, current = EXAMPLE, isExample = true, busy = false, ctl = null, sample = null, sampleReady = false;
let tally = {ok:0,total:0}, marked = true, msgKey = null, resetArmed = false;
try { const s = JSON.parse(localStorage.getItem("cropdoc-tally")); if (s && s.total >= s.ok) tally = {ok:+s.ok||0,total:+s.total||0}; } catch(e){}
try { const l = localStorage.getItem("cropdoc-lang"); if (l === "en" || l === "gu") lang = l; } catch(e){}

function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function pick(o){ return o && typeof o === "object" ? (o[lang] ?? o.en ?? "") : ""; }
function list(o){ const v = pick(o); return Array.isArray(v) ? v.map(String).filter(Boolean) : (v ? [String(v)] : []); }

function renderSlip(){
  const t = T[lang], slip = $("slip"); slip.replaceChildren();
  if (busy){ const b = el("div","busy"); b.append(el("span","spin"), el("span",null,t.busy)); slip.append(b); return; }
  const r = current;
  if (isExample) slip.append(el("span","eg",t.example));
  if (!r.is_plant){ slip.append(el("p",null,t.notplant)); return; }
  const st = ["healthy","diseased","unclear"].includes(r.status) ? r.status : "unclear";
  const v = el("div","verdict");
  v.append(el("h3",null,String(pick(r.name)) || t[st]), el("span","pill "+({healthy:"good",diseased:"bad",unclear:"warn"})[st], t[st]));
  slip.append(v);
  const crop = String(pick(r.crop)); if (crop) slip.append(el("p","crop", t.crop+": "+crop));
  const c = Math.max(0, Math.min(100, Math.round(Number(r.confidence)||0)));
  const m = el("div","meter"), bar = el("span","bar"), fill = el("i"); fill.style.width = c+"%"; bar.append(fill);
  m.append(el("span",null,t.conf), bar, el("span",null,c+"%")); slip.append(m);
  const sec = (title, items, ordered) => { if (!items.length) return; const s = el("div","sec"); s.append(el("h4",null,title));
    if (items.length === 1 && !ordered) s.append(el("p",null,items[0])); else { const l = el(ordered?"ol":"ul"); items.forEach(i => l.append(el("li",null,i))); s.append(l); } slip.append(s); };
  sec(t.signs, list(r.signs)); sec(t.cause, list(r.cause)); sec(t.remedy, list(r.remedy), true); sec(t.prevention, list(r.prevention));
  const ex = String(pick(r.expert)); if (ex) slip.append(el("p","expert",ex));
  if ("speechSynthesis" in window){ const sp = el("button","btn small",t.speak); sp.type = "button"; sp.onclick = speak; slip.append(sp); }
}

function speak(){
  try {
    const t = T[lang], r = current, parts = [String(pick(r.name)), t.remedy, ...list(r.remedy)];
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(parts.join(". ")); u.lang = lang === "gu" ? "gu-IN" : "en-IN"; u.rate = .95;
    speechSynthesis.speak(u);
  } catch(e){}
}

function renderAll(){
  const t = T[lang];
  $("t-title").textContent = t.title; $("t-sub").textContent = t.sub; $("t-step1").textContent = t.step1; $("t-step2").textContent = t.step2;
  if ($("t-drop")) $("t-drop").textContent = t.drop;
  $("t-cam").textContent = t.cam; $("t-up").textContent = t.up; $("go").textContent = t.go; $("stop").textContent = t.stop;
  $("t-tips").replaceChildren(...t.tips.map(x => el("li",null,x)));
  $("t-tally").textContent = t.tally; $("ok").textContent = t.ok; $("no").textContent = t.no; $("reset").textContent = resetArmed ? t.reset2 : t.reset;
  $("t-foot").textContent = t.foot;
  $("lang-gu").setAttribute("aria-pressed", lang === "gu"); $("lang-en").setAttribute("aria-pressed", lang === "en");
  $("score").textContent = tally.ok + " / " + tally.total;
  const msg = $("msg"); msg.hidden = !msgKey; if (msgKey) msg.textContent = msgKey === "noai" ? t.noai : (t.err[msgKey] || t.err.other);
  $("go").disabled = busy || !file || !sample; $("stop").hidden = !busy;
  $("ok").disabled = $("no").disabled = marked || busy;
  renderSlip();
}

function setLang(l){ lang = l; try { localStorage.setItem("cropdoc-lang", l); } catch(e){} renderAll(); }
$("lang-gu").onclick = () => setLang("gu"); $("lang-en").onclick = () => setLang("en");

let url = null;
function setFile(f){
  if (!f || !/^image\//.test(f.type)) return;
  file = f; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(f);
  const img = new Image(); img.alt = "Leaf photo"; img.src = url;
  const d = $("drop"); d.classList.add("has"); d.replaceChildren(img);
  msgKey = sampleReady && !sample ? "noai" : null; renderAll();
}
$("in-cam").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };
$("in-file").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); };

$("go").onclick = async () => {
  if (!file || !sample || busy) return;
  busy = true; msgKey = null; ctl = new AbortController(); renderAll();
  try {
    const r = await sample.json(PROMPT, { images: file, signal: ctl.signal });
    if (!r || typeof r !== "object") throw {code:"invalid_json"};
    current = r; isExample = false; marked = !r.is_plant;
  } catch(e){
    if (!e || e.code !== "cancelled") msgKey = (e && e.code) || "other";
  } finally { busy = false; renderAll(); }
};
$("stop").onclick = () => ctl && ctl.abort();

function mark(ok){ if (marked) return; marked = true; tally.total++; if (ok) tally.ok++; saveTally(); renderAll(); }
function saveTally(){ try { localStorage.setItem("cropdoc-tally", JSON.stringify(tally)); } catch(e){} }
$("ok").onclick = () => mark(true); $("no").onclick = () => mark(false);
$("reset").onclick = () => {
  if (!resetArmed){ resetArmed = true; renderAll(); setTimeout(() => { resetArmed = false; renderAll(); }, 3000); return; }
  resetArmed = false; tally = {ok:0,total:0}; saveTally(); renderAll();
};

renderAll();
(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch(e){ sample = null; }
  if (sample){
    try { const lim = await sample.limits(); if (!lim.images) sample = null; else $("in-file").accept = lim.images.mediaTypes.join(","); } catch(e){ sample = null; }
  }
  sampleReady = true; if (!sample) msgKey = "noai"; renderAll();
})();
</script>
