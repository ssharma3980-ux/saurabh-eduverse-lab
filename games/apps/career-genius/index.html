<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Career Genius</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
/* Layout: a navy school band carries the white logo and the language switch; below it one working column (max 1040px)
   that moves through five short steps and ends in a tabbed results desk. Orange is used only for action and "observed" data.
   All spacing uses logical properties so the Urdu view mirrors cleanly. */
:root{
  --band:#14213D; --band-fg:#FFFFFF; --band-dim:#B9C3DA;
  --bg:#F2F4F9; --panel:#FFFFFF; --line:#D5DAE6; --fg:#131C33; --dim:#55607A;
  --accent:#F58220; --accent-ink:#A84A00; --on-accent:#14213D;
  --self:#5B6FA8; --good:#1C7A4C; --warn:#9A6200; --bad:#B3261E; --soft:#E8ECF5; --paper:#FFFFFF;
  --script:"Noto Sans Devanagari","Noto Sans Gujarati","Noto Naskh Arabic","Nirmala UI","Segoe UI",Tahoma;
  --display:"Bricolage Grotesque",var(--script),"Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",var(--script),Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --band:#0A1122; --band-fg:#FFFFFF; --band-dim:#A9B4CE;
  --bg:#0F172B; --panel:#18223B; --line:#2D3A5C; --fg:#EDF0F8; --dim:#A7B1C9;
  --accent:#F58220; --accent-ink:#FFA75A; --on-accent:#14213D;
  --self:#8EA2DC; --good:#5FD39A; --warn:#F0BA55; --bad:#FF8A80; --soft:#222E4D; --paper:#FFFFFF; color-scheme:dark } }
:root[data-theme="dark"]{
  --band:#0A1122; --band-fg:#FFFFFF; --band-dim:#A9B4CE;
  --bg:#0F172B; --panel:#18223B; --line:#2D3A5C; --fg:#EDF0F8; --dim:#A7B1C9;
  --accent:#F58220; --accent-ink:#FFA75A; --on-accent:#14213D;
  --self:#8EA2DC; --good:#5FD39A; --warn:#F0BA55; --bad:#FF8A80; --soft:#222E4D; --paper:#FFFFFF; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);margin:0}
#root:not([lang=en]){line-height:1.8}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.12;margin:0}
#root:not([lang=en]) :is(h1,h2,h3){line-height:1.45}
h2{font-size:1.7rem;font-weight:700} h3{font-size:1.15rem;font-weight:700}
p{margin:0} a{color:var(--accent-ink)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px}
.band{background:var(--band);color:var(--band-fg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.top img{height:54px;width:auto;display:block}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;text-align:end;line-height:1.1}
.brand small{display:block;font:400 .78rem var(--body);color:var(--band-dim);letter-spacing:.02em}
.top select{width:auto;background:var(--band);color:#fff;border-color:#5A678A;padding:7px 10px;font-size:.95rem}
nav.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.steps .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.steps button{flex:none;background:none;border:0;font:700 .9rem var(--body);color:var(--dim);padding:8px 12px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.steps button i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:.72rem}
.steps button.done{color:var(--good)} .steps button.on{background:var(--band);color:#fff}
.steps button:disabled{opacity:.45;cursor:not-allowed}
main{padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
.hero{padding-block:36px 44px}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:center}
.hero img{width:100%;max-width:380px;justify-self:center}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}
#root:not([lang=en]) .hero h1{font-size:clamp(1.8rem,5vw,2.9rem);letter-spacing:0}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--band-dim);font-size:1.1rem;margin-top:14px;max-width:34em}
.hero .row{margin-top:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.plain{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.eyebrow{font:700 .76rem var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink)}
#root:not([lang=en]) :is(.eyebrow,th,.pill){letter-spacing:0;font-size:.85rem}
.dim{color:var(--dim)} .small{font-size:.9rem} .lead{font-size:1.08rem;max-width:62ch}
.btn{font:700 1rem var(--body);border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:11px 20px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.band .btn.ghost{color:#fff;border-color:#5A678A}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem;min-width:0}
input[type=text],input[type=date],input[type=url],select{font:1rem var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:400 .95rem var(--body);border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--band);border-color:var(--band);color:#fff;font-weight:700}
.band .chip{background:transparent;color:#fff;border-color:#5A678A} .band .chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sgroup{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.sgroup:first-of-type{border-top:0}
.sgroup b{padding-top:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:400 .88rem var(--body);background:var(--bg);color:var(--fg);border:0;border-inline-start:1.5px solid var(--line);padding:8px 12px;cursor:pointer}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:start;font:1rem var(--body);background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:6px;padding:13px 16px;cursor:pointer}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)} .opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.note{border-inline-start:4px solid var(--accent);background:var(--soft);padding:12px 16px;border-radius:4px;font-size:.95rem}
.note.ok{border-color:var(--good)} .note.no{border-color:var(--bad)}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.92rem}
.bar .t{display:grid;gap:3px}
.bar .t span{height:11px;background:var(--soft);border-radius:2px;display:block;position:relative}
.bar .t span b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:2px;background:var(--accent)}
.bar .t span.s b{background:var(--self)}
.bar .v{font-variant-numeric:tabular-nums;text-align:end;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--accent);margin-inline-end:6px;vertical-align:-1px}
.legend i.s{background:var(--self)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{flex:none;font:700 1rem var(--display);background:none;border:0;color:var(--dim);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.score{font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.score small{font:400 .8rem var(--body);color:var(--dim)}
.career{border-top:1px solid var(--line);padding-block:16px}
.career:first-child{border-top:0}
.career summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.career summary .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.career summary::-webkit-details-marker{display:none}
.career .rank{font:800 1rem var(--display);color:var(--dim);width:2ch;font-variant-numeric:tabular-nums}
.career .body{display:grid;gap:16px;margin-top:16px;padding-inline-start:calc(2ch + 16px)}
.pill{display:inline-block;font:700 .74rem var(--body);letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.pg{border-color:var(--good);color:var(--good)} .pill.pw{border-color:var(--warn);color:var(--warn)} .pill.pb{border-color:var(--bad);color:var(--bad)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.tick li{padding-inline-start:26px;position:relative}
ul.tick li::before{content:"";position:absolute;inset-inline-start:2px;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--accent)}
ol.acts{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.check.d span{text-decoration:line-through;color:var(--dim)}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:560px}
table.kv{min-width:0}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top} th{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pages{display:grid;gap:18px;justify-items:center}
.pages canvas{width:100%;max-width:660px;height:auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(10,17,34,.18)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,200px) 48px;gap:12px;align-items:center;font-size:.93rem}
.wrow input{accent-color:var(--accent);width:100%}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.links a{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 14px;text-decoration:none;background:var(--bg);color:var(--fg);min-width:0}
.links a b{display:block} .links a span{font-size:.82rem;color:var(--dim);word-break:break-all;direction:ltr;unicode-bidi:isolate;display:block}
.phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding-block:16px;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase h3{color:var(--accent-ink)}
footer{padding-block:24px 40px;font-size:.85rem;color:var(--dim);border-top:1px solid var(--line)}
@media (max-width:760px){
  body{font-size:16px} .hero .wrap,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .hero img{max-width:240px;order:-1;justify-self:start} .q,.sgroup{grid-template-columns:minmax(0,1fr)}
  .sgroup b{padding-top:0}
  .phase{grid-template-columns:minmax(0,1fr);gap:8px} .career .body{padding-inline-start:0}
  .career summary{grid-template-columns:auto minmax(0,1fr)} .career summary .tags{grid-column:2;justify-content:flex-start}
  .top img{height:42px} .panel{padding:16px} .wrow{grid-template-columns:minmax(0,1fr) 90px 44px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){ .meter b,.bar .t span b{transition:width .4s ease} }
</style>

 from one airport to another.": "यात्री या मालवाहक विमान को एक हवाई अड्डे से दूसरे तक सुरक्षित उड़ाते हैं।", "Runs hotel or restaurant services, or leads the kitchen that cooks for guests.": "होटल या रेस्तराँ की सेवाएँ चलाते हैं, या मेहमानों के लिए खाना बनाने वाली रसोई का नेतृत्व करते हैं।", "Qualification & eligibility": "योग्यता और पात्रता", "Subjects & skills": "विषय और कौशल", "Preferences & constraints": "प्राथमिकताएँ और सीमाएँ", "Employment outlook": "रोज़गार की संभावना", "Doing an experiment to find out why something happens": "कोई चीज़ क्यों होती है, यह जानने के लिए प्रयोग करना", "Reading or watching videos about space, atoms or living things": "अंतरिक्ष, परमाणु या जीव-जंतुओं के बारे में पढ़ना या वीडियो देखना", "Making a game, app or website work": "कोई गेम, ऐप या वेबसाइट बनाकर चलाना", "Finding out how computers, phones or AI tools work inside": "यह पता लगाना कि कंप्यूटर, फ़ोन या AI टूल अंदर से कैसे काम करते हैं", "Learning how the human body works and how illness is treated": "यह सीखना कि मानव शरीर कैसे काम करता है और बीमारी का इलाज कैसे होता है", "Looking after someone who is hurt or unwell": "किसी घायल या बीमार की देखभाल करना", "Explaining a topic to a friend until they understand it": "दोस्त को कोई विषय तब तक समझाना जब तक वह समझ न जाए", "Planning a lesson, quiz or activity for others": "दूसरों के लिए पाठ, क्विज़ या गतिविधि की योजना बनाना", "Working out profit, price and savings for a stall or shop": "किसी स्टॉल या दुकान के लिए लाभ, क़ीमत और बचत का हिसाब लगाना", "Following how companies, markets and money work": "यह समझना कि कंपनियाँ, बाज़ार और पैसा कैसे काम करते हैं", "Drawing, designing, editing videos or making music": "चित्र बनाना, डिज़ाइन करना, वीडियो संपादित करना या संगीत बनाना", "Writing stories, scripts or articles": "कहानियाँ, पटकथाएँ या लेख लिखना", "Debating rules, rights and what is fair": "नियमों, अधिकारों और क्या उचित है, इस पर बहस करना", "Following news about the country and how it is run": "देश और उसके संचालन की ख़बरों पर नज़र रखना", "Opening up a machine or building a model to see how it works": "मशीन खोलकर या मॉडल बनाकर देखना कि वह कैसे काम करती है", "Fixing things with tools at home or in the lab": "घर या लैब में औज़ारों से चीज़ें ठीक करना", "Growing plants or looking after animals": "पौधे उगाना या जानवरों की देखभाल करना", "Working outdoors and protecting nature": "खुले में काम करना और प्रकृति की रक्षा करना", "Listening to a friend’s problem and helping them sort it out": "दोस्त की परेशानी सुनना और उसे सुलझाने में मदद करना", "Organising a team for an event or a cause": "किसी आयोजन या उद्देश्य के लिए टीम बनाना और सँभालना", "Riya is taller than Sana. Sana is taller than Tara. Who is the shortest?": "रिया सना से लंबी है। सना तारा से लंबी है। सबसे छोटी कौन है?", "Riya": "रिया", "Sana": "सना", "Tara": "तारा", "Cannot say": "कह नहीं सकते", "Riya > Sana > Tara, so Tara is the shortest.": "रिया > सना > तारा, इसलिए तारा सबसे छोटी है।", "Which number is the odd one out?  3, 7, 11, 14, 19": "कौन-सी संख्या बाक़ी से अलग है?  3, 7, 11, 14, 19", "14 is the only even number; the others are all odd (and prime).": "14 अकेली सम संख्या है; बाक़ी सभी विषम (और अभाज्य) हैं।", "In a code, CAT is written as DBU. How is DOG written?": "एक कोड में CAT को DBU लिखा जाता है। DOG कैसे लिखा जाएगा?", "Each letter moves one step forward: D→E, O→P, G→H.": "हर अक्षर एक क़दम आगे बढ़ता है: D→E, O→P, G→H।", "Five friends sit in a row. C is at the left end and E is at the right end. A is not at either end. B sits immediately to the right of A. D is not next to B. Who sits in the middle?": "पाँच दोस्त एक क़तार में बैठे हैं। C बाएँ सिरे पर और E दाएँ सिरे पर है। A किसी सिरे पर नहीं है। B, A के ठीक दाईं ओर बैठा है। D, B के बग़ल में नहीं है। बीच में कौन बैठा है?", "Try A in seat 2: B is 3, so D must be 4, which is next to B. Not allowed. So A is in seat 3: C D A B E. The middle is A.": "A को सीट 2 पर रखें: B सीट 3 पर, तो D को सीट 4 पर होना पड़ेगा, जो B के बग़ल में है। यह मान्य नहीं। इसलिए A सीट 3 पर है: C D A B E। बीच में A है।", "One notebook costs ₹45. How much do 6 notebooks cost?": "एक कॉपी ₹45 की है। 6 कॉपियाँ कितने की होंगी?", "What is 25% of 240?": "240 का 25% कितना है?", "25% is one quarter. 240 ÷ 4 = 60.": "25% यानी एक चौथाई। 240 ÷ 4 = 60।", "A bag is marked at ₹800 and sold at a 15% discount. What is the selling price?": "एक बैग पर ₹800 अंकित है और वह 15% छूट पर बिकता है। विक्रय मूल्य क्या है?", "15% of 800 is 120. 800 − 120 = 680.": "800 का 15% है 120। 800 − 120 = 680।", "A train travels 180 km at 60 km/h and returns the same 180 km at 90 km/h. What is its average speed for the whole trip?": "एक ट्रेन 180 किमी 60 किमी/घंटा से जाती है और वही 180 किमी 90 किमी/घंटा से लौटती है। पूरी यात्रा की औसत गति क्या है?", "75 km/h": "75 किमी/घंटा", "72 km/h": "72 किमी/घंटा", "70 km/h": "70 किमी/घंटा", "78 km/h": "78 किमी/घंटा", "Time out = 3 h, time back = 2 h. Total 360 km in 5 h = 72 km/h. Average speed is total distance ÷ total time, not the average of the two speeds.": "जाने का समय = 3 घंटे, लौटने का = 2 घंटे। कुल 360 किमी 5 घंटे में = 72 किमी/घंटा। औसत गति कुल दूरी ÷ कुल समय है, दोनों गतियों का औसत नहीं।", "Which word is closest in meaning to “rapid”?": "“तीव्र” के सबसे निकट अर्थ वाला शब्द कौन-सा है?", "Quiet": "शांत", "Quick": "तेज़", "Rough": "खुरदरा", "Late": "देर", "Rapid means fast or quick.": "तीव्र का अर्थ है तेज़।", "Which word is the opposite of “ancient”?": "“प्राचीन” का विलोम शब्द कौन-सा है?", "Old": "पुराना", "Huge": "विशाल", "Modern": "आधुनिक", "Rare": "दुर्लभ", "Ancient means very old; modern is the opposite.": "प्राचीन का अर्थ है बहुत पुराना; आधुनिक इसका विलोम है।", "“The committee’s decision was unanimous.” What does this mean?": "“समिति का निर्णय सर्वसम्मत था।” इसका क्या अर्थ है?", "The decision was kept secret": "निर्णय गुप्त रखा गया", "Everyone on the committee agreed": "समिति के सभी सदस्य सहमत थे", "The decision was made quickly": "निर्णय जल्दी लिया गया", "Nobody knew who decided": "किसी को पता नहीं था कि निर्णय किसने लिया", "Unanimous means all members agreed.": "सर्वसम्मत का अर्थ है कि सभी सदस्य सहमत थे।", "“Although the new fertiliser raised yields in the first season, farmers who used it reported poorer soil by the third year.” Which conclusion is best supported?": "“हालाँकि नए उर्वरक ने पहले मौसम में पैदावार बढ़ाई, पर इसका उपयोग करने वाले किसानों ने तीसरे साल तक मिट्टी के ख़राब होने की बात कही।” कौन-सा निष्कर्ष सबसे अधिक समर्थित है?", "The fertiliser never worked": "उर्वरक ने कभी काम नहीं किया", "A short-term gain can carry a long-term cost": "थोड़े समय के लाभ की लंबे समय में क़ीमत चुकानी पड़ सकती है", "Farmers should stop growing crops": "किसानों को फ़सल उगाना बंद कर देना चाहिए", "Soil always gets poorer in three years": "मिट्टी हमेशा तीन साल में ख़राब हो जाती है", "The sentence sets an early benefit against a later harm. The other options claim more than the sentence says.": "वाक्य शुरुआती लाभ के सामने बाद के नुक़सान को रखता है। बाक़ी विकल्प वाक्य से अधिक दावा करते हैं।", "A square sheet of paper is folded in half once. One hole is punched through both layers. How many holes are there when it is unfolded?": "काग़ज़ की एक चौकोर शीट को एक बार आधा मोड़ा गया। दोनों परतों में से एक छेद किया गया। खोलने पर कितने छेद होंगे?", "One punch through two layers makes two holes.": "दो परतों में एक बार छेद करने से दो छेद बनते हैं।", "Which letter looks exactly the same in a mirror held beside it?": "कौन-सा अक्षर बग़ल में रखे दर्पण में बिल्कुल वैसा ही दिखता है?", "A has a vertical line of symmetry, so its mirror image is the same.": "A में एक खड़ी सममिति रेखा है, इसलिए इसका दर्पण प्रतिबिंब वैसा ही होता है।", "The shapes repeat in this order: ▲ ■ ● ▲ ■ ● … Which shape is in the 11th position?": "आकृतियाँ इस क्रम में दोहराई जाती हैं: ▲ ■ ● ▲ ■ ● … 11वें स्थान पर कौन-सी आकृति है?", "None of these": "इनमें से कोई नहीं", "The pattern repeats every 3. Positions 3, 6, 9 are ●, so 10 is ▲ and 11 is ■.": "पैटर्न हर 3 पर दोहराता है। स्थान 3, 6, 9 पर ● है, इसलिए 10 पर ▲ और 11 पर ■ है।", "A 3 × 3 × 3 cube is painted on all its outer faces and then cut into 27 small cubes. How many small cubes have paint on exactly two faces?": "एक 3 × 3 × 3 घन की सभी बाहरी सतहों को रंगा गया और फिर 27 छोटे घनों में काटा गया। कितने छोटे घनों की ठीक दो सतहों पर रंग है?", "Two-face cubes sit in the middle of each edge. A cube has 12 edges, so 12. (8 corners have three faces painted, 6 centres have one.)": "दो सतह वाले घन हर किनारे के बीच में होते हैं। घन के 12 किनारे होते हैं, इसलिए 12। (8 कोनों पर तीन सतहें रंगी हैं, 6 केंद्रों पर एक।)", "You want to test whether a plant grows faster with more sunlight. What must be kept the same for both plants?": "आप जाँचना चाहते हैं कि क्या अधिक धूप में पौधा तेज़ी से बढ़ता है। दोनों पौधों के लिए क्या समान रखना ज़रूरी है?", "The amount of sunlight": "धूप की मात्रा", "The water, soil and type of plant": "पानी, मिट्टी और पौधे का प्रकार", "Nothing needs to be the same": "कुछ भी समान रखना ज़रूरी नहीं", "Only the pot colour": "केवल गमले का रंग", "In a fair test only one thing changes (sunlight). Everything else stays the same.": "निष्पक्ष परीक्षण में केवल एक चीज़ बदलती है (धूप)। बाक़ी सब समान रहता है।", "An ice cube melts faster on a metal plate than on a wooden plate in the same room. What is the best explanation?": "एक ही कमरे में बर्फ़ का टुकड़ा लकड़ी की प्लेट की तुलना में धातु की प्लेट पर जल्दी पिघलता है। सबसे अच्छी व्याख्या क्या है?", "Metal is warmer than wood": "धातु लकड़ी से गर्म होती है", "Metal carries heat to the ice faster": "धातु बर्फ़ तक ऊष्मा तेज़ी से पहुँचाती है", "Wood makes ice colder": "लकड़ी बर्फ़ को और ठंडा करती है", "Ice dislikes metal": "बर्फ़ को धातु पसंद नहीं", "Both plates are at room temperature. Metal is a better conductor, so heat reaches the ice faster.": "दोनों प्लेटें कमरे के तापमान पर हैं। धातु बेहतर चालक है, इसलिए ऊष्मा बर्फ़ तक जल्दी पहुँचती है।", "A student says, “Salt makes water boil at a higher temperature.” Which is the best way to test this?": "एक विद्यार्थी कहता है, “नमक से पानी अधिक तापमान पर उबलता है।” इसे जाँचने का सबसे अच्छा तरीक़ा कौन-सा है?", "Boil salt water and note the temperature": "नमक वाला पानी उबालें और तापमान नोट करें", "Ask five friends what they think": "पाँच दोस्तों से पूछें कि वे क्या सोचते हैं", "Boil equal amounts of plain and salt water on the same burner and measure both temperatures": "बराबर मात्रा में सादा और नमक वाला पानी एक ही बर्नर पर उबालें और दोनों का तापमान मापें", "Add salt until the water tastes salty": "तब तक नमक डालें जब तक पानी नमकीन न लगे", "You need a comparison (plain water) and equal conditions. Boiling salt water alone gives nothing to compare with.": "आपको तुलना (सादा पानी) और समान परिस्थितियाँ चाहिए। केवल नमक वाला पानी उबालने से तुलना के लिए कुछ नहीं मिलता।", "100 people with a cold took a new tablet and 60 felt better within a week. What is needed before saying the tablet works?": "ज़ुकाम के 100 लोगों ने एक नई गोली ली और 60 एक हफ़्ते में बेहतर महसूस करने लगे। यह कहने से पहले कि गोली काम करती है, क्या चाहिए?", "A larger tablet": "बड़ी गोली", "A similar group who did not take the tablet, to compare": "तुलना के लिए वैसा ही एक समूह जिसने गोली नहीं ली", "The price of the tablet": "गोली की क़ीमत", "Nothing, 60% is proof": "कुछ नहीं, 60% ही प्रमाण है", "Many colds get better in a week anyway. Without a comparison (control) group you cannot tell what the tablet did.": "बहुत-से ज़ुकाम एक हफ़्ते में अपने आप ठीक हो जाते हैं। तुलना (नियंत्रण) समूह के बिना आप नहीं बता सकते कि गोली ने क्या किया।", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. On which day were there the most visitors?": "पुस्तकालय में आने वाले: सोम 12, मंगल 15, बुध 9, गुरु 18। किस दिन सबसे अधिक लोग आए?", "Monday": "सोमवार", "Tuesday": "मंगलवार", "Wednesday": "बुधवार", "Thursday": "गुरुवार", "18 is the largest number, so Thursday.": "18 सबसे बड़ी संख्या है, इसलिए गुरुवार।", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. How many visitors came in total?": "पुस्तकालय में आने वाले: सोम 12, मंगल 15, बुध 9, गुरु 18। कुल कितने लोग आए?", "Five students scored 6, 8, 8, 9 and 14 in a test. What is the mean (average) score?": "पाँच विद्यार्थिय hem sort it out": "મિત્રની સમસ્યા સાંભળવી અને તેને ઉકેલવામાં મદદ કરવી", "Organising a team for an event or a cause": "કોઈ કાર્યક્રમ કે હેતુ માટે ટીમ ગોઠવવી", "Riya is taller than Sana. Sana is taller than Tara. Who is the shortest?": "રિયા સના કરતાં ઊંચી છે. સના તારા કરતાં ઊંચી છે. સૌથી નીચી કોણ છે?", "Riya": "રિયા", "Sana": "સના", "Tara": "તારા", "Cannot say": "કહી ન શકાય", "Riya > Sana > Tara, so Tara is the shortest.": "રિયા > સના > તારા, તેથી તારા સૌથી નીચી છે.", "Which number is the odd one out?  3, 7, 11, 14, 19": "કઈ સંખ્યા બાકીનાથી જુદી છે?  3, 7, 11, 14, 19", "14 is the only even number; the others are all odd (and prime).": "14 એકમાત્ર બેકી સંખ્યા છે; બાકીની બધી એકી (અને અવિભાજ્ય) છે.", "In a code, CAT is written as DBU. How is DOG written?": "એક કોડમાં CATને DBU લખવામાં આવે છે. DOG કેવી રીતે લખાશે?", "Each letter moves one step forward: D→E, O→P, G→H.": "દરેક અક્ષર એક પગલું આગળ વધે છે: D→E, O→P, G→H.", "Five friends sit in a row. C is at the left end and E is at the right end. A is not at either end. B sits immediately to the right of A. D is not next to B. Who sits in the middle?": "પાંચ મિત્રો એક હારમાં બેઠા છે. C ડાબા છેડે અને E જમણા છેડે છે. A કોઈ છેડે નથી. B, Aની બરાબર જમણી બાજુ બેઠો છે. D, Bની બાજુમાં નથી. વચ્ચે કોણ બેઠું છે?", "Try A in seat 2: B is 3, so D must be 4, which is next to B. Not allowed. So A is in seat 3: C D A B E. The middle is A.": "Aને બેઠક 2 પર મૂકો: B બેઠક 3 પર, તો Dને બેઠક 4 પર બેસવું પડે, જે Bની બાજુમાં છે. એ માન્ય નથી. તેથી A બેઠક 3 પર છે: C D A B E. વચ્ચે A છે.", "One notebook costs ₹45. How much do 6 notebooks cost?": "એક નોટબુક ₹45ની છે. 6 નોટબુકની કિંમત કેટલી?", "What is 25% of 240?": "240ના 25% કેટલા?", "25% is one quarter. 240 ÷ 4 = 60.": "25% એટલે ચોથો ભાગ. 240 ÷ 4 = 60.", "A bag is marked at ₹800 and sold at a 15% discount. What is the selling price?": "એક બૅગ પર ₹800 છાપેલી કિંમત છે અને તે 15% વળતરે વેચાય છે. વેચાણ કિંમત કેટલી?", "15% of 800 is 120. 800 − 120 = 680.": "800ના 15% એટલે 120. 800 − 120 = 680.", "A train travels 180 km at 60 km/h and returns the same 180 km at 90 km/h. What is its average speed for the whole trip?": "એક ટ્રેન 180 કિમી 60 કિમી/કલાકની ઝડપે જાય છે અને એ જ 180 કિમી 90 કિમી/કલાકની ઝડપે પાછી ફરે છે. આખી મુસાફરીની સરેરાશ ઝડપ કેટલી?", "75 km/h": "75 કિમી/કલાક", "72 km/h": "72 કિમી/કલાક", "70 km/h": "70 કિમી/કલાક", "78 km/h": "78 કિમી/કલાક", "Time out = 3 h, time back = 2 h. Total 360 km in 5 h = 72 km/h. Average speed is total distance ÷ total time, not the average of the two speeds.": "જવાનો સમય = 3 કલાક, પાછા ફરવાનો = 2 કલાક. કુલ 360 કિમી 5 કલાકમાં = 72 કિમી/કલાક. સરેરાશ ઝડપ એટલે કુલ અંતર ÷ કુલ સમય, બે ઝડપની સરેરાશ નહીં.", "Which word is closest in meaning to “rapid”?": "“ઝડપી” શબ્દના અર્થની સૌથી નજીકનો શબ્દ કયો છે?", "Quiet": "શાંત", "Quick": "ત્વરિત", "Rough": "ખરબચડું", "Late": "મોડું", "Rapid means fast or quick.": "ઝડપી એટલે ત્વરિત અથવા વેગીલું.", "Which word is the opposite of “ancient”?": "“પ્રાચીન” શબ્દનો વિરુદ્ધાર્થી કયો છે?", "Old": "જૂનું", "Huge": "વિશાળ", "Modern": "આધુનિક", "Rare": "દુર્લભ", "Ancient means very old; modern is the opposite.": "પ્રાચીન એટલે ખૂબ જૂનું; આધુનિક તેનો વિરુદ્ધાર્થી છે.", "“The committee’s decision was unanimous.” What does this mean?": "“સમિતિનો નિર્ણય સર્વાનુમતે હતો.” આનો અર્થ શું?", "The decision was kept secret": "નિર્ણય ગુપ્ત રાખવામાં આવ્યો", "Everyone on the committee agreed": "સમિતિના બધા સભ્યો સંમત હતા", "The decision was made quickly": "નિર્ણય ઝડપથી લેવાયો", "Nobody knew who decided": "કોઈને ખબર નહોતી કે નિર્ણય કોણે લીધો", "Unanimous means all members agreed.": "સર્વાનુમતે એટલે બધા સભ્યો સંમત હતા.", "“Although the new fertiliser raised yields in the first season, farmers who used it reported poorer soil by the third year.” Which conclusion is best supported?": "“નવા ખાતરે પહેલી મોસમમાં ઉત્પાદન વધાર્યું હોવા છતાં, તેનો ઉપયોગ કરનારા ખેડૂતોએ ત્રીજા વર્ષ સુધીમાં જમીન નબળી પડ્યાનું જણાવ્યું.” કયા તારણને સૌથી વધુ સમર્થન મળે છે?", "The fertiliser never worked": "ખાતરે ક્યારેય કામ કર્યું નહીં", "A short-term gain can carry a long-term cost": "ટૂંકા ગાળાના લાભની લાંબા ગાળે કિંમત ચૂકવવી પડી શકે", "Farmers should stop growing crops": "ખેડૂતોએ પાક ઉગાડવાનું બંધ કરવું જોઈએ", "Soil always gets poorer in three years": "જમીન હંમેશા ત્રણ વર્ષમાં નબળી પડે છે", "The sentence sets an early benefit against a later harm. The other options claim more than the sentence says.": "વાક્ય શરૂઆતના લાભની સામે પાછળથી થયેલું નુકસાન મૂકે છે. બાકીના વિકલ્પો વાક્ય કરતાં વધારે દાવો કરે છે.", "A square sheet of paper is folded in half once. One hole is punched through both layers. How many holes are there when it is unfolded?": "કાગળની એક ચોરસ શીટને એક વાર અડધી વાળવામાં આવી. બંને પડમાંથી એક કાણું પાડવામાં આવ્યું. ખોલતાં કેટલાં કાણાં હશે?", "One punch through two layers makes two holes.": "બે પડમાંથી એક વાર કાણું પાડવાથી બે કાણાં બને છે.", "Which letter looks exactly the same in a mirror held beside it?": "કયો અક્ષર બાજુમાં રાખેલા અરીસામાં બિલકુલ એવો જ દેખાય છે?", "A has a vertical line of symmetry, so its mirror image is the same.": "Aમાં એક ઊભી સંમિતિ રેખા છે, તેથી તેનું અરીસાનું પ્રતિબિંબ એવું જ હોય છે.", "The shapes repeat in this order: ▲ ■ ● ▲ ■ ● … Which shape is in the 11th position?": "આકારો આ ક્રમમાં પુનરાવર્તિત થાય છે: ▲ ■ ● ▲ ■ ● … 11મા સ્થાને કયો આકાર છે?", "None of these": "આમાંથી કોઈ નહીં", "The pattern repeats every 3. Positions 3, 6, 9 are ●, so 10 is ▲ and 11 is ■.": "પેટર્ન દર 3 પર પુનરાવર્તિત થાય છે. સ્થાન 3, 6, 9 પર ● છે, તેથી 10 પર ▲ અને 11 પર ■ છે.", "A 3 × 3 × 3 cube is painted on all its outer faces and then cut into 27 small cubes. How many small cubes have paint on exactly two faces?": "એક 3 × 3 × 3 ઘનની બધી બહારની સપાટીઓ રંગવામાં આવી અને પછી તેને 27 નાના ઘનમાં કાપવામાં આવ્યો. કેટલા નાના ઘનની બરાબર બે સપાટી પર રંગ છે?", "Two-face cubes sit in the middle of each edge. A cube has 12 edges, so 12. (8 corners have three faces painted, 6 centres have one.)": "બે સપાટીવાળા ઘન દરેક ધારની વચ્ચે હોય છે. ઘનને 12 ધાર હોય છે, તેથી 12. (8 ખૂણા પર ત્રણ સપાટી રંગેલી છે, 6 કેન્દ્રો પર એક.)", "You want to test whether a plant grows faster with more sunlight. What must be kept the same for both plants?": "તમે ચકાસવા માગો છો કે વધુ સૂર્યપ્રકાશમાં છોડ ઝડપથી વધે છે કે નહીં. બંને છોડ માટે શું સમાન રાખવું જરૂરી છે?", "The amount of sunlight": "સૂર્યપ્રકાશનું પ્રમાણ", "The water, soil and type of plant": "પાણી, માટી અને છોડનો પ્રકાર", "Nothing needs to be the same": "કંઈ પણ સમાન રાખવાની જરૂર નથી", "Only the pot colour": "માત્ર કૂંડાનો રંગ", "In a fair test only one thing changes (sunlight). Everything else stays the same.": "નિષ્પક્ષ ચકાસણીમાં માત્ર એક વસ્તુ બદલાય છે (સૂર્યપ્રકાશ). બાકી બધું સમાન રહે છે.", "An ice cube melts faster on a metal plate than on a wooden plate in the same room. What is the best explanation?": "એક જ ઓરડામાં બરફનો ટુકડો લાકડાની પ્લેટ કરતાં ધાતુની પ્લેટ પર ઝડપથી પીગળે છે. સૌથી સારી સમજૂતી કઈ છે?", "Metal is warmer than wood": "ધાતુ લાકડા કરતાં ગરમ હોય છે", "Metal carries heat to the ice faster": "ધાતુ બરફ સુધી ઉષ્મા ઝડપથી પહોંચાડે છે", "Wood makes ice colder": "લાકડું બરફને વધુ ઠંડો કરે છે", "Ice dislikes metal": "બરફને ધાતુ ગમતી નથી", "Both plates are at room temperature. Metal is a better conductor, so heat reaches the ice faster.": "બંને પ્લેટ ઓરડાના તાપમાને છે. ધાતુ વધુ સારી વાહક છે, તેથી ઉષ્મા બરફ સુધી ઝડપથી પહોંચે છે.", "A student says, “Salt makes water boil at a higher temperature.” Which is the best way to test this?": "એક વિદ્યાર્થી કહે છે, “મીઠાથી પાણી ઊંચા તાપમાને ઊકળે છે.” આને ચકાસવાની સૌથી સારી રીત કઈ છે?", "Boil salt water and note the temperature": "મીઠાવાળું પાણી ઉકાળો અને તાપમાન નોંધો", "Ask five friends what they think": "પાંચ મિત્રોને પૂછો કે તેઓ શું વિચારે છે", "Boil equal amounts of plain and salt water on the same burner and measure both temperatures": "સરખા પ્રમાણમાં સાદું અને મીઠાવાળું પાણી એક જ બર્નર પર ઉકાળો અને બંનેનું તાપમાન માપો", "Add salt until the water tastes salty": "પાણી ખારું લાગે ત્યાં સુધી મીઠું ઉમેરો", "You need a comparison (plain water) and equal conditions. Boiling salt water alone gives nothing to compare with.": "તમારે સરખામણી (સાદું પાણી) અને સમાન પરિસ્થિતિ જોઈએ. માત્ર મીઠાવાળું પાણી ઉકાળવાથી સરખાવવા માટે કંઈ મળતું નથી.", "100 people with a cold took a new tablet and 60 felt better within a week. What is needed before saying the tablet works?": "શરદીવાળા 100 લોકોએ એક નવી ગોળી લીધી અને 60ને એક અઠવાડિયામાં સારું લાગ્યું. ગોળી કામ કરે છે એમ કહેતા પહેલાં શું જોઈએ?", "A larger tablet": "મોટી ગોળી", "A similar group who did not take the tablet, to compare": "સરખામણી માટે એવું જ એક જૂથ જેણે ગોળી લીધી નથી", "The price of the tablet": "ગોળીની કિંમત", "Nothing, 60% is proof": "કંઈ નહીં, 60% જ પુરાવો છે", "Many colds get better in a week anyway. Without a comparison (control) group you cannot tell what the tablet did.": "ઘણી શરદી એક અઠવાડિયામાં આપમેળે મટી જાય છે. સરખામણી (નિયંત્રણ) જૂથ વિના તમે કહી ન શકો કે ગોળીએ શું કર્યું.", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. On which day were there the most visitors?": "પુસ્તકાલયના મુલાકાતીઓ: સોમ 12, મંગળ 15, બુધ 9, ગુરુ 18. કયા દિવસે સૌથી વધુ મુલાકાતીઓ આવ્યા?", "Monday": "સોમવાર", "Tuesday": "મંગળવાર", "Wednesday": "બુધવાર", "Thursday": "ગુરુવાર", "18 is the largest number, so Thursday.": "18 સૌથી મોટી સંખ્યા છે, તેથી ગુરુવાર.", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. How many visitors came in total?": "પુસ્તકાલયના મુલાકાતીઓ: સોમ 12, મંગળ 15, બુધ 9, ગુરુ 18. કુલ કેટલા મુલાકાતીઓ આવ્યા?", "Five students scored 6, 8, 8, 9 and 14 in a test. What is the mean (average) score?": "પાંચ વિદ્યાર્થીઓએ એક કસોટીમાં 6, 8, 8, 9 અને 14 ગુણ મેળવ્યા. મધ્યક (સરેરાશ) ગુણ કેટલા?", "Total = 45. 45 ÷ 5 = 9. (8 is the mode and the median.)": "કુલ = 45. 45 ÷ 5 = 9. (8 બહુલક અને મધ્યસ્થ છે.)", "A shop’s sales rose from ₹40,000 to ₹50,000 in year 1, and from ₹50,000 to ₹60,000 in year 2. Which statement is correct?": "એક દુકાનનું વેચાણ પહેલા વર્ષે ₹40,000થી વધીને ₹50,000 થયું, અને બીજા વર્ષે ₹50,000થી ₹60,000. કયું વિધાન સાચું છે?", "Growth was 25% in both years": "બંને વર્ષે વૃદ્ધિ 25% રહી", "Percentage growth was lower in year 2" an Sana. Sana is taller than Tara. Who is the shortest?": "ریا ثنا سے لمبی ہے۔ ثنا تارا سے لمبی ہے۔ سب سے چھوٹی کون ہے؟", "Riya": "ریا", "Sana": "ثنا", "Tara": "تارا", "Cannot say": "کہا نہیں جا سکتا", "Riya > Sana > Tara, so Tara is the shortest.": "ریا > ثنا > تارا، اس لیے تارا سب سے چھوٹی ہے۔", "Which number is the odd one out?  3, 7, 11, 14, 19": "کون سا عدد باقی سے مختلف ہے؟  3, 7, 11, 14, 19", "14 is the only even number; the others are all odd (and prime).": "14 واحد جفت عدد ہے؛ باقی سب طاق (اور مفرد) ہیں۔", "In a code, CAT is written as DBU. How is DOG written?": "ایک کوڈ میں CAT کو DBU لکھا جاتا ہے۔ DOG کیسے لکھا جائے گا؟", "Each letter moves one step forward: D→E, O→P, G→H.": "ہر حرف ایک قدم آگے بڑھتا ہے: D→E، O→P، G→H۔", "Five friends sit in a row. C is at the left end and E is at the right end. A is not at either end. B sits immediately to the right of A. D is not next to B. Who sits in the middle?": "پانچ دوست ایک قطار میں بیٹھے ہیں۔ C بائیں سرے پر اور E دائیں سرے پر ہے۔ A کسی سرے پر نہیں ہے۔ B، A کے بالکل دائیں طرف بیٹھا ہے۔ D، B کے برابر میں نہیں ہے۔ درمیان میں کون بیٹھا ہے؟", "Try A in seat 2: B is 3, so D must be 4, which is next to B. Not allowed. So A is in seat 3: C D A B E. The middle is A.": "A کو نشست 2 پر رکھیں: B نشست 3 پر، تو D کو نشست 4 پر ہونا پڑے گا، جو B کے برابر ہے۔ یہ درست نہیں۔ اس لیے A نشست 3 پر ہے: C D A B E۔ درمیان میں A ہے۔", "One notebook costs ₹45. How much do 6 notebooks cost?": "ایک کاپی ₹45 کی ہے۔ 6 کاپیاں کتنے کی ہوں گی؟", "What is 25% of 240?": "240 کا 25% کتنا ہے؟", "25% is one quarter. 240 ÷ 4 = 60.": "25% یعنی ایک چوتھائی۔ ⁦240 ÷ 4 = 60⁩۔", "A bag is marked at ₹800 and sold at a 15% discount. What is the selling price?": "ایک بیگ پر ₹800 درج ہے اور وہ 15% رعایت پر بکتا ہے۔ قیمتِ فروخت کیا ہے؟", "15% of 800 is 120. 800 − 120 = 680.": "800 کا 15% ہے 120۔ ⁦800 − 120 = 680⁩۔", "A train travels 180 km at 60 km/h and returns the same 180 km at 90 km/h. What is its average speed for the whole trip?": "ایک ٹرین 180 کلومیٹر 60 کلومیٹر فی گھنٹہ سے جاتی ہے اور وہی 180 کلومیٹر 90 کلومیٹر فی گھنٹہ سے واپس آتی ہے۔ پورے سفر کی اوسط رفتار کیا ہے؟", "75 km/h": "75 کلومیٹر فی گھنٹہ", "72 km/h": "72 کلومیٹر فی گھنٹہ", "70 km/h": "70 کلومیٹر فی گھنٹہ", "78 km/h": "78 کلومیٹر فی گھنٹہ", "Time out = 3 h, time back = 2 h. Total 360 km in 5 h = 72 km/h. Average speed is total distance ÷ total time, not the average of the two speeds.": "جانے کا وقت = 3 گھنٹے، واپسی کا = 2 گھنٹے۔ کل 360 کلومیٹر 5 گھنٹے میں = 72 کلومیٹر فی گھنٹہ۔ اوسط رفتار کل فاصلہ ÷ کل وقت ہے، دونوں رفتاروں کا اوسط نہیں۔", "Which word is closest in meaning to “rapid”?": "“سریع” کے سب سے قریب معنی والا لفظ کون سا ہے؟", "Quiet": "خاموش", "Quick": "تیز", "Rough": "کھردرا", "Late": "دیر", "Rapid means fast or quick.": "سریع کا مطلب ہے تیز۔", "Which word is the opposite of “ancient”?": "“قدیم” کا متضاد لفظ کون سا ہے؟", "Old": "پرانا", "Huge": "بہت بڑا", "Modern": "جدید", "Rare": "نایاب", "Ancient means very old; modern is the opposite.": "قدیم کا مطلب ہے بہت پرانا؛ جدید اس کا متضاد ہے۔", "“The committee’s decision was unanimous.” What does this mean?": "“کمیٹی کا فیصلہ متفقہ تھا۔” اس کا کیا مطلب ہے؟", "The decision was kept secret": "فیصلہ خفیہ رکھا گیا", "Everyone on the committee agreed": "کمیٹی کے تمام ارکان متفق تھے", "The decision was made quickly": "فیصلہ جلدی کیا گیا", "Nobody knew who decided": "کسی کو معلوم نہیں تھا کہ فیصلہ کس نے کیا", "Unanimous means all members agreed.": "متفقہ کا مطلب ہے کہ تمام ارکان متفق تھے۔", "“Although the new fertiliser raised yields in the first season, farmers who used it reported poorer soil by the third year.” Which conclusion is best supported?": "“اگرچہ نئی کھاد نے پہلے موسم میں پیداوار بڑھائی، لیکن اسے استعمال کرنے والے کسانوں نے تیسرے سال تک مٹی کے خراب ہونے کی اطلاع دی۔” کون سا نتیجہ سب سے زیادہ ثابت ہوتا ہے؟", "The fertiliser never worked": "کھاد نے کبھی کام نہیں کیا", "A short-term gain can carry a long-term cost": "تھوڑی مدت کے فائدے کی لمبی مدت میں قیمت چکانی پڑ سکتی ہے", "Farmers should stop growing crops": "کسانوں کو فصلیں اگانا بند کر دینا چاہیے", "Soil always gets poorer in three years": "مٹی ہمیشہ تین سال میں خراب ہو جاتی ہے", "The sentence sets an early benefit against a later harm. The other options claim more than the sentence says.": "جملہ ابتدائی فائدے کے مقابل بعد کا نقصان رکھتا ہے۔ باقی اختیارات جملے سے زیادہ دعویٰ کرتے ہیں۔", "A square sheet of paper is folded in half once. One hole is punched through both layers. How many holes are there when it is unfolded?": "کاغذ کی ایک چوکور شیٹ کو ایک بار آدھا موڑا گیا۔ دونوں تہوں میں سے ایک سوراخ کیا گیا۔ کھولنے پر کتنے سوراخ ہوں گے؟", "One punch through two layers makes two holes.": "دو تہوں میں ایک بار سوراخ کرنے سے دو سوراخ بنتے ہیں۔", "Which letter looks exactly the same in a mirror held beside it?": "کون سا حرف برابر میں رکھے آئینے میں بالکل ویسا ہی نظر آتا ہے؟", "A has a vertical line of symmetry, so its mirror image is the same.": "A میں ایک عمودی خطِ تشاکل ہے، اس لیے اس کا آئینے کا عکس ویسا ہی ہوتا ہے۔", "The shapes repeat in this order: ▲ ■ ● ▲ ■ ● … Which shape is in the 11th position?": "شکلیں اس ترتیب میں دہرائی جاتی ہیں: ▲ ■ ● ▲ ■ ● … 11ویں مقام پر کون سی شکل ہے؟", "None of these": "ان میں سے کوئی نہیں", "The pattern repeats every 3. Positions 3, 6, 9 are ●, so 10 is ▲ and 11 is ■.": "پیٹرن ہر 3 پر دہرایا جاتا ہے۔ مقام 3، 6، 9 پر ● ہے، اس لیے 10 پر ▲ اور 11 پر ■ ہے۔", "A 3 × 3 × 3 cube is painted on all its outer faces and then cut into 27 small cubes. How many small cubes have paint on exactly two faces?": "ایک ⁦3 × 3 × 3⁩ مکعب کی تمام بیرونی سطحوں کو رنگا گیا اور پھر اسے 27 چھوٹے مکعبوں میں کاٹا گیا۔ کتنے چھوٹے مکعبوں کی ٹھیک دو سطحوں پر رنگ ہے؟", "Two-face cubes sit in the middle of each edge. A cube has 12 edges, so 12. (8 corners have three faces painted, 6 centres have one.)": "دو سطح والے مکعب ہر کنارے کے درمیان میں ہوتے ہیں۔ مکعب کے 12 کنارے ہوتے ہیں، اس لیے 12۔ (8 کونوں پر تین سطحیں رنگی ہیں، 6 مرکزوں پر ایک۔)", "You want to test whether a plant grows faster with more sunlight. What must be kept the same for both plants?": "آپ جانچنا چاہتے ہیں کہ کیا زیادہ دھوپ میں پودا تیزی سے بڑھتا ہے۔ دونوں پودوں کے لیے کیا یکساں رکھنا ضروری ہے؟", "The amount of sunlight": "دھوپ کی مقدار", "The water, soil and type of plant": "پانی، مٹی اور پودے کی قسم", "Nothing needs to be the same": "کچھ بھی یکساں رکھنا ضروری نہیں", "Only the pot colour": "صرف گملے کا رنگ", "In a fair test only one thing changes (sunlight). Everything else stays the same.": "منصفانہ جانچ میں صرف ایک چیز بدلتی ہے (دھوپ)۔ باقی سب یکساں رہتا ہے۔", "An ice cube melts faster on a metal plate than on a wooden plate in the same room. What is the best explanation?": "ایک ہی کمرے میں برف کا ٹکڑا لکڑی کی پلیٹ کے مقابلے میں دھات کی پلیٹ پر جلدی پگھلتا ہے۔ سب سے اچھی وضاحت کیا ہے؟", "Metal is warmer than wood": "دھات لکڑی سے گرم ہوتی ہے", "Metal carries heat to the ice faster": "دھات برف تک حرارت تیزی سے پہنچاتی ہے", "Wood makes ice colder": "لکڑی برف کو اور ٹھنڈا کرتی ہے", "Ice dislikes metal": "برف کو دھات پسند نہیں", "Both plates are at room temperature. Metal is a better conductor, so heat reaches the ice faster.": "دونوں پلیٹیں کمرے کے درجہ حرارت پر ہیں۔ دھات بہتر موصل ہے، اس لیے حرارت برف تک جلدی پہنچتی ہے۔", "A student says, “Salt makes water boil at a higher temperature.” Which is the best way to test this?": "ایک طالب علم کہتا ہے، “نمک سے پانی زیادہ درجہ حرارت پر ابلتا ہے۔” اسے جانچنے کا سب سے اچھا طریقہ کون سا ہے؟", "Boil salt water and note the temperature": "نمکین پانی ابالیں اور درجہ حرارت نوٹ کریں", "Ask five friends what they think": "پانچ دوستوں سے پوچھیں کہ وہ کیا سوچتے ہیں", "Boil equal amounts of plain and salt water on the same burner and measure both temperatures": "برابر مقدار میں سادہ اور نمکین پانی ایک ہی برنر پر ابالیں اور دونوں کا درجہ حرارت ناپیں", "Add salt until the water tastes salty": "اس وقت تک نمک ڈالیں جب تک پانی نمکین نہ لگے", "You need a comparison (plain water) and equal conditions. Boiling salt water alone gives nothing to compare with.": "آپ کو موازنہ (سادہ پانی) اور یکساں حالات چاہییں۔ صرف نمکین پانی ابالنے سے موازنے کے لیے کچھ نہیں ملتا۔", "100 people with a cold took a new tablet and 60 felt better within a week. What is needed before saying the tablet works?": "زکام کے 100 لوگوں نے ایک نئی گولی لی اور 60 ایک ہفتے میں بہتر محسوس کرنے لگے۔ یہ کہنے سے پہلے کہ گولی کام کرتی ہے، کیا چاہیے؟", "A larger tablet": "بڑی گولی", "A similar group who did not take the tablet, to compare": "موازنے کے لیے ویسا ہی ایک گروپ جس نے گولی نہیں لی", "The price of the tablet": "گولی کی قیمت", "Nothing, 60% is proof": "کچھ نہیں، 60% ہی ثبوت ہے", "Many colds get better in a week anyway. Without a comparison (control) group you cannot tell what the tablet did.": "بہت سے زکام ایک ہفتے میں خود ٹھیک ہو جاتے ہیں۔ موازنے (کنٹرول) گروپ کے بغیر آپ نہیں بتا سکتے کہ گولی نے کیا کیا۔", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. On which day were there the most visitors?": "لائبریری میں آنے والے: پیر 12، منگل 15، بدھ 9، جمعرات 18۔ کس دن سب سے زیادہ لوگ آئے؟", "Monday": "پیر", "Tuesday": "منگل", "Wednesday": "بدھ", "Thursday": "جمعرات", "18 is the largest number, so Thursday.": "18 سب سے بڑا عدد ہے، اس لیے جمعرات۔", "Library visitors: Mon 12, Tue 15, Wed 9, Thu 18. How many visitors came in total?": "لائبریری میں آنے والے: پیر 12، منگل 15، بدھ 9، جمعرات 18۔ کل کتنے لوگ آئے؟", "Five students scored 6, 8, 8, 9 and 14 in a test. What is the mean (average) score?": "پانچ طلبہ نے ایک ٹیسٹ میں 6، 8، 8، 9 اور 14 نمبر حاصل کیے۔ اوسط نمبر کیا ہے؟", "Total = 45. 45 ÷ 5 = 9. (8 is the mode and the median.)": "کل = 45۔ ⁦45 ÷ 5 = 9⁩۔ (8 عادہ اور وسطانیہ ہے۔)", "A shop’s sales rose from ₹40,000 to ₹50,000 in year 1, and from ₹50,000 to ₹60,000 in year 2. Which statement is correct?": "ایک دکان کی فروخت پہلے سال ₹40,000 سے بڑھ کر ₹50,000 ہوئی، اور دوسرے سال ₹50,000 سے ₹60,000۔ کون سا بیان درست ہے؟", "Growth was 25% in both years": "دونوں سال اضافہ 25% رہا", "Percentage growth was lower in year 2": "دوسرے سال فیصد اضافہ کم رہا", "Percentage growth was higher in y const SUBJG=[['Science',['Maths','Physics','Chemistry','Biology','Computer Science']],['Commerce',['Accountancy','Business Studies','Economics']],['Arts & Humanities',['History','Political Science','Geography','Psychology','Sociology']],['Languages',['English','Hindi','Gujarati','Urdu','Sanskrit']],['Creative & Physical',['Fine Arts','Music','Physical Education']]];

/* ================= STATE ================= */
const blank=()=>({step:0,consent:false,sample:false,p:{name:'',stage:'',stream:'',subjects:[],marks:''},int:{},self:{},quiz:{pos:0,res:{},shown:null,done:false,skipped:false},pref:{},con:{budget:0,years:0,work:'any',loc:''},w:{...W0},road:{},dl:[],cmp:[],focus:'',tab:'overview',filt:{cat:'',work:'',years:'',cost:'',elig:false},open:{},nd:{t:'',d:'',u:''}});
let S=blank();
const KEY='career-genius-v2',LKEY='career-genius-lang';
function save(){ if(!S.consent||S.sample) return; try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function load(){ try{const l=localStorage.getItem(LKEY);if(LANGS[l])LANG=l;const r=localStorage.getItem(KEY); if(r){S=Object.assign(blank(),JSON.parse(r));}}catch(e){} }
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const LOC=()=>({en:'en-IN',hi:'hi-IN-u-nu-latn',gu:'gu-IN-u-nu-latn',ur:'ur-IN-u-nu-latn'}[LANG]);
const fdate=(d,m)=>{try{return d.toLocaleDateString(LOC(),{day:'numeric',month:m||'long',year:'numeric'})}catch(e){return d.toDateString()}};
const today=()=>fdate(new Date());
const junior=()=>S.p.stage==='j';
const preStream=()=>S.p.stage==='j'||S.p.stage==='s';
const AND=a=>a.length>1?a.slice(0,-1).join(', ')+t(' and ')+a[a.length-1]:a.join('');
const firstExam=c=>c.exams.split(/[;,.،۔।]/)[0].trim();
const streamNames=c=>c.streams.includes('any')?t('Any stream'):c.streams.map(s=>STREAMS[s]).join(t(' or '));

/* ================= SCORING ================= */
function interestScores(){const o={};for(const a in AREAS)o[a]=0;INT.forEach((q,i)=>{o[q[0]]+=(S.int[i]??0)});for(const a in o)o[a]=Math.round(o[a]/4*100);return o}
function domScore(d){const r=S.quiz.res[d];if(!r||r.length<2)return null;return r[0]?(r[1]?90:65):(r[1]?40:15)}
function aptScores(){const o={};for(const d in DOM){const ob=domScore(d);const se=S.self[d]?S.self[d]*20:null;o[d]={obs:ob,self:se,use:ob??se}}return o}
function streamOk(c){const s=S.p.stream;if(preStream()||c.streams.includes('any'))return true;if(!s)return true;if(s==='PCMB')return c.streams.includes('PCM')||c.streams.includes('PCB');return c.streams.includes(s)}
function subjHits(c){const u=S.p.subjects,hit=[];let n=0;c.subj.forEach(k=>{const m=(GRP[k]||[k]).filter(o=>u.includes(o));if(m.length){n++;hit.push(...m)}});return {n,hit}}
const yb=y=>y<=3?1:y<=5?2:3;
function fit(u,c){return !u?null:u>=c?100:u===c-1?60:30}
function match(c){
  const I=interestScores(),A=aptScores();let n=0,d=0;
  for(const k in c.ints){n+=I[k]*c.ints[k];d+=c.ints[k]} const int=Math.round(n/d);
  n=0;d=0;let selfOnly=false,miss=false;for(const k in c.apt){const a=A[k];if(a.use==null){miss=true;continue}if(a.obs==null)selfOnly=true;n+=a.use*c.apt[k];d+=c.apt[k]}
  const apt=d?Math.round(n/d):50;
  const elig=streamOk(c)?100:35;
  const ov=subjHits(c).n; let skill=S.p.subjects.length?Math.round(40+60*Math.min(1,ov/Math.min(2,c.subj.length))):50;
  if(c.pv[1]>=.8&&S.self.prac)skill=Math.round((skill*2+S.self.prac*20)/3);
  if(c.ints.creative>=2&&S.self.creat)skill=Math.round((skill*2+S.self.creat*20)/3);
  const parts=[];const fb=fit(S.con.budget,c.cost),fy=fit(S.con.years,yb(c.years));
  if(fb!=null)parts.push(fb);if(fy!=null)parts.push(fy);
  parts.push(S.con.work==='any'||c.work.includes(S.con.work)?100:45);
  let pd=0,pn=0;PREF.forEach((p,i)=>{if(S.pref[p[0]]!=null){pd+=Math.abs(S.pref[p[0]]-c.pv[i]);pn++}});
  if(pn)parts.push(Math.round((1-pd/pn)*100));
  const con=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
  const out=[0,55,75,90][c.out];
  const sc={int,apt,elig,skill,con,out};const w=useW();const tw=Object.values(w).reduce((a,b)=>a+b,0)||1;
  let total=0;for(const k in sc)total+=sc[k]*w[k]/tw;
  return {c,sc,total:Math.round(total),selfOnly,miss,fb,fy};
}
function useW(){const w={...S.w};if(preStream())w.elig=0;return w}
function ranked(){return CAREERS.map(match).sort((a,b)=>b.total-a.total)}
function streamAdvice(list){const r={any:0,PCM:0,PCB:0};list.slice(0,6).forEach(m=>{const st=m.c.streams;if(st.includes('any')){r.any++;r.PCM++;r.PCB++}else{if(st.includes('PCM'))r.PCM++;if(st.includes('PCB'))r.PCB++}});return r}

/* ================= VIEWS ================= */
const STEPS=['Start','About you','Interests','Aptitude','Preferences','Results'];
function canGo(i){ if(i<=1)return true; if(!S.p.stage)return false; if(i<=2)return true; if(Object.keys(S.int).length<INT.length)return false; if(i<=3)return true; if(!S.quiz.done&&!S.quiz.skipped)return false; return true }
function nav(){return `<nav class="steps" aria-label="${t('Steps')}"><div class="wrap">${STEPS.map((s,i)=>`<button data-act="go" data-i="${i}" class="${S.step===i?'on':i<S.step?'done':''}" ${canGo(i)?'':'disabled'}><i>${i<S.step?'✓':i+1}</i>${t(s)}</button>`).join('')}</div></nav>`}
const seg=(act,key,val,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="${act}" data-k="${key}" data-v="${v}" class="${val===v?'on':''}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`;
const stepOf=n=>t('Step {0} of 5',n);

<main class="wrap">
 <div class="grid3">
  <div class="plain"><p class="eyebrow">${t('About 15 minutes')}</p><h3>${t('Five short steps')}</h3><p class="dim">${t('About you, your interests, an aptitude check, how you like to work, and your limits such as budget and study time.')}</p></div>
  <div class="plain"><p class="eyebrow">${t('Shows its working')}</p><h3>${t('Scores you can question')}</h3><p class="dim">${t('Every match shows what it is based on, what is missing and what could be wrong. You can change the weights yourself.')}</p></div>
  <div class="plain"><p class="eyebrow">${t('Official sources only')}</p><h3>${t('No invented jobs or fees')}</h3><p class="dim">${t('For dates, fees and vacancies it sends you to the official exam and government websites instead of guessing.')}</p></div>
 </div>
 <div class="panel"><h3>${t('Before you begin')}</h3>
  <ul class="clean tick"><li>${t('This is a short self-check, not a professional psychometric test. Treat the result as a starting point for a talk with your parents and teachers.')}</li><li>${t('A match score shows how well a career fits your answers today. It is not your chance of success, and it will change as you grow.')}</li><li>${t('A low score in one area is never a reason to give up on a career. The results show what to practise and which other routes exist.')}</li></ul>
  <label class="check"><input type="checkbox" id="consent" data-act="consent" ${S.consent?'checked':''}><span><b>${t('Save my answers on this device')}</b> ${t('so I can continue later. Nothing is sent anywhere. Leave it unticked on a shared computer.')}</span></label>
  ${S.p.stage&&!S.sample?`<div class="row"><button class="btn sm" data-act="go" data-i="${S.quiz.done||S.quiz.skipped?5:1}">${t('Continue where I stopped')}</button><button class="btn sm ghost" data-act="reset">${t('Clear my answers')}</button></div>`:''}
 </div></main>`}

function vProfile(){const p=S.p;return `<main class="wrap"><div class="plain"><p class="eyebrow">${stepOf(1)}</p><h2>${t('About you')}</h2><p class="lead dim">${t('Only what is needed for guidance. Your name is optional.')}</p></div>
 <div class="panel">
  <div class="grid2"><label class="f" for="name">${t('Name (optional)')}<input type="text" id="name" data-bind="name" value="${esc(p.name)}" maxlength="40" autocomplete="off"></label>
  <label class="f" for="marks">${t('Last exam result (optional)')}<select id="marks" data-bind="marks"><option value="">${t('Prefer not to say')}</option>${MARKS.map(m=>`<option ${p.marks===m?'selected':''} value="${m}">${t(m)}</option>`).join('')}</select></label></div>
  <div class="plain"><b>${t('Where are you now?')}</b><div class="chips">${Object.entries(STAGES).map(([k,v])=>`<button class="chip ${p.stage===k?'on':''}" data-act="stage" data-v="${k}" aria-pressed="${p.stage===k}">${v}</button>`).join('')}</div></div>
  ${p.stage&&!preStream()?`<div class="plain"><b>${t('Your stream or background')}</b><div class="chips">${Object.entries(STREAMS).map(([k,v])=>`<button class="chip ${p.stream===k?'on':''}" data-act="stream" data-v="${k}" aria-pressed="${p.stream===k}">${v}</button>`).join('')}</div></div>`:''}
  ${preStream()?`<p class="note">${t('You have not chosen a stream yet, so every career stays open. The results will show which Class 11 stream each career needs.')}</p>`:''}
 </div>
 <div class="panel" style="gap:6px"><h3>${t('Subjects you enjoy or do well in')}</h3><p class="dim small">${t('Subjects are grouped by category. Pick every subject that applies, from any group.')}</p>
  <div>${SUBJG.map(([g,list])=>`<div class="sgroup"><b>${t(g)}</b><div class="chips">${list.map(s=>`<button class="chip ${p.subjects.includes(s)?'on':''}" data-act="subj" data-v="${s}" aria-pressed="${p.subjects.includes(s)}">${t(s)}</button>`).join('')}</div></div>`).join('')}</div>
  <p class="small dim">${p.subjects.length?t('{0} selected',p.subjects.length):t('None selected yet. You can also skip this.')}</p>
 </div>
 <div class="row between"><button class="btn ghost" data-act="go" data-i="0">${t('Back')}</button><button class="btn" data-act="go" data-i="2" ${p.stage?'':'disabled'}>${t('Next: interests')}</button></div>
 ${p.stage?'':`<p class="dim small">${t('Choose where you are now to continue.')}</p>`}</main>`}

function vInterests(){const n=Object.keys(S.int).length;return `<main class="wrap"><div class="plain"><p class="eyebrow">${stepOf(2)}</p><h2>${t('What do you enjoy?')}</h2><p class="lead dim">${t('Think about what you like doing, not what you are good at or what others expect. There are no right answers.')}</p>
 <div class="meter" aria-hidden="true"><b style="width:${n/INT.length*100}%"></b></div><p class="small dim">${t('{0} of {1} answered',n,INT.length)}</p></div>
 <div class="panel" style="gap:0">${INT.map((q,i)=>`<div class="q"><span>${t(q[1])}</span>${seg('int',i,S.int[i],[[0,t('Not for me')],[1,t('It’s okay')],[2,t('Love it')]])}</div>`).join('')}</div>
 <div class="row between"><button class="btn ghost" data-act="go" data-i="1">${t('Back')}</button><button class="btn" data-act="go" data-i="3" ${n<INT.length?'disabled':''}>${t('Next: aptitude')}</button></div>
 ${n<INT.length?`<p class="dim small">${t('Answer all {0} to continue. {1} left.',INT.length,INT.length-n)}</p>`:''}</main>`}

function qKey(d,idx){const r=S.quiz.res[d]||[];if(idx===0)return junior()?'e':'m';return junior()?(r[0]?'m':'e2'):(r[0]?'h':'e')}
function vAptitude(){
  const doms=Object.keys(DOM),allSelf={...DOM,...SELF_ONLY};const selfDone=Object.keys(allSelf).every(k=>S.self[k]);
  const head=`<div class="plain"><p class="eyebrow">${stepOf(3)}</p><h2>${t('Aptitude check')}</h2></div>`;
  if(!S.quiz.started&&!S.quiz.done&&!S.quiz.skipped){return `<main class="wrap">${head}
   <div class="panel"><h3>${t('First, how do you rate yourself?')}</h3><p class="dim">${t('1 means “I find this hard”, 5 means “I find this easy”. Later you will see your own rating beside your quiz result.')}</p>
   <div style="display:flex;flex-direction:column">${Object.entries(allSelf).map(([k,v])=>`<div class="q"><span>${v}</span>${seg('self',k,S.self[k],[1,2,3,4,5].map(x=>[x,x]))}</div>`).join('')}</div></div>
   <div class="panel"><h3>${t('Then 12 questions, two for each area')}</h3><p class="dim">${t('The second question in each area gets harder if you are right and easier if you are not. You see the answer and the reason after each one. No timer. Use rough paper if you like.')}</p>
   <div class="row"><button class="btn" data-act="qstart" ${selfDone?'':'disabled'}>${t('Start the 12 questions')}</button><button class="btn ghost" data-act="qskip" ${selfDone?'':'disabled'}>${t('Skip the quiz for now')}</button></div>
   ${selfDone?'':`<p class="dim small">${t('Rate all eight areas first.')}</p>`}
   <p class="small dim">${t('If you skip, the results use only your own ratings and say so clearly.')}</p></div>
   <div class="row"><button class="btn ghost" data-act="go" data-i="2">${t('Back')}</button></div></main>`}
  if(S.quiz.done||S.quiz.skipped){const A=aptScores();return `<main class="wrap">${head}
   <div class="panel">${S.quiz.skipped?`<p class="note">${t('You skipped the quiz. Results will use your own ratings only.')}</p>`:`<h3>${t('Done. Here is what the 12 questions showed.')}</h3>${aptChart(A)}<p class="small dim">${t('Two questions per area can only hint at a strength. Scores are relative to your stage ({0}).',STAGES[S.p.stage])}</p>`}
   <div class="row"><button class="btn ghost sm" data-act="qretake">${S.quiz.skipped?t('Take the quiz now'):t('Retake the quiz')}</button></div></div>
   <div class="row between"><button class="btn ghost" data-act="go" data-i="2">${t('Back')}</button><button class="btn" data-act="go" data-i="4">${t('Next: preferences')}</button></div></main>`}
  const pos=S.quiz.pos,d=doms[Math.floor(pos/2)],idx=pos%2,k=qKey(d,idx),q=Q[d][k],sh=S.quiz.shown;
  return `<main class="wrap">${head}<div class="meter" aria-hidden="true"><b style="width:${pos/12*100}%"></b></div>
   <div class="panel"><div class="row between"><span class="eyebrow">${DOM[d]}</span><span class="small dim">${t('Question {0} of 12',pos+1)} · ${t(LEVEL[k])}</span></div>
   <h3 style="font-size:1.3rem;line-height:1.5">${t(q[0])}</h3>
   <div class="opts">${q[1].map((o,i)=>`<button class="opt ${sh!=null?(i===q[2]?'right':i===sh?'wrong':''):''}" data-act="qans" data-v="${i}" ${sh!=null?'disabled':''}>${t(o)}${sh!=null&&i===q[2]?' ✓':''}${sh!=null&&i===sh&&i!==q[2]?' ✗':''}</button>`).join('')}</div>
   ${sh!=null?`<p class="note ${sh===q[2]?'ok':'no'}" role="status"><b>${sh===q[2]?t('Correct.'):t('Not this time.')}</b> ${t(q[3])}</p><div class="row"><button class="btn" data-act="qnext">${pos===11?t('See my results'):t('Next question')}</button></div>`:''}
   </div></main>`}

function aptChart(A){return `<div class="legend"><span><i></i>${t('Quiz result (observed)')}</span><span><i class="s"></i>${t('Your own rating (self-reported)')}</span></div>
 <div class="bars">${Object.entries(DOM).map(([k,v])=>{const a=A[k];return `<div class="bar"><span>${v}</span><div class="t">${a.obs!=null?`<span><b style="width:${a.obs}%"></b></span>`:''}${a.self!=null?`<span class="s"><b style="width:${a.self}%"></b></span>`:''}</div><span class="v">${a.obs??a.self??'–'}</span></div>`}).join('')}
 ${Object.entries(SELF_ONLY).map(([k,v])=>`<div class="bar"><span>${v}</span><div class="t"><span class="s"><b style="width:${(S.self[k]||0)*20}%"></b></span></div><span class="v">${S.self[k]?S.self[k]*20:'–'}</span></div>`).join('')}</div>`}

function vPrefs(){const c=S.con;return `<main class="wrap"><div class="plain"><p class="eyebrow">${stepOf(4)}</p><h2>${t('How you like to work, and your limits')}</h2><p class="lead dim">${t('All of these are optional. Skip any you are unsure about and the results will list them as open questions.')}</p></div>
 <div class="panel"><h3>${t('I prefer to work…')}</h3><div style="display:flex;flex-direction:column">${PREF.map(p=>`<div class="q"><span class="small dim">${t(p[1])} / ${t(p[2])}</span>${seg('pref',p[0],S.pref[p[0]],[[0,t(p[1])],[.5,t('Both')],[1,t(p[2])]])}</div>`).join('')}</div></div>
 <div class="panel"><h3>${t('Practical limits')}</h3><p class="small dim">${t('Talk to your parents if you are unsure. Share only what you are comfortable with.')}</p>
  <div class="grid2">
  <label class="f" for="budget">${t('What can your family spend on study each year?')}<select id="budget" data-con="budget"><option value="0">${t('Not sure yet')}</option>${[1,2,3,4].map(i=>`<option value="${i}" ${c.budget==i?'selected':''}>${BUD[i]}</option>`).join('')}</select></label>
  <label class="f" for="years">${t('How long are you willing to study after Class 12?')}<select id="years" data-con="years"><option value="0">${t('Not sure yet')}</option>${[1,2,3].map(i=>`<option value="${i}" ${c.years==i?'selected':''}>${YRS[i]}</option>`).join('')}</select></label>
  <label class="f" for="work">${t('Type of work you prefer')}<select id="work" data-con="work"><option value="any">${t('No preference')}</option>${Object.entries(WORK).map(([k,v])=>`<option value="${k}" ${c.work===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="f" for="loc">${t('Where are you willing to study or work?')}<select id="loc" data-con="loc"><option value="">${t('Not sure yet')}</option>${Object.entries(LOCS).map(([k,v])=>`<option value="${k}" ${c.loc===k?'selected':''}>${t(v)}</option>`).join('')}</select></label>
  </div></div>
 <div class="row between"><button class="btn ghost" data-act="go" data-i="3">${t('Back')}</button><button class="btn" data-act="go" data-i="5">${t('Show my results')}</button></div></main>`}

/* ---------- results ---------- */
const band=v=>v>=75?['pg',t('Strong fit')]:v>=60?['pw',t('Worth exploring')]:['pb',t('Low fit today')];
const pct=v=>`<span class="pill ${band(v)[0]}">${v} · ${band(v)[1]}</span>`;
function reasons(m){const c=m.c,I=interestScores(),A=aptScores(),ev=[],risk=[];
  const ti=Object.keys(c.ints).filter(k=>I[k]>=60).map(k=>AREAS[k]);
  if(ti.length)ev.push(t('You said you enjoy {0}.',AND(ti)));else risk.push(t('Your interest answers for {0} were low or mixed. Try the small task before you rule this career in or out.',Object.keys(c.ints).map(k=>AREAS[k]).join(', ')));
  const strong=Object.keys(c.apt).filter(k=>A[k].obs>=65).map(k=>DOM[k]);
  if(strong.length)ev.push(t('In the quiz you did well in {0}, which this career uses.',AND(strong)));
  const weak=Object.keys(c.apt).filter(k=>A[k].obs!=null&&A[k].obs<=40&&c.apt[k]>=2).map(k=>DOM[k]);
  if(weak.length)risk.push(t('This career leans on {0}, where your quiz result was low this time. This improves with practice; it is not a verdict.',AND(weak)));
  if(m.selfOnly||m.miss)risk.push(t('Aptitude here rests on your own ratings because the quiz was skipped. Take the quiz to firm this up.'));
  const sub=subjHits(c).hit;if(sub.length)ev.push(t('You picked {0} as subjects you like.',AND(sub.map(s=>t(s)))));
  if(!streamOk(c))risk.push(t('Your current stream ({0}) does not match the usual entry route: {1}. Ask about bridge routes before you plan around this.',STREAMS[S.p.stream],streamNames(c)));
  if(m.fb!=null&&m.fb<100)risk.push(t('Typical fees may be above the budget you gave. Look at government colleges and the National Scholarship Portal.'));
  if(m.fy!=null&&m.fy<100)risk.push(t('It needs about {0} years of study after Class 12, longer than you said you want.',c.years));
  if(c.out===1)risk.push(t('Entry is extremely competitive. Keep a parallel option.'));
  if(c.reg)risk.push(t('This is a regulated profession. You need a licence or registration, and rules differ in other countries.'));
  if(S.con.work!=='any'&&!c.work.includes(S.con.work))risk.push(t('Most work here is {0}, not {1}.',c.work.map(w=>WORK[w]).join(t(' or ')),WORK[S.con.work]));
  return {ev,risk}}
function openQs(list){const q=[];if(S.quiz.skipped)q.push(t('The aptitude quiz was skipped, so aptitude rests on self-rating only.'));
  if(!S.p.marks)q.push(t('No exam result was given. Some courses have minimum marks; check each one.'));
  if(!S.con.budget)q.push(t('Study budget is not known, so cost was not used in matching.'));
  if(!S.con.years)q.push(t('How long you are willing to study is not known.'));
  if(!S.con.loc)q.push(t('Whether you can move away from home is not known.'));
  if(!S.p.subjects.length)q.push(t('No favourite subjects were chosen.'));
  if(preStream())q.push(t('Class 11 stream is not chosen yet. This is the biggest decision ahead.'));
  const A=aptScores();for(const d in DOM){const a=A[d];if(a.obs!=null&&a.self!=null&&Math.abs(a.obs-a.self)>=35)q.push((a.self>a.obs?t('{0}: you rated yourself higher than the quiz showed ({1} against {2}).',DOM[d],a.self,a.obs):t('{0}: you rated yourself lower than the quiz showed ({1} against {2}).',DOM[d],a.self,a.obs))+' '+t('Two questions cannot settle it. Ask a teacher or try a longer practice test.'))}
  if(list[0]&&list[1]&&list[0].total-list[1].total<=3)q.push(t('Your top two careers are almost tied ({0} and {1}). Try the small task for both before choosing.',list[0].total,list[1].total));
  return q}
function topActions(m){const c=m.c,l=L[c.links[0]];if(junior())return [t('Do this small test: {0}.',c.tryit),t('Show this page to a parent or teacher and tell them which result surprised you.'),t('Ask one adult who works in this field ({0}) what a normal day is like.',c.name)];return [t('Do this small test: {0}.',c.tryit),t('Open the official page for {0} and read only the eligibility section.',l[0]),t('Talk to one person who works in this field ({0}) or is studying for it, and ask what a normal day is like.',c.name)]}
const whyList=r=>r.ev.length?r.ev:[t('No strong evidence yet. Your answers were evenly spread.')];
const riskList=r=>r.risk.length?r.risk:[t('No clear barrier from the answers you gave. Confirm fees and eligibility on the official site.')];
const subjByGroup=()=>SUBJG.map(([g,l])=>[t(g),l.filter(s=>S.p.subjects.includes(s)).map(s=>t(s))]).filter(x=>x[1].length);

function vResults(){const list=ranked(),tab=S.tab;
  return `<main class="wrap">
  ${S.sample?`<p class="note"><b>${t('This is a sample profile')}</b> ${t('(an imaginary Class 9 student), shown so you can see what the results look like.')} <button class="btn sm" data-act="reset" style="margin-inline-start:8px">${t('Start my own')}</button></p>`:''}
  <div class="plain"><p class="eyebrow">${stepOf(5)} · ${today()}</p><h2>${S.p.name?t('{0}, here are your career matches',esc(S.p.name)):t('Here are your career matches')}</h2></div>
  <div class="tabs" role="tablist">${[['overview','Overview'],['careers','All careers'],['roadmap','12-month plan'],['resources','Official links'],['report','Report card']].map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${t(v)}</button>`).join('')}</div>
  ${{overview:tOverview,careers:tCareers,roadmap:tRoadmap,resources:tResources,report:tReport}[tab](list)}
  </main>`}

function profileRows(){const p=S.p,g=subjByGroup();return [[t('Stream'),preStream()?t('Not chosen yet'):STREAMS[p.stream]||t('Not given')],[t('Subjects'),g.length?g.map(x=>`${x[0]}: ${x[1].join(', ')}`).join(' · '):t('Not given')],[t('Last result'),p.marks?t(p.marks):t('Not given')],[t('Budget'),BUD[S.con.budget]||t('Not sure yet')],[t('Study time'),YRS[S.con.years]||t('Not sure yet')],[t('Work type'),WORK[S.con.work]||t('No preference')]]}
function tOverview(list){const top=list[0],r=reasons(top),I=interestScores(),A=aptScores(),alt=list.slice(1,3),oq=openQs(list);
  const sa=streamAdvice(list),p=S.p;
  return `<div class="grid2">
  <div class="panel"><p class="eyebrow">${top.total<60?t('No clear match yet · closest today'):t('Strongest match today')}</p>${top.total<60?`<p class="note">${t('None of the careers fits your answers strongly yet. That is common, and it is not a problem. You may not have met the things you will enjoy. Try a few of the small tasks in “All careers”, then answer the interest questions again.')}</p>`:''}<div class="row between" style="align-items:flex-start"><h2 style="font-size:1.9rem">${top.c.name}</h2><div class="score" dir="ltr">${top.total}<small> /100</small></div></div>
   <p><b>${t('What they do:')}</b> ${DESC[top.c.id]}</p><p class="small dim">${t('A match score compares this career with your answers. It is not a chance of success.')}</p>
   <div class="plain"><b>${t('Why it fits')}</b><ul class="clean tick">${whyList(r).map(e=>`<li>${e}</li>`).join('')}</ul></div>
   <div class="plain"><b>${t('What could get in the way')}</b><ul class="clean tick">${riskList(r).map(e=>`<li>${e}</li>`).join('')}</ul></div>
   <div class="plain"><b>${t('Two credible alternatives')}</b>${alt.map(m=>`<div class="row between"><span><b>${m.c.name}</b><br><span class="small dim">${DESC[m.c.id]}</span></span>${pct(m.total)}</div>`).join('')}</div>
   <div class="row"><button class="btn sm" data-act="tab" data-v="careers">${t('Compare all {0} careers',CAREERS.length)}</button><button class="btn sm ghost" data-act="tab" data-v="report">${t('Open my report card')}</button></div></div>
  <div class="panel"><p class="eyebrow">${t('Your profile')}</p><h3>${esc(p.name)||t('Student')} · ${STAGES[p.stage]}</h3>
   <table class="kv"><tbody>${profileRows().map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table>
   <div class="plain"><b>${t('Do these three things first')}</b><ol class="acts">${topActions(top).map(a=>`<li>${a}</li>`).join('')}</ol></div></div>
  </div>
  ${preStream()?`<div class="panel"><p class="eyebrow">${t('Class 11 stream')}</p><h3>${t('Which stream keeps your top careers open?')}</h3>
   <p>${t('Of your six strongest matches, this many stay open with each stream:')}</p>
   <div class="bars">${[['PCM','Science with Maths (PCM)'],['PCB','Science with Biology (PCB)'],['any','Commerce / Humanities']].map(([k,v])=>`<div class="bar"><span>${t(v)}</span><div class="t"><span><b style="width:${sa[k]/6*100}%"></b></span></div><span class="v">${sa[k]}/6</span></div>`).join('')}</div>
   <p class="small dim">${t('Pick the stream that keeps your own top careers open and that you can enjoy and manage for two years. Taking both Maths and Biology (PCMB) keeps both science routes open but is a heavier load. Decide with your parents and class teacher after Class 10, not from this page alone.')}</p></div>`:''}
  <div class="grid2">
   <div class="panel"><h3>${t('Aptitude')}</h3>${aptChart(A)}<p class="small dim">${S.quiz.skipped?t('Quiz skipped: bars show your own ratings only.'):t('Quiz bars come from two questions per area, so read them as a hint. Scale 0–100, relative to your stage.')}</p></div>
   <div class="panel"><h3>${t('Interests')}</h3><div class="bars">${Object.entries(I).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${AREAS[k]}</span><div class="t"><span class="s"><b style="width:${v}%"></b></span></div><span class="v">${v}</span></div>`).join('')}</div><p class="small dim">${t('Self-reported from your 20 answers. Scale 0–100.')}</p></div>
  </div>
  <div class="panel"><details ${S.open._g?'open':''} data-tog="_g"><summary style="cursor:pointer"><b>${t('Words used on this page')}</b></summary><table class="kv" style="margin-top:10px"><tbody>${glossary().map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table></details></div>
  <div class="panel"><h3>${t('Questions this page could not answer')}</h3><ul class="clean tick">${(oq.length?oq:[t('None from the profile. Still confirm dates and fees on official sites.')]).map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function glossary(){return [[t('Aptitude'),t('How easily you pick up a kind of thinking, such as numbers or patterns. It grows with practice.')],[t('Match score'),t('How closely a career fits the answers you gave today, out of 100.')],[t('Stream'),t('The subject group you choose in Class 11: Science (PCM or PCB), Commerce or Humanities.')],[t('Eligibility'),t('The minimum subjects, marks or age you need before you may apply.')],[t('Entrance exam'),t('A test that colleges or employers use to select people, such as JEE, NEET or CUET.')],[t('Regulated profession'),t('A job you may do only after registering with an official council, such as doctor, nurse or lawyer.')],[t('Observed / self-reported'),t('Observed means measured by the quiz. Self-reported means you told us yourself.')]]}

async function buildReport(list){
  const rtl=LANG==='ur',F='"Atkinson Hyperlegible","Noto Sans Devanagari","Noto Sans Gujarati","Noto Naskh Arabic","Nirmala UI","Segoe UI",Tahoma,Verdana,sans-serif',FD='"Bricolage Grotesque",'+F;

    await Promise.race([Promise.all(want.map(f=>document.fonts.load(f,t('Aptitude')+' A'))),new Promise(r=>setTimeout(r,3000))])}catch(e){}
  const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGO});
  const W=RP.W,H=RP.H,M=RP.M,CW=W-2*M,lh=LANG==='en'?1.42:1.7,pages=[];let cx,y;

    const first=pages.length===1,bh=first?220:88;cx.fillStyle=NAVY;cx.fillRect(0,0,W,bh);cx.fillStyle=ORA;cx.fillRect(0,bh,W,6);
    if(logo){const h=first?160:60,w=h*logo.width/logo.height;cx.drawImage(logo,rtl?W-M-w+8:M-8,(bh-h)/2,w,h)}
    cx.fillStyle='#FFFFFF';cx.textAlign=AR;

    else{font(22,1);cx.fillText(name+' · '+t('Career report card'),X(W-M),54)}
    y=bh+46}
  function wrap(s,maxW){const out=[];String(s).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const tr=line?line+' '+w:w;if(line&&cx.measureText(tr).width>maxW){out.push(line);line=w}else line=tr});out.push(line)});return out}
  function need(h){if(y+h>H-150)newPage()}
  function text(s,o={}){const sz=o.sz||23,x=o.x||M,w=o.w||(W-M-x);font(sz,o.b,o.d);const ls=wrap(s,w);ls.forEach(l=>{need(sz*lh);font(sz,o.b,o.d);cx.fillStyle=o.col||INK;cx.textAlign=AL;cx.fillText(l,X(x),y+sz);y+=sz*lh});y+=o.gap??8}
  function head(s,extra){need(150+(extra||0));y+=18;cx.fillStyle=ORA;cx.fillRect(rtl?W-M-64:M,y,64,6);y+=16;text(s,{sz:31,b:1,d:1,gap:10})}
  function bullets(a,o={}){a.forEach(s=>{font(o.sz||23);const ls=wrap(s,CW-34);need((o.sz||23)*lh*Math.min(ls.length,3));cx.fillStyle=ORA;cx.beginPath();cx.arc(X(M+9),y+17,6,0,7);cx.fill();text(s,{x:M+34,sz:o.sz||23,gap:6})});y+=6}
  function kv(k,v){const kw=300;font(21,1);const kl=wrap(k,kw-20);font(23);const vl=wrap(v,CW-kw);const rows=Math.max(kl.length,vl.length);need(23*lh*rows+18);const y0=y;
    kl.forEach((l,i)=>{font(21,1);cx.fillStyle=DIM;cx.textAlign=AL;cx.fillText(l,X(M),y0+23+i*23*lh)});

function makePdf(jpegs,w,h){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(id+' 0 obj\n');body();push('\nendobj\n')};
  push('%PDF-1.4\n%âãÏÓ\n');const n=jpegs.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`));
  jpegs.forEach((j,i)=>{const p=3+3*i,c='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
    obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);push(j);push('\nendstream')})});
  const xref=len,total=3+3*n;push(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length});return out}
