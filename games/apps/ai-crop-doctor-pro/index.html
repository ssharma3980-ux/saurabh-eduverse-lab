const REF=`Students' reference guide (Plant Health Reference Guide):
Diseases: Late blight - oomycete Phytophthora infestans - potato, tomato | Powdery mildew - fungal Erysiphe/Podosphaera - cucurbits, roses, vegetables | Stem (black) rust - fungal Puccinia graminis - wheat, barley | Rice blast - fungal Magnaporthe oryzae - rice | Verticillium wilt - fungal Verticillium dahliae - tomato, cucumber, trees | Fire blight - bacterial Erwinia amylovora - apple, pear | Citrus canker - bacterial Xanthomonas citri - citrus | Tobacco mosaic - viral TMV - tobacco, tomato, pepper | Tomato yellow leaf curl - viral TYLCV - tomato | Root-knot - nematode Meloidogyne - vegetables.
Deficiencies: N - pale/yellow older leaves first, stunting | P - dark green or reddish-purple older leaves, slow growth | K - scorched brown edges on older leaves | Ca - dying growing tips, distorted new leaves, blossom-end rot | Mg - interveinal chlorosis on older leaves | S - light green/yellow younger leaves first | Fe - sharp interveinal chlorosis on young leaves, green veins | Zn - little leaf/rosette, interveinal chlorosis, small distorted upper leaves.
Students' illustrated library (use these exact names when they match): `+LIB.map(d=>d.name+' ('+d.agent+'; '+d.crops+')').join(' | ')+`
Quick key: `+KEY.map(k=>k[0]+' -> '+k[1]).join(' | ');

function buildPrompt(cropKey,web){
  const hint=CROPS[cropKey]?`The farmer says this crop is ${CROPS[cropKey].name.en}. Check that this matches the leaf.`:"The crop is not given; identify it from the leaf.";
  return `You are the diagnosis engine of "AI Crop Doctor", a science-exhibition project by students of Hanifa School, Borsad (Anand district, Gujarat, India). The attached image is a photo of a plant leaf taken by a farmer or student.
${hint}
Examine THIS image carefully and base the answer only on what is visible in it: crop identity from leaf shape and venation; colour pattern (uniform, interveinal, margins, veins, young vs old leaf); spots (shape, size, colour, yellow halo, concentric rings, angular between veins); powdery or downy growth; rust pustules; mosaic or mottling; curling or puckering; holes, mines, insects or webbing; wilting or scorch. Never return a default answer.
Choose the single most likely diagnosis: fungal, bacterial, viral, oomycete, nematode, insect/mite pest, nutrient deficiency, physical/environmental damage (sunscald, herbicide, water stress), or healthy. Use your full plant-pathology knowledge, not only this list:
${REF}
If the photo is not a plant, set is_plant false. If the image is blurry or ambiguous, use status "unclear" with confidence below 50. Confidence must honestly reflect certainty; list up to 3 alternatives with their confidence.
Treatment must be practical, low-cost and safe for a small farmer in Gujarat: sanitation, cultural practices, neem or other organic options, resistant varieties, and pest control methods such as sticky traps. You may name the class of approved chemical control (for example "copper-based fungicide") but never a dose; say to confirm with the Krishi Vigyan Kendra or Anand Agricultural University.
Nutrient advice: which nutrient(s) to supply or correct, with an organic or fertiliser source, and to follow the Soil Health Card.
Write every text field in three languages: en (plain English), gu (simple Gujarati script), hi (simple Hindi, Devanagari). Each list has 2-4 short items.
Reply with only one JSON object, exactly this shape:
{"is_plant":true,"status":"healthy|disease|pest|deficiency|damage|unclear","confidence":0,"severity":"none|low|medium|high","crop":{"en":"","gu":"","hi":""},"name":{"en":"","gu":"","hi":""},"type":{"en":"","gu":"","hi":""},"pathogen":"scientific name, or empty","signs":{"en":[],"gu":[],"hi":[]},"cause":{"en":"","gu":"","hi":""},"remedy":{"en":[],"gu":[],"hi":[]},"nutrient":{"en":[],"gu":[],"hi":[]},"prevention":{"en":[],"gu":[],"hi":[]},"alternatives":[{"name":"","confidence":0}],"expert":{"en":"","gu":"","hi":""}}`;
}

function icon(k,cls){const n=el("span",cls||"ic");n.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';return n}
function donut(fr){const n=el("div","donut"),seg=[["var(--good)",fr.g],["var(--accent)",fr.y],["var(--bad)",fr.b]];let off=25,h='<svg viewBox="0 0 42 42" width="112" height="112" role="img" aria-label="Leaf colour share"><circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--line)" stroke-width="5"/>';
  for(const [c,v] of seg){const p=Math.max(0,Math.min(100,v*100));if(p>0.5)h+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="'+c+'" stroke-width="5" stroke-dasharray="'+p.toFixed(2)+' '+(100-p).toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>';off-=p}
  n.innerHTML=h+'<text x="21" y="23.5" text-anchor="middle" font-size="8" font-weight="700" fill="var(--ink)">'+Math.round(fr.g*100)+'%</text></svg>';return n}

function scanLeaf(image){
  const W=220,H=Math.max(1,Math.round(W*image.naturalHeight/image.naturalWidth)),c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.drawImage(image,0,0,W,H);const p=x.getImageData(0,0,W,H).data;
  const plant=new Uint8Array(W*H),hsv=new Float32Array(W*H*3);
  for(let k=0,i=0;i<p.length;i+=4,k++){const R=p[i]/255,G=p[i+1]/255,B=p[i+2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),dl=mx-mn,s=mx?dl/mx:0;let h=0;
    if(dl){h=mx===R?((G-B)/dl)%6:mx===G?(B-R)/dl+2:(R-G)/dl+4;h*=60;if(h<0)h+=360}
    hsv[k*3]=h;hsv[k*3+1]=s;hsv[k*3+2]=mx;
    if((s>0.22&&mx>0.12&&(h<175||h>345))||(mx<0.3&&s>0.1&&(h<175||h>345)))plant[k]=1}
  const rowMin=new Int16Array(H).fill(-1),rowMax=new Int16Array(H).fill(-1),colMin=new Int16Array(W).fill(-1),colMax=new Int16Array(W).fill(-1);
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)if(plant[yy*W+xx]){if(rowMin[yy]<0)rowMin[yy]=xx;rowMax[yy]=xx;if(colMin[xx]<0)colMin[xx]=yy;colMax[xx]=yy}
  let leaf=0,g=0,gl=0,gd=0,y=0,b=0,o=0,blk=0,wht=0;
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const k=yy*W+xx,h=hsv[k*3],s=hsv[k*3+1],v=hsv[k*3+2];
    if(plant[k]){leaf++;
      if(v<0.2)blk++;
      else if(h>=68&&h<175){g++;if(v<0.45)gd++;else if(v>0.62&&s<0.6)gl++}
      else if(h>=42&&h<68&&v>=0.45)y++;
      else if(h>=12&&h<42&&s>0.55&&v>0.5)o++;
      else b++}
    else if(s<0.18&&v>0.72&&xx>rowMin[yy]&&xx<rowMax[yy]&&yy>colMin[xx]&&yy<colMax[xx])wht++}
  return{total:W*H,leaf,g:g/Math.max(1,leaf),gl:gl/Math.max(1,leaf),gd:gd/Math.max(1,leaf),y:y/Math.max(1,leaf),b:b/Math.max(1,leaf),o:o/Math.max(1,leaf),blk:blk/Math.max(1,leaf),wht:wht/Math.max(1,leaf+wht)};
}

  const T0=OFF[key],cr=CROPS[crop];
  const seen=L([`Green: ${pc(f.g)}, yellow: ${pc(f.y)}, brown or dry: ${pc(f.b+f.o)}`,f.wht>0.05?`White powder-like area: ${pc(f.wht)}`:"",f.blk>0.1?`Black area: ${pc(f.blk)}`:""].filter(Boolean),
    [`લીલો: ${pc(f.g)}, પીળો: ${pc(f.y)}, કથ્થઈ/સૂકો: ${pc(f.b+f.o)}`,f.wht>0.05?`સફેદ ભૂકી જેવો ભાગ: ${pc(f.wht)}`:"",f.blk>0.1?`કાળો ભાગ: ${pc(f.blk)}`:""].filter(Boolean),
    [`हरा: ${pc(f.g)}, पीला: ${pc(f.y)}, भूरा/सूखा: ${pc(f.b+f.o)}`,f.wht>0.05?`सफ़ेद चूर्ण जैसा भाग: ${pc(f.wht)}`:"",f.blk>0.1?`काला भाग: ${pc(f.blk)}`:""].filter(Boolean));
  return{is_plant:true,offline:true,status:T0.status,confidence:conf,severity:T0.severity,pathogen:T0.pathogen,
    crop:cr?cr.name:L("","",""),name:T0.name,type:T0.type,signs:seen,cause:T0.cause,remedy:T0.remedy,nutrient:T0.nutrient,prevention:T0.prevention,
    alternatives:T0.alts.map((n,i)=>({name:n,confidence:Math.max(5,25-i*8)})),
    expert:L("This is a quick colour check. For a sure answer, show the leaf to the Krishi Vigyan Kendra.","આ ઝડપી રંગ-તપાસ છે. ખાતરી માટે પાન કૃષિ વિજ્ઞાન કેન્દ્રમાં બતાવો.","यह त्वरित रंग-जाँच है। पक्का जानने के लिए पत्ता कृषि विज्ञान केंद्र में दिखाएँ।")};
}
Object.assign(T.gu,{engC:"AI: Claude દ્રષ્ટિ મોડેલ (બેકઅપ: ઑફલાઇન રંગ-તપાસ)",engOff:"ઑફલાઇન રંગ-તપાસ: AI વગર પણ કામ કરે છે",offNote:"આ પરિણામ ઑફલાઇન રંગ-તપાસથી આવ્યું છે."});
Object.assign(T.hi,{engC:"AI: Claude विज़न मॉडल (बैकअप: ऑफ़लाइन रंग-जाँच)",engOff:"ऑफ़लाइन रंग-जाँच: AI के बिना भी काम करता है",offNote:"यह परिणाम ऑफ़लाइन रंग-जाँच से आया है।"});
Object.assign(T.en,{engC:"AI: Claude vision model (backup: offline colour check)",engOff:"Offline colour check: works without AI",offNote:"This result comes from the offline colour check."});
Object.assign(T.gu.err,{fallback:"AI હમણાં ઉપલબ્ધ નથી, તેથી ઑફલાઇન રંગ-તપાસ વાપરી."});
Object.assign(T.hi.err,{fallback:"AI अभी उपलब्ध नहीं है, इसलिए ऑफ़लाइन रंग-जाँच इस्तेमाल हुई।"});
Object.assign(T.en.err,{fallback:"The AI was not available, so the offline colour check was used."});

async function diagnose(image,signal){
  if(engine==="claude"){
    try{const {blob}=await prep(image);const r=await sample.json(buildPrompt(crop,false),{images:blob,signal,modelTier:"complex"});if(r&&typeof r==="object")return r;throw{code:"invalid_json"}}
    catch(e){if(e&&e.code==="cancelled")throw e;const r=offlineDiagnose(image);r.fallback=(e&&e.code)||"other";if(["not_granted","sampling_disabled","not_declared","capability_disabled","images_unavailable"].includes(r.fallback)){sample=null;setEngine()}return r}
  }
  return offlineDiagnose(image);
}

async function runCheck(){
  if(!img||busy)return;busy=true;msgKey=null;ctl=new AbortController();renderAll();
  try{colour=analyse(img);const r=await diagnose(img,ctl.signal);current=r;isExample=false;marked=!r.is_plant;if(r.fallback)msgKey="fallback"}
  catch(e){if(!e||e.code!=="cancelled")msgKey=(e&&e.code)||"other";if(e&&e.detail)console.warn(e.detail)}
  finally{busy=false;renderAll()}
}
$("go").onclick=runCheck;
$("stop").onclick=()=>ctl&&ctl.abort();
function saveTally(){store.set("cdai-tally",JSON.stringify(tally))}
function mark(ok){if(marked)return;marked=true;tally.total++;if(ok)tally.ok++;saveTally();renderAll()}
$("ok").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
$("reset").onclick=()=>{if(!resetArmed){resetArmed=true;renderAll();setTimeout(()=>{resetArmed=false;renderAll()},3000);return}resetArmed=false;tally={ok:0,total:0};saveTally();renderAll()};

// Accuracy test bench: up to 20 photos, diagnosed one after another, each marked by the students.
let bench=[],benchRun=false,benchCtl=null;
$("b-files").onchange=async e=>{const fs=[...e.target.files].filter(f=>/^image\//.test(f.type)).slice(0,20);e.target.value="";
  bench=await Promise.all(fs.map(async f=>{const src=await readFile(f);return{name:f.name,src,state:"wait",r:null,mark:null}}));renderAll()};
function renderBench(){
  const t=T[lang],g=$("b-grid");g.replaceChildren();
  bench.forEach((b,i)=>{const c=el("div","bcard"+(b.mark===true?" right":b.mark===false?" wrong":""));const im=el("img");im.src=b.src;im.alt="Test leaf "+(i+1);c.append(im);
    const body=el("div","bbody");body.append(el("span","bn",String(i+1)));
    if(b.state==="wait")body.append(el("p","cap",t.bwait));else if(b.state==="work")body.append(el("p","cap",t.bwork));
    else if(b.state==="err")body.append(el("p","cap",t.err[b.err]||t.err.other));
    else{const r=b.r;body.append(el("b",null,r.is_plant?String(pick(r.name)):t.notplant));if(r.is_plant)body.append(el("p","cap",[pick(r.crop),Math.round(Number(r.confidence)||0)+"%"].filter(Boolean).join(" · ")));
      const row=el("div","row");const y=el("button","btn small"+(b.mark===true?" sel":""),"✔"),n=el("button","btn small"+(b.mark===false?" sel":""),"✘");y.type=n.type="button";
      y.onclick=()=>{b.mark=true;renderAll()};n.onclick=()=>{b.mark=false;renderAll()};y.setAttribute("aria-label",t.ok);n.setAttribute("aria-label",t.no);row.append(y,n);body.append(row)}
    c.append(body);g.append(c)});
  const marked=bench.filter(b=>b.mark!==null),right=marked.filter(b=>b.mark).length;
  $("b-score").textContent=bench.length?(marked.length?right+" / "+marked.length+" "+t.bdone+" ("+Math.round(right/marked.length*100)+"%)":bench.length+" 🖼"):"";
  $("b-run").disabled=benchRun||!bench.length||busy;$("b-stop").hidden=!benchRun;
}
$("b-run").onclick=async()=>{
  benchRun=true;benchCtl=new AbortController();renderAll();
  for(const b of bench){if(benchCtl.signal.aborted)break;if(b.state==="done")continue;b.state="work";renderAll();
    try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=b.src});b.r=await diagnose(im,benchCtl.signal);b.state="done"}
    catch(e){if(e&&e.code==="cancelled"){b.state="wait";break}b.state="err";b.err=(e&&e.code)||"other";}
    renderAll()}
  benchRun=false;renderAll();
};
$("b-stop").onclick=()=>benchCtl&&benchCtl.abort();

setEngine();renderAll();
try{(function(){const c=$("fx"),x=c.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;let W=0,H=0,P=[];
function size(){const r=c.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
function mk(){return{x:Math.random()*W,y:Math.random()*H,s:12+Math.random()*30,a:Math.random()*6.28,va:(Math.random()-.5)*.006,vx:.1+Math.random()*.25,vy:.04+Math.random()*.1,o:.05+Math.random()*.1}}
function leaf(l){x.save();x.translate(l.x,l.y);x.rotate(l.a);x.globalAlpha=l.o;x.fillStyle="#fff";x.beginPath();x.moveTo(0,-l.s);x.bezierCurveTo(l.s*.8,-l.s*.5,l.s*.8,l.s*.5,0,l.s);x.bezierCurveTo(-l.s*.8,l.s*.5,-l.s*.8,-l.s*.5,0,-l.s);x.fill();x.globalAlpha=Math.min(1,l.o*2.5);x.strokeStyle="#143f26";x.lineWidth=1;x.beginPath();x.moveTo(0,-l.s*.8);x.lineTo(0,l.s*.9);x.stroke();x.restore()}
function frame(){x.clearRect(0,0,W,H);for(const l of P){if(!still){l.x+=l.vx;l.y+=l.vy;l.a+=l.va;if(l.x>W+50)l.x=-50;if(l.y>H+50)l.y=-50}leaf(l)}if(!still)requestAnimationFrame(frame)}
size();P=Array.from({length:Math.max(12,Math.round(W/60))},mk);frame();addEventListener("resize",()=>{size();if(still)frame()});})()}catch(e){}
(async()=>{if(!inArtifact)return;try{const s=await window.claude.use("sample");if(s){const lim=await s.limits().catch(()=>null);if(lim&&lim.images)sample=s}}catch(e){}setEngine();renderAll()})();
</script>
