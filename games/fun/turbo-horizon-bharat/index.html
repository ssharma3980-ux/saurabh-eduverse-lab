<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Horizon: Bharat Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#05070f;color:#fff;font-family:Rajdhani,system-ui,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.playing-only{display:none}
body.playing .playing-only{display:block}
body.playing #bp{display:flex}
#top{display:none;top:0;left:0;right:0;justify-content:space-between;align-items:flex-start;padding:12px 14px;gap:10px}
body.playing #top{display:flex}
.box{background:rgba(8,12,28,.5);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl{font-size:11px;letter-spacing:2px;opacity:.7;font-weight:700}
.val{font-family:Orbitron,sans-serif;font-weight:800;font-size:22px;line-height:1.1}
#hearts{font-size:20px;letter-spacing:2px}
#coins{color:#ffd54a}
#speedo{bottom:14px;left:50%;transform:translateX(-50%);text-align:center}
#kmh{font-family:Orbitron,sans-serif;font-weight:900;font-size:44px;line-height:1}
#kmh small{font-size:13px;opacity:.7;letter-spacing:2px;margin-left:4px}
#nbar{width:190px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);margin:6px auto 0;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#nfill{height:100%;width:0;background:linear-gradient(90deg,#22e1ff,#7b5cff,#ff3d9a);transition:width .12s}
#nlbl{font-size:11px;letter-spacing:3px;font-weight:700;margin-top:3px;opacity:.8}
#next{top:62px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:2px;font-weight:700;opacity:.85;white-space:nowrap}
#pop{top:30%;left:0;right:0;text-align:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:28px;opacity:0}
#pop.show{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#zone{top:17%;left:0;right:0;text-align:center;opacity:0;transition:opacity .6s}
#zone.show{opacity:1}
#zone .w{font-size:14px;letter-spacing:6px;font-weight:700;opacity:.85}
#zone .n{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(30px,8vw,58px);letter-spacing:4px;background:linear-gradient(90deg,#ff9933,#ffffff 50%,#138808);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
#zone .s{font-size:16px;letter-spacing:3px;font-weight:600}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,60,.75));opacity:0;transition:opacity .25s}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
.ctl{position:fixed;z-index:6;bottom:18px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:34px;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ctl.on{background:rgba(34,225,255,.35);border-color:#22e1ff}
#bl{left:16px}#br{left:116px}
#bn{right:16px;width:96px;height:96px;font-family:Orbitron,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;border-color:#ff3d9a;background:rgba(255,61,154,.18)}
#bn.on{background:rgba(255,61,154,.55)}
body.touch.playing .ctl{display:flex}
body.touch #speedo{bottom:auto;top:96px}
body.touch #next{top:62px}
#bp{position:fixed;z-index:6;top:12px;left:50%;transform:translateX(-50%);gap:8px;display:none}
.mini{width:40px;height:40px;border-radius:10px;background:rgba(8,12,28,.5);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:17px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,rgba(5,8,20,.55),rgba(5,8,20,.88))}
.ov.on{display:flex}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:2px;background:linear-gradient(90deg,#ff9933,#fff 55%,#22e1ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,153,51,.35))}
h2{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(26px,7vw,48px);margin-bottom:6px}
.sub{font-size:15px;letter-spacing:5px;opacity:.85;margin:6px 0 4px;font-weight:700}
.btn{pointer-events:auto;cursor:pointer;font-family:Orbitron,sans-serif;font-weight:800;font-size:19px;letter-spacing:2px;color:#fff;border:none;padding:15px 40px;border-radius:50px;background:linear-gradient(90deg,#ff7a1a,#ff3d9a,#7b5cff);box-shadow:0 8px 30px rgba(255,90,90,.45)}
.btn.pulse{animation:pulse 1.6s infinite}
.btn:disabled{filter:grayscale(1);opacity:.6;animation:none;cursor:default}
@keyframes pulse{50%{transform:scale(1.05)}}
/* menu panel */
#menu.panel{display:none;right:auto;width:min(450px,100%);justify-content:flex-start;align-items:stretch;text-align:left;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:20px 20px 28px;background:linear-gradient(90deg,rgba(5,8,20,.94),rgba(5,8,20,.86) 75%,rgba(5,8,20,.55))}
#menu.panel.on{display:block}
@media (max-aspect-ratio:1/1){#menu.panel{top:38vh;width:100%;right:0;background:linear-gradient(180deg,rgba(5,8,20,.7),rgba(5,8,20,.94) 40px)}}
.sec{font-size:12px;letter-spacing:4px;font-weight:700;opacity:.7;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.wal{color:#ffd54a;font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:1px;opacity:1}
.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mc{position:relative;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid transparent;min-height:58px;overflow:hidden;box-shadow:inset 0 -40px 40px rgba(0,0,0,.45)}
.mc b{display:block;font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.mc span{font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.mc.sel{border-color:#fff;box-shadow:0 0 0 2px #ff9933,inset 0 -40px 40px rgba(0,0,0,.45)}
.mc.tour{grid-column:1/-1}
.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cc{text-align:left;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1)}
.cc.sel{border-color:#22e1ff;background:rgba(34,225,255,.12)}
.cc b{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.5)}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;font-weight:700;opacity:.85;margin-top:4px}
.bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i u{display:block;height:100%;background:linear-gradient(90deg,#22e1ff,#ff3d9a)}
.cc .pr{margin-top:6px;font-size:13px;font-weight:700;color:#ffd54a}
.cc .pr.own{color:#2bff9b}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.3);font-weight:700;letter-spacing:1px;font-size:13px}
.chip.on{background:rgba(34,225,255,.2);border-color:#22e1ff}
.how{margin-top:14px;font-size:15px;line-height:1.6;opacity:.85}
.how b{color:#22e1ff}
#best{margin-top:8px;font-size:15px;letter-spacing:2px;color:#ffd54a;font-weight:700}
#err{color:#ff8a9a;margin-top:10px;font-size:15px}
#start{width:100%;margin-top:18px;position:sticky;bottom:6px;z-index:2}
.stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;margin:14px 0 18px}
.stats .box{padding:10px 16px}
#newbest{color:#2bff9b;font-family:Orbitron,sans-serif;font-weight:800;margin-bottom:6px;display:none}
#earned{color:#ffd54a;font-weight:700;letter-spacing:2px;margin-bottom:14px}
.ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="flash"></div>

<div class="hud" id="top">
  <div class="box"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
  <div class="box" style="text-align:right"><div id="hearts">❤❤❤</div><div class="val" id="coins">● 0</div></div>
</div>
<div id="bp"><button class="mini" id="pause">❚❚</button><button class="mini" id="mute">🔊</button></div>
<div class="hud playing-only" id="next"></div>
<div class="hud playing-only" id="speedo">
  <div id="kmh">0<small>KM/H</small></div>
  <div id="nbar"><div id="nfill"></div></div>
  <div id="nlbl">NITRO</div>
</div>
<div class="hud" id="pop"></div>
<div class="hud" id="zone"><div class="w">WELCOME TO</div><div class="n" id="zn"></div><div class="s" id="zs"></div></div>

<button class="ctl" id="bl">◀</button>
<button class="ctl" id="br">▶</button>
<button class="ctl" id="bn">NITRO</button>

<div class="ov panel on" id="menu">
  <h1>TURBO HORIZON</h1>
  <div class="sub">BHARAT EDITION</div>
  <div class="sec">CHOOSE ROUTE</div>
  <div class="maps" id="maps"></div>
  <div class="sec">GARAGE <span class="wal" id="wallet"></span></div>
  <div class="cars" id="cars"></div>
  <button class="btn pulse" id="start">START</button>
  <div class="row"><button class="chip" id="hd"></button><span id="best"></span></div>
  <div class="how" id="how"></div>
  <div id="err"></div>
</div>
<div class="ov" id="paused">
  <h2>PAUSED</h2>
  <div class="ovbtns" style="margin-top:16px"><button class="btn" id="resume">RESUME</button><button class="btn ghost" id="quit">MENU</button></div>
</div>
<div class="ov" id="over">
  <h2>CRASHED!</h2>
  <div id="newbest">★ NEW BEST SCORE ★</div>
  <div class="stats">
    <div class="box"><div class="lbl">SCORE</div><div class="val" id="oScore">0</div></div>
    <div class="box"><div class="lbl">BEST</div><div class="val" id="oBest">0</div></div>
    <div class="box"><div class="lbl">DISTANCE</div><div class="val" id="oDist">0</div></div>
    <div class="box"><div class="lbl">TOP SPEED</div><div class="val" id="oTop">0</div></div>
    <div class="box"><div class="lbl">CITIES</div><div class="val" id="oCity">1</div></div>
    <div class="box"><div class="lbl">CLOSE CALLS</div><div class="val" id="oNear">0</div></div>
  </div>
  <div id="earned"></div>
  <div class="ovbtns"><button class="btn" id="again">RACE AGAIN</button><button class="btn ghost" id="garage">GARAGE</button></div>
</div>

<script src="../../vendor/three-r128/three.min.js"></script>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;

$('how').innerHTML=isTouch
 ?'Hold <b>◀ ▶</b> or touch either side to steer · <b>NITRO</b> to boost. Dodge Indian traffic, grab coins, pass cars closely for bonus.'
 :'<b>← →</b> / <b>A D</b> steer · <b>SPACE</b> nitro · <b>P</b> pause. Dodge Indian traffic, grab coins, pass cars closely for bonus.';

/* ================= helpers ================= */
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];

const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
const TXC={};const textTex=(k,w,h,d)=>TXC[k]||(TXC[k]=canvasTex(w,h,d));
const PC={};const P=(k,f)=>PC[k]||(PC[k]=f());

/* ================= save ================= */
const SAVE_KEY='turboHorizonBharat';
const save={best:0,wallet:0,owned:['vortex','yatra'],car:'vortex',map:'tour',hd:true,gfx:2};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s)Object.assign(save,s);}catch(e){}
if(!save.owned.includes('yatra'))save.owned.push('yatra');if(save.gfx==null)save.gfx=2;save.hd=save.gfx>0;
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ================= renderer ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
function applyPR(){const dpr=window.devicePixelRatio||1;renderer.setPixelRatio(save.gfx===2?Math.min(dpr,2):save.gfx===1?Math.min(dpr,1.25):1);
  const sm=save.gfx===2?(isTouch?2048:4096):save.gfx===1?1536:1024;try{if(dir.shadow.mapSize.x!==sm){dir.shadow.mapSize.set(sm,sm);if(dir.shadow.map){dir.shadow.map.dispose();dir.shadow.map=null;}}}catch(e){}}
applyPR();
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.LinearEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(62,1,0.1,2000);
let composer=null,bloom=null;
function setupPost(){
  if(composer||!(THREE.EffectComposer&&THREE.RenderPass&&THREE.UnrealBloomPass&&THREE.ShaderPass&&THREE.GammaCorrectionShader))return;
  try{composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),.5,.5,.9);composer.addPass(bloom);}catch(e){composer=null;bloom=null;}
}
setupPost();
let VW=1,VH=1;
function resize(){VW=window.innerWidth;VH=window.innerHeight;renderer.setSize(VW,VH,false);camera.aspect=VW/VH;camera.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(VW,VH);}applyViewOffset();}
window.addEventListener('resize',resize);

/* ================= geometry helpers ================= */
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d), cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8), cone=(r,h,s)=>new THREE.ConeGeometry(r,h,s||8);
const sph=(r,a,b)=>new THREE.SphereGeometry(r,a||10,b||8), ico=(r,d)=>new THREE.IcosahedronGeometry(r,d||0);
const hemi=(r,s)=>new THREE.SphereGeometry(r,s||12,6,0,Math.PI*2,0,Math.PI/2);
function T(x,y,z,o){o=o||{};const s=o.s||1;return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx||0,o.ry||0,o.rz||0,'YXZ')),new THREE.Vector3(o.sx||s,o.sy||s,o.sz||s));}
function merge(parts){
  let n=0;const gs=[];
  for(const [g0,m,c] of parts){const g=g0.index?g0.toNonIndexed():g0.clone();if(m)g.applyMatrix4(m);gs.push([g,new THREE.Color(c==null?0xffffff:c)]);n+=g.attributes.position.count;}
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
  for(const [g,c] of gs){const k=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);
    for(let i=0;i<k;i++){col[(o+i)*3]=c.r;col[(o+i)*3+1]=c.g;col[(o+i)*3+2]=c.b;}o+=k;g.dispose();}
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(pos,3));out.setAttribute('normal',new THREE.BufferAttribute(nor,3));out.setAttribute('color',new THREE.BufferAttribute(col,3));out.computeBoundingSphere();return out;}
function smoothNormals(g,cosT){const p=g.attributes.position,n=g.attributes.normal,cnt=p.count,map=new Map(),fn=new Float32Array(n.array);
  for(let i=0;i<cnt;i++){const k=Math.round(p.getX(i)*500)+','+Math.round(p.getY(i)*500)+','+Math.round(p.getZ(i)*500);let a=map.get(k);if(!a)map.set(k,a=[]);a.push(i);}
  for(const a of map.values())for(const i of a){let x=0,y=0,z=0;for(const j of a){if(fn[i*3]*fn[j*3]+fn[i*3+1]*fn[j*3+1]+fn[i*3+2]*fn[j*3+2]>cosT){x+=fn[j*3];y+=fn[j*3+1];z+=fn[j*3+2];}}const l=Math.hypot(x,y,z)||1;n.setXYZ(i,x/l,y/l,z/l);}
  n.needsUpdate=true;return g;}
function extrude(draw,depth,bev,seg){const s=new THREE.Shape();draw(s);const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelSegments:seg||3,curveSegments:12,steps:1});
  g.rotateY(-Math.PI/2);g.computeBoundingBox();const bb=g.boundingBox;g.translate(-(bb.min.x+bb.max.x)/2,0,0);return smoothNormals(g,.72);}
function taper(g,fn){const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setX(i,p.getX(i)*fn(p.getY(i)));p.needsUpdate=true;g.computeVertexNormals();return smoothNormals(g,.72);}
const bodyTaper=y=>y>.62?1-(y-.62)*.16:(y<.36?1-(.36-y)*.5:1), cabTaper=y=>1-Math.max(0,y-.8)*.32;
function archGeo(w,h,d,ow,oh){const s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(w/2,h);s.lineTo(-w/2,h);s.lineTo(-w/2,0);
  const r=ow/2,hole=new THREE.Path();hole.moveTo(-r,.6);hole.lineTo(r,.6);hole.lineTo(r,oh-r);hole.absarc(0,oh-r,r,0,Math.PI,false);hole.lineTo(-r,.6);s.holes.push(hole);
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false,curveSegments:14});g.translate(0,0,-d/2);return g;}
const std=(c,r,m,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r==null?.9:r,metalness:m||0},o||{}));
const envMats=[];
const vcMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,flatShading:true});
const vcSmooth=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.6,metalness:.1});
const vcFar=new THREE.MeshLambertMaterial({vertexColors:true,fog:false});
function mesh(geo,mat,x,y,z,o){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(o){if(o.ry)m.rotation.y=o.ry;if(o.rx)m.rotation.x=o.rx;if(o.rz)m.rotation.z=o.rz;if(o.s)m.scale.setScalar(o.s);if(o.cast)m.castShadow=true;if(o.recv)m.receiveShadow=true;}return m;}
const glowTex=canvasTex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,2,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);});

/* ================= sky ================= */

          {top:C(0x30286e),bot:C(0xff8f4e),sun:C(0xff9858),si:1.0,hi:.5,n:.4,sy:70},

let AC=null,eng=null,muted=false;
function audioInit(){if(AC)return;try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o1.type='sawtooth';o2.type='square';f.type='lowpass';g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
  const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const wn=AC.createBufferSource();wn.buffer=nb;wn.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=700;const wg=AC.createGain();wg.gain.value=0;wn.connect(wf);wf.connect(wg);wg.connect(master);wn.start();
  eng={o1,o2,f,g,wg,wf,master,nb};
}catch(e){AC=null;}}
function tone(fr,to,dur,type,vol){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(eng.master);o.start(t);o.stop(t+dur);}
function noise(dur,freq,vol){if(!AC||muted)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=eng.nb;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(eng.master);s.start(t);s.stop(t+dur);}
function horn(){if(!AC||muted)return;tone(420,410,.35,'square',.06);tone(530,520,.35,'square',.05);}
function engineSound(speed,nitro,on){if(!AC)return;const t=AC.currentTime,v=(on&&!muted)?1:0;
  const rpm=45+(speed%28)*3.2+speed*.9;
  eng.o1.frequency.setTargetAtTime(rpm,t,.08);eng.o2.frequency.setTargetAtTime(rpm*.502,t,.08);
  eng.f.frequency.setTargetAtTime(260+speed*11+(nitro?800:0),t,.1);eng.g.gain.setTargetAtTime(.05*v,t,.1);
  eng.wg.gain.setTargetAtTime(v*(clamp(speed/70,0,1)*.07+weatherAmt*.05),t,.2);eng.wf.frequency.setTargetAtTime(500+speed*14,t,.2);}

/* ================= update ================= */
let worldT=6,camX=0,menuT=0;
const MENU_T=22.6;
function update(dt){
  const playing=state==='play',dying=state==='dying';
  if(dying)dt*=.35;
  if(playing||dying)worldT+=dt;
  blendTint(1-Math.exp(-dt*.7));
  const wTarget=(MAP.weather!=='none')?1:0;weatherAmt=lerp(weatherAmt,wTarget,1-Math.exp(-dt*.6));
  dayNight(state==='menu'?MENU_T:worldT);
  let speed;
  const d=S.def;
  if(playing){
    S.time+=dt;const diff=clamp(S.time/100,0,1);
    if(keys.n&&!S.boost&&S.nitro>=30){S.boost=true;popup('NITRO!','#22e1ff');tone(200,900,.5,'sawtooth',.12);}
    if(S.boost){S.nitro-=24/d.nitro*dt;if(S.nitro<=0){S.nitro=0;S.boost=false;}}else S.nitro=Math.min(100,S.nitro+2.2*d.nitro*dt);
    const target=(30+diff*38)*d.top*(S.boost?1.42:1);S.speed=lerp(S.speed,target,1-Math.exp(-dt*(S.boost?2.4:.9)));
    S.top=Math.max(S.top,S.speed);
    const steer=(keys.r?1:0)-(keys.l?1:0);S.vx=lerp(S.vx,steer*(11+S.speed*.06)*d.steer,1-Math.exp(-dt*9*d.steer));
    S.px=clamp(S.px+S.vx*dt,-6.05,6.05);if(Math.abs(S.px)>=6.05){S.vx*=.3;if(Math.random()<.5)burst(S.px+Math.sign(S.px)*.9,.5,R(-1.5,1.5),1,0xffc060,4);}
    if(Math.abs(S.vx)>10&&S.speed>40&&Math.random()<.7)burst(S.px+R(-.8,.8),.25,1.6,1,0x9a9a9a,2,.6);
    S.dist+=S.speed*dt;S.score+=S.speed*dt*(S.boost?2:1)*.6;
    if(save.map==='tour'){S.zoneD+=S.speed*dt;if(S.zoneD>=ZONE_LEN){S.zoneD=0;S.zoneI=(S.zoneI+1)%TOUR.length;S.cities++;setMap(TOUR[S.zoneI],false);showZone();S.score+=500;setTimeout(()=>popup('NEW CITY  +500','#ff9933'),900);tone(523,1046,.6,'triangle',.12);}}
    if(S.inv>0)S.inv-=dt;if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
    S.spawnT-=dt;if(S.spawnT<=0){spawnWave(diff);S.spawnT=lerp(2.3,1.05,diff)*(S.boost?.8:1);}

  kerbTop.offset.y=(kerbTop.offset.y+move/2)%1;kerbSide.offset.x=(kerbSide.offset.x+move/2)%1;kerbSideR.offset.x=(kerbSideR.offset.x-move/2)%1;

  /* metro */
  if(MAP.metro&&(playing||state==='menu')){if(!train.visible){trainCool-=dt;if(trainCool<=0){train.visible=true;train.position.z=-420;}}
    else{train.position.z+=(speed-22)*dt;if(train.position.z>40||train.position.z<-460){train.visible=false;trainCool=R(4,9);}}}else if(!MAP.metro)train.visible=false;

  if(!dying){player.rotation.z=-S.vx*.013;player.rotation.y=-S.vx*.02;player.rotation.x=lerp(player.rotation.x,(S.boost&&playing)?.025:0,.1);}

  const boost=S.boost&&playing;flames.forEach(f=>{f.visible=boost;if(boost)f.scale.set(R(.8,1.3),R(.8,1.3),R(.7,1.5));});
  /* traffic */

    if(c.hit){p.x+=c.vx*dt;p.y+=c.vy*dt;c.vy-=22*dt;if(p.y<0){p.y=0;c.vy=Math.abs(c.vy)*.35;}c.g.rotation.y+=c.spin*dt;c.g.rotation.z+=c.spin*.4*dt;p.z+=(speed+4)*dt;}

    else if(!c.passed&&p.z>c.halfL+2.3){c.passed=true;
      if(dx<c.halfW+2.5&&S.inv<=0){S.near++;S.combo++;S.comboT=3;const b=150*S.combo;S.score+=b;S.nitro=Math.min(100,S.nitro+9);popup(S.combo>1?'CLOSE CALL ×'+S.combo+'  +'+b:'CLOSE CALL  +'+b,'#2bff9b');noise(.25,3500,.18);if(Math.random()<.3)horn();}}
  }

  for(const c of coins){if(!c.active)continue;const p=c.m.position;p.z+=(speed-TS)*dt;c.m.rotation.y+=dt*4;p.y=1.1+Math.sin(t*4+p.z*.3)*.12;

  if(snow.visible){for(let i=0;i<SN;i++){const j=i*3;snowPos[j+1]-=(1.4+(i%7)*.25)*dt;snowPos[j]+=Math.sin(t*.8+i)*.4*dt;snowPos[j+2]+=move;
    if(snowPos[j+1]<0||snowPos[j+2]>12){snowPos[j]=camX+R(-45,45);snowPos[j+1]=R(14,30);snowPos[j+2]=R(-100,-20);}}snowGeo.attributes.position.needsUpdate=true;}
  rainMat.opacity=rainOn*.5;rain.visible=rainOn>.02;
  if(rain.visible){const tilt=speed*.02;for(let i=0;i<RN;i++){const j=i*3;rainSeed[j+1]-=26*dt;rainSeed[j+2]+=move;if(rainSeed[j+1]<0||rainSeed[j+2]>12){rainSeed[j]=camX+R(-35,35);rainSeed[j+1]=R(12,25);rainSeed[j+2]=R(-80,-5);}
    const k=i*6;rainPos[k]=rainSeed[j];rainPos[k+1]=rainSeed[j+1];rainPos[k+2]=rainSeed[j+2];rainPos[k+3]=rainSeed[j];rainPos[k+4]=rainSeed[j+1]+.9;rainPos[k+5]=rainSeed[j+2]-tilt;}rainGeo.attributes.position.needsUpdate=true;}
  /* speed lines */
  const lo=clamp((speed-45)/40,0,.35)+(boost?.4:0);lineMat.opacity=lerp(lineMat.opacity,lo,.1);
  if(lineMat.opacity>.01)for(const l of lines){l.position.z+=(speed*2.2)*dt;if(l.position.z>14){l.position.z=-160;l.position.x=camX+R(-17,17);l.position.y=R(.4,9);}}

  const tall=camera.aspect<1;
  if(state==='menu'){menuT+=dt;const a=menuT*.22,k=tall?1.55:1;camera.position.set(px+Math.sin(a)*6.2*k,(1.35+Math.sin(a*.7)*.35)*(tall?1.4:1),Math.cos(a)*7*k);camera.lookAt(px,.75,0);}
  else{camera.position.set(camX+R(-1,1)*(sh+rumble),(tall?4.4:3.4)+R(-1,1)*(sh+rumble),(tall?9.6:7.8)+(boost?.9:0));camera.lookAt(camX*1.08+px*.1,1.1,-14);camera.rotation.z+=-S.vx*.0035;}
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  dir.position.set(px+28,52,18);dir.target.position.set(px,0,-12);
  engineSound(speed,boost,playing);
  if(playing||dying){hudT-=dt;if(hudT<=0){hud();hudT=.08;}}
}
function applyViewOffset(){if(state==='menu'){const port=VW<=VH;if(port)camera.setViewOffset(VW,VH,0,VH*.31,VW,VH);else{const pw=Math.min(450,VW);camera.setViewOffset(VW+pw,VH,0,0,VW,VH);}}else camera.clearViewOffset();}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(state!=='pause')update(dt);
  if(save.hd&&composer)composer.render();else renderer.render(scene,camera);}

/* ================= menu ================= */
function renderMenu(){
  $('maps').innerHTML=MAPLIST.map(id=>{const m=id==='tour'?{name:'INDIA TOUR',sub:'Kashmir → Delhi → Agra → Jaipur → Mumbai → Bengaluru',css:'linear-gradient(90deg,#ff9933,#ffffff 50%,#138808)'}:MAPS[id];
    return '<button class="mc'+(id==='tour'?' tour':'')+(save.map===id?' sel':'')+'" data-m="'+id+'" style="background:'+m.css+'"><b>'+m.name+'</b><span>'+m.sub+'</span></button>';}).join('');
  $('cars').innerHTML=CARS.map(c=>{const own=save.owned.includes(c.id);const hex='#'+c.color.toString(16).padStart(6,'0'),acc='#'+c.accent.toString(16).padStart(6,'0');
    const bar=(l,v)=>'<div class="bar">'+l+'<i><u style="width:'+Math.round(v*100)+'%"></u></i></div>';
    return '<button class="cc'+(menuCar===c.id?' sel':'')+'" data-c="'+c.id+'"><b><span class="dot" style="background:linear-gradient(135deg,'+hex+' 60%,'+acc+' 60%)"></span>'+c.name+'</b>'+
      bar('SPD',(c.top-.85)/.42)+bar('GRIP',(c.steer-.75)/.45)+bar('N2O',(c.nitro-.8)/.5)+
      '<div class="pr'+(own?' own':'')+'">'+(own?(save.car===c.id?'✓ SELECTED':'OWNED'):'● '+c.price)+'</div></button>';}).join('');
  $('wallet').textContent='● '+save.wallet;
  const def=CARS.find(c=>c.id===menuCar),own=save.owned.includes(menuCar),st=$('start');
  if(own){st.textContent='START RACE';st.disabled=false;st.classList.add('pulse');}
  else if(save.wallet>=def.price){st.textContent='BUY '+def.name+'  ● '+def.price;st.disabled=false;st.classList.remove('pulse');}
  else{st.textContent='NEED ● '+def.price+' TO UNLOCK';st.disabled=true;st.classList.remove('pulse');}
  $('hd').textContent='GRAPHICS: '+['FAST','HD','FULL HD'][save.gfx];$('hd').classList.toggle('on',save.gfx>0);
  $('best').textContent=save.best?'BEST  '+save.best.toLocaleString():'';
}
$('maps').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;save.map=b.dataset.m;persist();setMap(save.map==='tour'?TOUR[0]:save.map,true);renderMenu();});
$('cars').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;menuCar=b.dataset.c;if(save.owned.includes(menuCar)){save.car=menuCar;persist();}setPlayer(menuCar);renderMenu();});
$('hd').onclick=()=>{save.gfx=(save.gfx+1)%3;save.hd=save.gfx>0;persist();applyPR();resize();renderMenu();};
function startGame(){
  if(!save.owned.includes(menuCar)){const def=CARS.find(c=>c.id===menuCar);if(save.wallet<def.price)return;save.wallet-=def.price;save.owned.push(def.id);save.car=def.id;persist();renderMenu();popup('UNLOCKED!','#2bff9b');tone(523,1046,.5,'triangle',.12);return;}
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  save.car=menuCar;persist();if(!player||player.userData.def.id!==save.car)setPlayer(save.car);
  const first=save.map==='tour'?TOUR[0]:save.map;if(mapId!==first)setMap(first,true);
  reset();worldT=0;state='play';document.body.classList.add('playing');applyViewOffset();
  spawnWave(0,-120);spawnWave(0,-185);spawnWave(0,-250);S.spawnT=.4;
  ['menu','over','paused'].forEach(i=>$(i).classList.remove('on'));showZone();tone(440,880,.3,'square',.1);
}
function toMenu(){state='menu';document.body.classList.remove('playing');['over','paused'].forEach(i=>$(i).classList.remove('on'));$('menu').classList.add('on');
  traffic.forEach(c=>{c.active=false;c.g.visible=false;});coins.forEach(c=>{c.active=false;c.m.visible=false;});
  if(S){S.px=LANES[1];S.vx=0;S.boost=false;}player.rotation.set(0,0,0);player.visible=true;menuCar=save.car;setMap(save.map==='tour'?TOUR[0]:save.map,true);renderMenu();applyViewOffset();engineSound(0,false,false);}
function togglePause(){if(state==='play'){state='pause';$('paused').classList.add('on');engineSound(0,false,false);}else if(state==='pause'){state='play';$('paused').classList.remove('on');last=performance.now();}}
$('start').onclick=startGame;$('again').onclick=startGame;$('resume').onclick=togglePause;$('pause').onclick=togglePause;$('quit').onclick=toMenu;$('garage').onclick=toMenu;
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.l=true;else if(k==='arrowright'||k==='d')keys.r=true;
  else if(k===' '||k==='arrowup'||k==='w'||k==='shift'){keys.n=true;if(state==='play')e.preventDefault();}
  else if(k==='p'||k==='escape')togglePause();
  else if(k==='enter'&&(state==='menu'||state==='over'))startGame();});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=false;else if(k==='arrowright'||k==='d')keys.r=false;else if(k===' '||k==='arrowup'||k==='w'||k==='shift')keys.n=false;});
function hold(id,key){const b=$(id);const dn=e=>{e.preventDefault();keys[key]=true;b.classList.add('on');},up=e=>{e.preventDefault();keys[key]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);b.addEventListener('contextmenu',e=>e.preventDefault());}
hold('bl','l');hold('br','r');hold('bn','n');
const touches={};
$('c').addEventListener('pointerdown',e=>{if(state!=='play')return;touches[e.pointerId]=e.clientX<window.innerWidth/2?'l':'r';sync();});
const rel=e=>{delete touches[e.pointerId];sync();};$('c').addEventListener('pointerup',rel);$('c').addEventListener('pointercancel',rel);
function sync(){const v=Object.values(touches);keys.l=v.includes('l');keys.r=v.includes('r');}

/* ================= boot ================= */
if(!save.owned.includes(save.car))save.car='vortex';menuCar=save.car;
S={px:LANES[1],vx:0,speed:0,boost:false,inv:0,shake:0,def:carDef()};
setPlayer(save.car);
setMap(save.map==='tour'?TOUR[0]:(MAPS[save.map]?save.map:'kashmir'),true);
resize();renderMenu();
window.TH_DEBUG={setMenuT:v=>{menuT=v;},setMap,startGame,getS:()=>S,toMenu,getBloom:()=>bloom,setT:v=>{worldT=v;}};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
