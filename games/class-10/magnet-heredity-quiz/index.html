    [["",q[2]],["y","Your answer: "+q[3][k]],["a","Correct answer: "+q[3][q[4]]],["e",q[5]]].forEach(([c,t])=>{const e=document.createElement("p");if(c)e.className=c;e.textContent=t;d.append(e);});r.append(d);});}
$("again").onclick=()=>{$("done").hidden=true;$("start").hidden=false;};
</script>
