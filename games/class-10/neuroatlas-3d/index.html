<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: an anatomy-museum gallery. The lit 3D specimen fills the stage; a brass-edged plaque beside (desktop) or below (phone) carries all reading and play. */
:root{
  color-scheme:dark;
  --ink:#0b0d12; --slate:#151922; --slate2:#1c212c; --line:#2c3340;
  --bone:#ece4d6; --dim:#9da3ae; --brass:#d9a441; --nerve:#58d6e8; --ok:#6fd08c; --bad:#f0736a;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font:15px/1.5 var(--body);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--nerve);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr)}
#top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--slate);border-bottom:1px solid var(--line)}
#top .brand{font-family:var(--display);font-size:17px;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand small{color:var(--brass);font:600 10px var(--body);letter-spacing:.16em;text-transform:uppercase;display:block}
#top .sp{flex:1}
.pill{font:600 12px var(--mono);color:var(--brass);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap}
.ib{background:var(--slate2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.ib:hover{border-color:var(--brass)}
.ib.on{border-color:var(--brass);color:var(--brass)}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 38%,#2b3140 0%,#141821 48%,#07080b 100%);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tools{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#tools .ib{pointer-events:auto;background:rgba(21,25,34,.86)}
#hint{position:absolute;top:10px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.06em;pointer-events:none}
#tag{position:absolute;pointer-events:none;transform:translate(-50%,-140%);background:rgba(11,13,18,.9);border:1px solid var(--brass);color:var(--bone);font:600 12px var(--body);padding:3px 9px;border-radius:4px;white-space:nowrap}
#panel{background:var(--slate);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px;min-height:0}
#panel h2{font:400 26px/1.15 var(--display);margin:2px 0 4px;text-wrap:balance}
#panel h3{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin:0}
#panel p{margin:8px 0}
.facts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{padding-left:14px;border-left:2px solid var(--line)}
.src{font:11px var(--mono);color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.chip{background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:13px}
.chip:hover,.chip.on{border-color:var(--brass);color:var(--brass)}
.chip:disabled{opacity:.35;cursor:default}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s}
.q{white-space:pre-line;font:400 20px/1.3 var(--display);margin:6px 0 12px;text-wrap:balance}
.opt{display:block;width:100%;text-align:left;background:var(--slate2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.r{border-color:var(--ok);color:var(--ok)}
.opt.w{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--slate2);border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--bad)}
.go{background:var(--brass);color:#1a1405;border:0;border-radius:6px;padding:10px 16px;font-weight:700;margin-top:12px}
.go:hover{filter:brightness(1.1)}
.go.alt{background:transparent;color:var(--bone);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stars{font-size:34px;letter-spacing:6px;color:var(--brass)}
.stars b{color:var(--line);font-weight:400}
.badge{font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--nerve);color:var(--nerve);border-radius:3px;padding:2px 6px}
#home{position:absolute;inset:0;z-index:5;overflow-y:auto;background:linear-gradient(180deg,rgba(11,13,18,.72),rgba(11,13,18,.95) 60%);padding-block:28px 40px;padding-inline:16px}
#home .in{max-width:900px;margin:0 auto}
#home h1{font:400 clamp(34px,7vw,60px)/1 var(--display);margin:6px 0 10px;text-wrap:balance}
#home h1 em{color:var(--brass);font-style:italic}
#home .lead{color:var(--dim);max-width:60ch;margin:0 0 22px}
.eyebrow{font:600 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{text-align:left;background:rgba(21,25,34,.9);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px}
.card:hover{border-color:var(--brass)}
.card b{font:400 20px var(--display)}
.card span{color:var(--dim);font-size:13px}
.card .st{color:var(--brass);font-size:14px;letter-spacing:3px}
.card .st i{color:var(--line);font-style:normal}
.grp{margin:22px 0 8px;font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,46%)}
  #app.menu{grid-template-rows:auto minmax(0,1fr)}
  #app.menu #panel{display:none}
  #app.big{grid-template-rows:auto minmax(0,26%) minmax(0,1fr)}
  #panel{border-left:0;border-top:1px solid var(--line);padding:14px 16px 24px}
  #panel h2{font-size:22px}
  #top .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  cord:{n:'Spinal cord',r:'Central nervous system',f:['Nerves from all over the body meet in a bundle in the spinal cord on their way to the brain.','Reflex arcs are formed in the spinal cord itself, although the information also goes on to reach the brain.','The brain and spinal cord together make the central nervous system.','The vertebral column, or backbone, protects the spinal cord.']},
  cranium:{n:'Cranium (skull)',r:'Protection',f:['The brain sits inside a bony box.','Inside the box, the brain is contained in a fluid-filled balloon which provides further shock absorption.']},
  brain:{n:'Brain',r:'Central nervous system',f:['The brain is the main coordinating centre of the body.','It has three major regions: fore-brain, mid-brain and hind-brain.','It receives information from all parts of the body, integrates it and sends messages to muscles.','Thinking involves complicated interaction of many nerve impulses from many neurons.']},

  pineal:{n:'Pineal gland',r:'Endocrine gland',f:['It is one of the endocrine glands labelled in Fig. 6.7.','The chapter does not describe its hormone. Activity 6.3 asks you to consult books and your teacher to find out about the other glands.']},
  thyroid:{n:'Thyroid gland',r:'Endocrine gland',f:['It secretes thyroxin.','Thyroxin regulates carbohydrate, protein and fat metabolism so as to provide the best balance for growth.','Iodine is essential for making thyroxin. If iodine is deficient in the diet, we may suffer from goitre. A swollen neck is one symptom.','This is why iodised salt is advised.']},

 {q:'Where are gustatory receptors found?',a:['tongue'],w:'Gustatory receptors on the tongue detect taste.'}

  gl.uniform3fv(U.uCam,eye);gl.uniform1f(U.uAsp,CW/CH);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.uniformMatrix4fv(U.uVP,false,ID4);drawNode(bg);
  gl.uniformMatrix4fv(U.uVP,false,VP);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);drawNode(floor);
  gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  for(const n of nodes)if(n.geo&&n.layer===0&&shown(n))drawNode(n);
  gl.enable(gl.BLEND);gl.disable(gl.DEPTH_TEST);
  for(const n of nodes)if(n.geo&&n.layer===1&&shown(n))drawNode(n);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(false);
  for(const n of nodes)if(n.geo&&n.layer===2&&shown(n))drawNode(n);
  gl.depthMask(true);
  if(sel&&!tagEl.hidden){const ms=meshesOf(sel);if(ms.length){const W=ms[0].W;let x=W[12],y=W[13],z=W[14];if(sel==='cerebrum'&&which==='brain'){x=0;y=.72;z=0}
    const w=VP[3]*x+VP[7]*y+VP[11]*z+VP[15],sx=(VP[0]*x+VP[4]*y+VP[8]*z+VP[12])/w,sy=(VP[1]*x+VP[5]*y+VP[9]*z+VP[13])/w;tagEl.style.left=((sx+1)/2*stage.clientWidth)+'px';tagEl.style.top=Math.max(34,(1-sy)/2*stage.clientHeight)+'px'}}}

// ---------- UI state ----------
let mode='home',M=null;
const LEVELS=[
 {id:'brainX',g:'Explore',t:'Brain Atlas',d:'Turn a life-like 3D brain. Open it to see inside. Tap any part to read what it does.',free:true},
 {id:'bodyX',g:'Explore',t:'Body Atlas',d:'A glass anatomy statue with the brain, spinal cord, nerves and every endocrine gland of Fig. 6.7.',free:true},
 {id:'brainM',g:'Missions',t:'Brain Mission',d:'10 tasks. Read the clue and tap the correct part on the real model.'},
 {id:'bodyM',g:'Missions',t:'Gland Hunt',d:'10 tasks. Find the gland or organ on the statue.'},
 {id:'reflex',g:'Missions',t:'Reflex Arc Lab',d:'Touch the flame, watch the impulse travel, then rebuild the arc in order.'},
 {id:'qN',g:'Question Vault',t:'Nervous System',d:'20 questions: in-text, exercise, activity and concept checks.'},
 {id:'qP',g:'Question Vault',t:'Coordination in Plants',d:'20 questions on tropisms and plant hormones.'},
 {id:'qH',g:'Question Vault',t:'Hormones in Animals',d:'20 questions with Table 6.1.'},
 {id:'qT',g:'Question Vault',t:'True or False Sprint',d:'20 quick statements from the whole chapter. Decide: true or false?'},
 {id:'qR',g:'Question Vault',t:'Assertion and Reason',d:'10 board-style assertion and reason questions.'},
 {id:'boss',g:'Final',t:'Grand Viva',d:'15 mixed questions from the whole chapter. You have 3 lives.'}
];
function starStr(n){return '★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>'}
function showHome(){
  mode='home';M=null;select(null);hintId=null;stopReflex();app.classList.remove('big');app.classList.add('menu');
  setScene('brain');view('brain',.7,1.3);brain.left.visible=true;brain.skull.visible=false;tools.innerHTML='';$('#hint').hidden=true;
  let h='<div class="in"><div class="eyebrow">Saurabh\'s Eduverse · Class 10 Science · Chapter 6</div><h1>NeuroAtlas <em>3D</em></h1><p class="lead">Control and Coordination on real-looking 3D models. Study the human brain and the body\'s nerves and glands, then test yourself. Every level is open from the start.</p>';
  let g='';LEVELS.forEach(l=>{if(l.g!==g){if(g)h+='</div>';g=l.g;h+='<div class="grp">'+g+'</div><div class="grid">'}
    h+='<button class="card" data-l="'+l.id+'"><b>'+l.t+'</b><span>'+l.d+'</span>'+(l.free?'':'<span class="st">'+starStr(save.stars[l.id]||0)+'</span>')+'</button>'});
  h+='</div></div>';home.innerHTML=h;home.hidden=false;home.scrollTop=0;
  panel.innerHTML='<h3>How to play</h3><h2>Choose a gallery</h2><ul class="facts"><li>Drag the model to turn it. Pinch or scroll to zoom.</li><li>In the atlases, tap a part or pick it from the list to read its plaque.</li><li>In missions, read the clue and tap the part on the model.</li><li>All content follows the NCERT chapter: in-text questions, exercises and activities are tagged.</li></ul>';
  updTop();
}
home.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b){sfx.tap();start(b.dataset.l)}});
$('#hm').onclick=()=>{sfx.tap();showHome()};
$('#snd').onclick=()=>{save.snd=!save.snd;persist();updTop();sfx.tap()};

function setScene(w){which=w;brain.G.visible=w==='brain';body.G.visible=w==='body';floor.pos[1]=w==='brain'?-1.75:-1.47;floor.scale=S3(w==='brain'?1.6:1.1)}
function toolBar(defs){tools.innerHTML='';defs.forEach(d=>{const b=document.createElement('button');b.className='ib'+(d.on&&d.on()?' on':'');b.textContent=d.t;b.onclick=()=>{sfx.tap();d.f();toolBar(defs)};tools.appendChild(b)})}
function brainTools(){toolBar([
  {t:'Open brain',on:()=>!brain.left.visible,f(){brain.left.visible=!brain.left.visible;if(!brain.left.visible){goal.th=-1.25;goal.ph=1.45}}},
  {t:'Skull',on:()=>brain.skull.visible,f(){brain.skull.visible=!brain.skull.visible;if(brain.skull.visible&&mode==='brainX')plaque('cranium')}},
  {t:'Auto-turn',on:()=>spin,f(){spin=!spin}},
  {t:'Reset view',f(){brain.left.visible=true;brain.skull.visible=false;view('brain',.7,1.3)}}])}
let marble=false;
function setSkin(m){marble=m;body.skin.forEach(s=>{s.mat=m?marbleMat:glassMat;s.layer=m?0:2})}
function bodyTools(){toolBar([
  {t:'Nervous system',on:()=>body.nerv.visible,f(){body.nerv.visible=!body.nerv.visible}},
  {t:'Glands',on:()=>body.gl.visible,f(){body.gl.visible=!body.gl.visible}},
  {t:marble?'Surface: marble':'Surface: glass',on:()=>marble,f(){setSkin(!marble)}},
  {t:'Auto-turn',on:()=>spin,f(){spin=!spin}},
  {t:'Reset view',f(){view('body',.5,1.45)}}])}

function start(id){
  app.classList.remove('menu');home.hidden=true;$('#hint').hidden=false;select(null);hintId=null;stopReflex();mode=id;app.classList.toggle('big',/^q|boss/.test(id));
  body.nerv.visible=body.gl.visible=true;setSkin(false);body.hot.visible=false;body.fore.rot[0]=-1.2;
  if(id==='brainX'||id==='brainM'){setScene('brain');view('brain',.7,1.3);brain.left.visible=true;brain.skull.visible=false;brainTools()}
  else if(id==='bodyX'||id==='bodyM'){setScene('body');view('body',.5,1.45);bodyTools()}
  else if(id==='reflex'){setScene('body');view('body',-.95,1.4);goal.r*=.8;body.hot.visible=true;body.gl.visible=false;tools.innerHTML=''}
  else{setScene('brain');view('brain',.7,1.3);brain.left.visible=true;tools.innerHTML='';$('#hint').hidden=true}
  if(id==='brainX')plaque('cerebrum');else if(id==='bodyX')plaque('brain');
  else if(id==='brainM')startMission(BRAIN_TASKS);else if(id==='bodyM')startMission(BODY_TASKS);
  else if(id==='reflex')reflexIntro();else startQuiz(id);
  panel.scrollTop=0;
}

// ---------- atlas ----------
function chipList(order,cur){return '<div class="chips">'+order.map(k=>'<button class="chip'+(k===cur?' on':'')+'" data-p="'+k+'">'+esc(INFO[k].n)+'</button>').join('')+'</div>'}
function plaque(id){
  const I=INFO[id];if(!I)return;
  if(id!=='cranium'){select(id);tagEl.textContent=I.n;tagEl.hidden=false}else select(null);
  if(which==='brain'&&INSIDE.includes(id)&&brain.left.visible){brain.left.visible=false;goal.th=-1.25;goal.ph=1.45;brainTools()}
  panel.innerHTML='<h3>'+esc(I.r)+'</h3><h2>'+esc(I.n)+'</h2><ul class="facts">'+I.f.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul><p class="src">Source: NCERT Science Class 10, Chapter 6</p>'+chipList(which==='brain'?BRAIN_ORDER:BODY_ORDER,id);
  panel.scrollTop=0;
}
panel.addEventListener('click',e=>{const c=e.target.closest('[data-p]');if(c&&(mode==='brainX'||mode==='bodyX')){sfx.tap();plaque(c.dataset.p)}});
function onPick(id){
  if(mode==='brainX'||mode==='bodyX'){sfx.tap();plaque(id)}
  else if((mode==='brainM'||mode==='bodyM')&&M&&!M.done)answerMission(id);
}

// ---------- missions ----------
function startMission(bank){M={tasks:shuffle(bank).slice(0,10),i:0,score:0,tries:0,done:false};showTask()}
function showTask(msg,cls){
  const t=M.tasks[M.i];
  panel.innerHTML='<h3>Task '+(M.i+1)+' of '+M.tasks.length+' · Score '+M.score+'</h3><div class="bar"><i style="width:'+(M.i/M.tasks.length*100)+'%"></i></div><p class="q">'+esc(t.q)+'</p><p class="src">Tap the part on the 3D model.</p>'+(msg?'<div class="fb '+cls+'">'+msg+'</div>':'')+(M.done?'<button class="go" id="nx">'+(M.i+1<M.tasks.length?'Next task':'See result')+'</button>':'');
  const n=$('#nx');if(n)n.onclick=()=>{sfx.tap();select(null);hintId=null;M.i++;M.tries=0;M.done=false;if(M.i>=M.tasks.length)finish(M.score,M.tasks.length*10);else showTask()};
}
function answerMission(id){
  const t=M.tasks[M.i];
  if(t.a.includes(id)){const pts=M.tries===0?10:M.tries===1?5:2;M.score+=pts;M.done=true;if(hintId){glow(hintId,null);hintId=null}select(id);tagEl.textContent=INFO[id].n;tagEl.hidden=false;sfx.ok();showTask('<b>Correct, +'+pts+'.</b> '+esc(t.w),'ok')}
  else{M.tries++;sfx.no();let m='That is the <b>'+esc(INFO[id].n)+'</b>. Try again.';
    if(M.tries>=2){hintId=t.a[0];if(which==='brain'&&INSIDE.concat('pituitary').includes(hintId)&&brain.left.visible){brain.left.visible=false;goal.th=-1.25;goal.ph=1.45;brainTools()}m+=' The correct part is now glowing blue.'}
    else if(which==='brain'&&INSIDE.includes(t.a[0]))m+=' Tip: use Open brain to look inside.';
    showTask(m,'no')}
}
function finish(score,max,extra){
  const pct=score/max,st=pct>=.85?3:pct>=.6?2:pct>0?1:0;
  if(st>(save.stars[mode]||0)){save.stars[mode]=st;persist()}updTop();if(st>=2)sfx.win();
  select(null);hintId=null;
  panel.innerHTML='<h3>Result</h3><h2>'+(st===3?'Excellent work':st===2?'Good work':'Keep practising')+'</h2><div class="stars">'+'★'.repeat(st)+'<b>'+'★'.repeat(3-st)+'</b></div><p>You scored <b>'+score+'</b> out of '+max+'.'+(extra?' '+extra:'')+'</p><div class="row"><button class="go" id="re">Play again</button><button class="go alt" id="bk">Menu</button></div>';
  const m=mode;$('#re').onclick=()=>{sfx.tap();start(m)};$('#bk').onclick=()=>{sfx.tap();showHome()};
}

// ---------- reflex lab ----------
function reflexIntro(){
  panel.innerHTML='<h3>Reflex Arc Lab · Fig. 6.2</h3><h2>Touching a flame</h2><p>If we waited to think before pulling the hand away, we would get burnt. The body uses a shortcut called a reflex arc.</p><ul class="facts"><li>The statue\'s hand is just above a flame.</li><li>Press the button and watch the impulse. Blue is the sensory signal. Orange is the motor command.</li></ul><button class="go" id="fire">Touch the flame</button><div id="cap" class="fb" hidden></div>';
  $('#fire').onclick=()=>{if(reflex)return;sfx.tap();reflex={t0:performance.now(),stage:-1};$('#fire').disabled=true};
}
const CAPS=['1. Receptors in the skin detect the heat.','2. A sensory neuron carries the impulse to the spinal cord.','3. A relay neuron in the spinal cord passes it on. No thinking is needed.','4. A motor neuron carries the command to the arm.','5. The effector muscle shortens and the hand is pulled away. The message also reaches the brain a moment later.'];
function cap(i){const c=$('#cap');if(c){c.hidden=false;c.textContent=CAPS[i]}}
function stepReflex(now){
  const t=(now-reflex.t0)/1000,p=body.pulse,st=n=>{if(reflex.stage<n){reflex.stage=n;cap(n);sfx.zap()}};
  p.visible=true;
  if(t<.6){st(0);p.mat.color=hexc(0x58d6e8);p.pos=(body.paths.s.getPoint(0));p.scale=S16(1+Math.sin(t*20)*.5)}
  else if(t<2.1){st(1);p.scale=S16(1);p.pos=(body.paths.s.getPoint((t-.6)/1.5))}
  else if(t<2.9){st(2);p.mat.color=hexc(0xffffff);p.pos=(body.paths.s.getPoint(1));p.scale=S16(1.3+Math.sin(t*25)*.5)}
  else if(t<4.1){st(3);p.mat.color=hexc(0xff9f40);p.scale=S16(1);p.pos=(body.paths.m.getPoint((t-2.9)/1.2))}
  else if(t<6.4){st(4);const k=sstep(0,1,(t-4.1)/.5);body.fore.rot[0]=-1.2-1.0*k;glow('muscle',0xffffff,1.5*k);
    p.mat.color=hexc(0xc79bff);p.pos=(body.paths.b.getPoint(Math.min(1,(t-4.1)/1.4)))}
  else{p.visible=false;glow('muscle',null);body.fore.rot[0]=-1.2;reflex=null;orderGame()}
}
function stopReflex(){reflex=null;body.pulse.visible=false}
function orderGame(){
  const O={next:0,wrong:0,opts:shuffle(REFLEX_STEPS.map((s,i)=>({s,i})))};
  const draw=(msg,cls)=>{panel.innerHTML='<h3>Rebuild the reflex arc</h3><h2>Tap the steps in order</h2><div class="bar"><i style="width:'+(O.next/5*100)+'%"></i></div>'+O.opts.map(o=>'<button class="opt'+(o.i<O.next?' r':'')+'" data-o="'+o.i+'"'+(o.i<O.next?' disabled':'')+'>'+(o.i<O.next?(o.i+1)+'. ':'')+esc(o.s)+'</button>').join('')+(msg?'<div class="fb '+cls+'">'+msg+'</div>':'');
    panel.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const i=+b.dataset.o;if(i===O.next){O.next++;sfx.ok();if(O.next===5){finish(Math.max(10,50-O.wrong*10),50,'Receptor → sensory neuron → relay neuron in spinal cord → motor neuron → effector.')}else draw('Correct. What comes next?','ok')}else{O.wrong++;sfx.no();draw('Not yet. Think of the path the impulse took on the statue.','no')}})};
  draw();
}

// ---------- quiz ----------
function startQuiz(id){
  let qs;if(id==='boss'){qs=shuffle(QB.N.concat(QB.P,QB.H)).slice(0,15)}else if(id==='qT')qs=shuffle(TF).map(x=>{const a=['T',x[0],x[1]?'True':'False',0,0,0,x[2]];a.o=['True','False'];return a});
  else if(id==='qR')qs=shuffle(AR).map(x=>{const a=['R','Assertion (A): '+x[0]+'\nReason (R): '+x[1],AR_OPTS[x[2]],0,0,0,x[3]];a.o=AR_OPTS;return a});
  else qs=shuffle(QB[id[1]]);
  M={qs,i:0,score:0,lives:id==='boss'?3:null};showQ();
}
function showQ(){
  const q=M.qs[M.i],opts=q.o||shuffle(q.slice(2,6));
  panel.innerHTML='<div class="row"><span class="badge">'+TAGS[q[0]]+'</span><span class="src">Question '+(M.i+1)+' of '+M.qs.length+' · Score '+M.score+(M.lives!=null?' · Lives '+'♥'.repeat(M.lives):'')+'</span></div><div class="bar"><i style="width:'+(M.i/M.qs.length*100)+'%"></i></div><p class="q">'+esc(q[1])+'</p>'+opts.map(o=>'<button class="opt">'+esc(o)+'</button>').join('')+'<div id="fbq"></div>';
  panel.scrollTop=0;
  const bs=[...panel.querySelectorAll('.opt')];
  bs.forEach((b,k)=>b.onclick=()=>{const ok=opts[k]===q[2];bs.forEach((x,j)=>{x.disabled=true;if(opts[j]===q[2])x.classList.add('r')});
    if(ok){M.score++;sfx.ok()}else{b.classList.add('w');sfx.no();if(M.lives!=null)M.lives--}
    const out=M.lives===0,last=M.i+1>=M.qs.length;
    $('#fbq').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+esc(q[6])+'</div><button class="go" id="nq">'+(out||last?'See result':'Next question')+'</button>';
    $('#nq').onclick=()=>{sfx.tap();M.i++;if(out||last)finish(M.score,M.qs.length,out?'You ran out of lives.':'');else showQ()};$('#nq').scrollIntoView({block:'nearest'})});
}

window.__na={start,showHome,pick:onPick,state:()=>({mode,M,sel,which,fr:FR}),body,brain};
showHome();requestAnimationFrame(frame);
})();
