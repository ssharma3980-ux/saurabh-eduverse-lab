<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Volt City 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Bungee&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: full-bleed 3D city/lab canvas; control panel docks right on wide screens and becomes a bottom sheet on phones. Single deliberate night-city look. */
:root{
  --night:#070b1f; --ink:#0e1530; --panel:#10183a; --panel2:#17214a; --line:rgba(150,170,255,.17);
  --text:#eef2ff; --muted:#a3aed6; --copper:#e8924a; --volt:#ffd23f; --electron:#4fd8ff; --good:#3ee0a1; --bad:#ff5f6d; --warn:#ffb020;
  --display:'Bungee','Arial Black',Impact,sans-serif; --body:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --c:var(--electron);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
sup{font-size:.7em;line-height:0}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#0b1230,#0a1029);border-bottom:1px solid var(--line);position:relative;z-index:5}
#home{display:flex;align-items:center;gap:10px;min-width:0}
#home svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px rgba(255,210,63,.6))}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--volt);white-space:nowrap}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-top:3px}
.prog{flex:1;max-width:280px;margin-left:auto;display:flex;flex-direction:column;gap:3px}
.prog div{height:8px;border-radius:9px;background:#1a2350;overflow:hidden;border:1px solid var(--line)}
#prog{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--electron),var(--volt));box-shadow:0 0 12px var(--volt);transition:width .8s}
#progtxt{font-size:11px;color:var(--muted);text-align:right}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#18214a;border:1px solid var(--line);font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill i{font-style:normal}
#coinbox i{color:var(--volt)} #starbox i{color:#ffd23f}
#coinbox.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#18214a;border:1px solid var(--line);transition:transform .15s,background .2s}
.ib:hover{background:#22306a;transform:translateY(-1px)} .ib svg{width:20px;height:20px}

/* stage */
#stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
#stage.lab{grid-template-columns:minmax(0,1fr) 400px}
#view{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font-size:13px;pointer-events:none}
.lbl.clickable{pointer-events:auto;cursor:pointer}
.lbl.tag{padding:3px 9px;border-radius:9px;background:rgba(10,16,42,.82);border:1px solid var(--line);color:#dfe6ff;font-weight:600;backdrop-filter:blur(4px)}
.lbl.tag.hot{border-color:rgba(255,210,63,.55);color:#ffe9a0}
.lbl.tag.soft{background:rgba(10,16,42,.55);color:var(--muted)}
.lbl.tag.bl{display:flex;flex-direction:column;align-items:center;line-height:1.15;text-align:center}
.lbl.tag.bl small{font-family:var(--mono);font-size:11px;color:var(--electron)}
.lbl.tag.bl.dead{border-color:rgba(255,95,109,.6);color:#ffb3ba}
.lbl.tag.app i{font-style:normal;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px}
.lbl.tag.app i.on{background:var(--good);color:#04241a} .lbl.tag.app i.off{background:#2a3256;color:var(--muted)}
.lbl.tick{font-family:var(--mono);font-size:11px;color:#2a2010;font-weight:700}
.lbl.tick.shelf{color:#dfe6ff;background:rgba(10,16,42,.75);padding:2px 7px;border-radius:7px;border:1px solid var(--line)}
.lbl.tick.shelf.alloy{color:#ffd1ad} .lbl.tick.shelf.ins{color:#bfe6ff}
.lbl.tick.shelf.on{background:var(--copper);color:#1a0f05;border-color:var(--copper)}
.lbl.pole{font-family:var(--display);font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1b2350;border:2px solid #9fb3e8}
.lbl.pole.plus{background:#c8303d;border-color:#ff8a94} .lbl.pole.minus{background:#1d2a5a;border-color:#6f8bdc}
.lbl.sign{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:12px;background:rgba(8,13,36,.86);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s}
.lbl.sign:hover{filter:brightness(1.25);border-color:var(--volt)}
.lbl.sign b{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:7px;background:var(--c);color:#071022}
.lbl.sign .nm{font-weight:700;font-size:13px}
.lbl.sign .st{color:var(--volt);letter-spacing:1px} .lbl.sign .st i{font-style:normal;color:#3b4470}
.lbl.sign .go{font-family:var(--display);font-size:11px;color:#071022;background:var(--volt);padding:2px 7px;border-radius:7px;animation:blink 1.4s infinite}
.lbl.sign .lk{font-size:12px;color:var(--muted)}
.lbl.sign.locked{opacity:.72}
.lbl.sign.boss b{background:#ff4fd8}
@keyframes blink{50%{filter:brightness(1.35);box-shadow:0 0 14px var(--volt)}}
#hubhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:rgba(8,13,36,.8);border:1px solid var(--line);font-size:13px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#view.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}

/* district card */
#dcard{position:absolute;left:16px;bottom:16px;width:min(340px,calc(100% - 32px));padding:16px;border-radius:18px;background:linear-gradient(160deg,rgba(23,33,74,.96),rgba(12,18,44,.96));border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .35s ease-out;z-index:3}
#dcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:18px 18px 0 0;background:var(--c);box-shadow:0 0 18px var(--c)}
.dc-top{display:flex;justify-content:space-between;align-items:center}
.x{width:32px;height:32px;border-radius:10px;background:#1c2652;font-size:14px}
#dcard h2{font-family:var(--display);font-size:22px;margin-top:8px;color:#fff}
.dc-sub{margin:2px 0 8px;color:var(--muted)}
.dc-stars{font-size:26px;letter-spacing:3px;color:#2c3566;margin-bottom:10px} .dc-stars .on{color:var(--volt);text-shadow:0 0 12px rgba(255,210,63,.7)}
.dc-lock{margin:0;padding:10px 12px;border-radius:12px;background:#151d44;color:var(--muted);font-size:14px}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);letter-spacing:.04em}

/* panel */
#panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:linear-gradient(180deg,var(--panel),#0c1330);border-left:1px solid var(--line);position:relative;z-index:2}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0e1636}
.back{padding:7px 10px;border-radius:10px;background:#1a2453;font-weight:700;font-size:14px;white-space:nowrap}
.back:hover{background:#243170}
.pt{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.pt b{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.collapse{display:none;width:36px;height:30px;border-radius:9px;background:#1a2453;position:relative}
.collapse span{position:absolute;left:50%;top:50%;width:12px;height:12px;border-right:3px solid #cfd8ff;border-bottom:3px solid #cfd8ff;transform:translate(-50%,-70%) rotate(45deg);transition:transform .2s}
#panel.min .collapse span{transform:translate(-50%,-30%) rotate(-135deg)}
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border-radius:11px 11px 0 0;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:#fff;background:#18224d;border-bottom-color:var(--c)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 28px;min-height:0}
.pane{display:flex;flex-direction:column;gap:12px}
.ph3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{margin:0;color:#d6defa;line-height:1.45}
.muted{color:var(--muted);font-size:14px;margin:0}
.sub{font-family:var(--display);font-size:15px;color:var(--c);margin-top:6px}
.lab-ctl{display:flex;flex-direction:column;gap:12px}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;counter-reset:m}
.missions li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:#141d45;border:1px solid var(--line);font-size:14.5px;line-height:1.35}
.mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #4a5590;margin-top:1px;display:grid;place-items:center}
.missions li.done{background:rgba(62,224,161,.1);border-color:rgba(62,224,161,.4)}
.missions li.done .mk{background:var(--good);border-color:var(--good)}
.missions li.done .mk::after{content:"";width:6px;height:11px;border:solid #04241a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.missions li.flash{animation:flash 1s}
@keyframes flash{30%{box-shadow:0 0 0 4px rgba(62,224,161,.45);transform:scale(1.02)}}
.mcount{margin:0;font-size:13px;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label,.ctl-l{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;color:#cdd6f6}
.ctl output{font-family:var(--mono);color:var(--c);font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--c);height:28px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.segb{flex:1 1 auto;min-width:0;padding:8px 10px;border-radius:10px;background:#16204a;border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:background .15s,transform .1s}
.segb:hover{background:#1f2b62}.segb:active{transform:scale(.97)}
.segb.on{background:var(--c);color:#06102a;border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;background:#1a2453;border:1px solid var(--line);transition:transform .12s,background .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);background:#243170}.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffe066,#ffc21a);color:#1b1300;border-color:#ffd23f;box-shadow:0 6px 18px rgba(255,194,26,.25)}
.btn.primary:hover{box-shadow:0 8px 24px rgba(255,194,26,.4)}
.btn.primary.on{background:linear-gradient(180deg,#5ff0bb,#2fcf93);border-color:#3ee0a1;color:#04241a}
.btn.accent{background:var(--c);color:#06102a;border-color:var(--c)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);color:#2a0005}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rd{padding:9px 10px;border-radius:12px;background:#0b1330;border:1px solid var(--line);min-width:0}
.rl{font-size:12px;color:var(--muted);line-height:1.2}
.rv{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--rc,#e8eeff);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rd.big .rv{font-size:19px;text-shadow:0 0 14px color-mix(in srgb,var(--rc,#fff) 40%,transparent)}
.rv small{font-size:11px;color:var(--muted)}
.note{padding:10px 12px;border-radius:12px;background:rgba(255,210,63,.07);border:1px dashed rgba(255,210,63,.35);font-size:14px;line-height:1.5;color:#efe6c8}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600}.tbl td{font-family:var(--mono)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.appb{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#16204a;border:1px solid var(--line);text-align:left}
.appb b{font-size:13.5px}.appb small{font-family:var(--mono);color:var(--muted)}
.appb.on{background:rgba(255,210,63,.16);border-color:var(--volt)}.appb.on small{color:var(--volt)}
.symcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:16px;background:#f7f4ff;color:#1b1d2e;text-align:center}
.sym-q{font-family:var(--display);font-size:16px;color:#4a2f8a}
.sym-img{width:100%;max-width:260px;color:#1b1d2e}.sym-img svg{width:100%;height:auto}
.sym-hint{font-size:14px;color:#5a5478}
.symprog{position:relative;height:22px;border-radius:99px;background:#16204a;overflow:hidden;border:1px solid var(--line)}
.symprog span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c78bff,#4fd8ff);transition:width .4s}
.symprog b{position:relative;display:block;text-align:center;font-family:var(--mono);font-size:12px;line-height:20px}
.symprog:empty{display:none}

/* quiz */
.qintro{display:flex;flex-direction:column;gap:12px}
.rules{margin:0;padding-left:20px;color:#d6defa;line-height:1.6}
.best{margin:0;font-size:20px;color:var(--volt);letter-spacing:2px}
.qcard{display:flex;flex-direction:column;gap:11px;animation:rise .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtag{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(199,139,255,.18);color:#dcbcff;border:1px solid rgba(199,139,255,.4)}
.qnum{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.qbar{height:6px;border-radius:9px;background:#16204a;overflow:hidden}.qbar span{display:block;height:100%;background:var(--c);transition:width .4s}
.qtext{font-size:17px;font-weight:600;line-height:1.45}
.qimg{background:#f7f4ff;color:#1b1d2e;border-radius:14px;padding:10px;display:grid;place-items:center}.qimg svg{width:100%;max-width:240px;height:auto}
.qopts{display:flex;flex-direction:column;gap:7px}.qopts.two{flex-direction:row}.qopts.two .qopt{flex:1;justify-content:center}
.qopt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:#16204a;border:1.5px solid var(--line);text-align:left;font-size:15px;font-weight:600;line-height:1.3;transition:background .15s,transform .1s,border-color .15s}
.qopt i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;background:#0d1535;color:var(--muted)}
.qopt:hover:not(:disabled){background:#1f2b62;transform:translateX(2px)}
.qopt.ok{background:rgba(62,224,161,.18);border-color:var(--good)}.qopt.ok i{background:var(--good);color:#04241a}
.qopt.bad{background:rgba(255,95,109,.15);border-color:var(--bad);animation:no .35s}.qopt.bad i{background:var(--bad);color:#2a0005}
.qopt:disabled{cursor:default}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qnum-row{display:flex;gap:8px;align-items:center}
.qnum-row input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#0b1330;color:#fff;font-family:var(--mono);font-size:17px}
.qnum-row input.ok{border-color:var(--good)}.qnum-row input.bad{border-color:var(--bad)}
.qunit{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.qfb{font-size:14.5px;line-height:1.5;border-radius:12px}.qfb:empty{display:none}
.qfb.good{padding:10px 12px;background:rgba(62,224,161,.12);border:1px solid rgba(62,224,161,.4)}.qfb.good b{color:var(--good)}
.qfb.hint{padding:10px 12px;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.4)}.qfb.hint b{color:var(--warn)}
.qfb.bad{padding:10px 12px;background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.4)}.qfb.bad b{color:#ff9aa3}
.qfb.warn{padding:8px 12px;color:var(--warn)}
details.ab{border-radius:13px;background:#141d45;border:1px solid var(--line);overflow:hidden}
details.ab summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;flex-direction:column;gap:3px;font-weight:600;line-height:1.35}
details.ab summary::-webkit-details-marker{display:none}
details.ab summary::after{content:"Show answer ▾";font-family:var(--mono);font-size:11px;color:var(--c);margin-top:3px}
details.ab[open] summary::after{content:"Hide ▴"}
.abs{font-family:var(--mono);font-size:11px;color:var(--c)}
.aba{padding:0 12px 12px;line-height:1.55;color:#dfe6ff}
.sym-inline{display:block;max-width:220px;background:#f7f4ff;border-radius:10px;margin:8px 0;color:#1b1d2e}.sym-inline svg{width:100%;height:auto;display:block}

/* boss hud */
.bosshud{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}
.bosshud>div:first-child{flex:1}.bosshud small{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.hpbar{height:14px;border-radius:9px;background:#1a1236;border:1px solid rgba(255,79,216,.4);overflow:hidden;margin-top:4px}
.hpbar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8a2bff,#ff4fd8);box-shadow:0 0 14px #ff4fd8;transition:width .6s}
.hearts{font-size:26px;letter-spacing:2px;color:#3a2d55}.hearts .on{color:#ff4f7a;text-shadow:0 0 10px rgba(255,79,122,.7)}

/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,20,.66);backdrop-filter:blur(5px);z-index:20}
#modal.show{display:flex}
#modalbox{width:min(520px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:22px;border-radius:22px;background:linear-gradient(170deg,#1a2558,#0e1638);border:1px solid rgba(160,180,255,.25);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
#modal.wide #modalbox{width:min(640px,100%)}
@keyframes zoom{from{transform:scale(.85);opacity:0}}
.intro,.result,.settings,.certwrap{display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:14px;align-items:flex-start}
.av{flex:none;width:76px;animation:bob 2.4s ease-in-out infinite}.av svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(255,207,107,.55))}
.av.big{width:110px;align-self:center}.av.sad{filter:grayscale(.6)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.say{display:flex;flex-direction:column;gap:6px;min-width:0}
.say h2,.result h2,.settings h2{font-family:var(--display);font-size:22px;line-height:1.15;color:#fff}
.say p{margin:0;line-height:1.5;color:#d6defa}
.intro h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ideas li{padding:9px 12px 9px 34px;border-radius:12px;background:#141d45;border:1px solid var(--line);line-height:1.45;position:relative}
.ideas li::before{content:"";position:absolute;left:12px;top:15px;width:10px;height:10px;border-radius:3px;background:var(--volt);transform:rotate(45deg);box-shadow:0 0 8px var(--volt)}
.result{text-align:center;align-items:center}
.bigstars{font-size:52px;letter-spacing:6px;color:#2a3366}
.bigstars span{display:inline-block}.bigstars .on{color:var(--volt);text-shadow:0 0 22px rgba(255,210,63,.8);animation:starin .6s backwards cubic-bezier(.2,1.6,.4,1)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.score{margin:0;font-family:var(--mono);font-size:15px}
.result .row{width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#141d45;border:1px solid var(--line)}
.setrow label{font-weight:600}
.sw{flex:none;width:52px;height:30px;border-radius:99px;background:#2a3256;position:relative;transition:background .2s}
.sw span{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--good)}.sw.on span{transform:translateX(22px)}
.cert{position:relative;padding:26px 22px;border-radius:16px;background:radial-gradient(circle at 20% 0%,#2a3a8a,#101a44 60%);border:3px solid var(--volt);box-shadow:inset 0 0 0 6px rgba(255,210,63,.15),0 0 40px rgba(255,210,63,.25);text-align:center;display:flex;flex-direction:column;gap:8px}
.cbrand{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctitle{font-family:var(--display);font-size:clamp(24px,6vw,34px);color:var(--volt);text-shadow:0 0 18px rgba(255,210,63,.5)}
.cert p{margin:0;line-height:1.5;color:#d6defa}
.cname{font-family:var(--display);font-size:clamp(20px,5vw,28px);color:#fff;border-bottom:2px dashed rgba(255,210,63,.5);padding-bottom:4px;align-self:center;max-width:100%;overflow-wrap:anywhere}
.cstats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:13px}
.cstats span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07)}
.cdate{font-size:13px;color:var(--muted)}
.cl{font-weight:600;font-size:14px}
.certwrap input{padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#0b1330;color:#fff;font-size:16px;font-family:var(--body)}

/* toast + confetti */
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:14px;background:rgba(14,21,52,.95);border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:14.5px;line-height:1.4;z-index:30;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.good{border-color:rgba(62,224,161,.6)}#toast.bad{border-color:rgba(255,95,109,.6)}#toast.warn{border-color:rgba(255,176,32,.7)}
#toast .bub{display:inline-block;width:34px;flex:none}#toast .bub svg{width:100%;height:auto;display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* loader */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1d1660 0%,#070b1f 65%);transition:opacity .6s,visibility .6s;text-align:center}
#loader.gone{opacity:0;visibility:hidden}
#loader .lg{width:110px;animation:bob 2.4s ease-in-out infinite}
#loader .lg svg{width:100%;height:auto;filter:drop-shadow(0 0 24px rgba(255,207,107,.7))}
#loader h1{font-family:var(--display);font-size:clamp(34px,9vw,64px);line-height:.95;color:var(--volt);text-shadow:0 0 28px rgba(255,210,63,.55),0 4px 0 #a06a00;letter-spacing:.03em}
#loader h1 span{display:block;font-size:.42em;color:var(--electron);text-shadow:0 0 18px rgba(79,216,255,.6);letter-spacing:.2em;margin-top:6px}
#loader .by{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.ldtrack{width:min(320px,80vw);height:12px;border-radius:99px;background:#141b44;border:1px solid var(--line);overflow:hidden}
#ldbar{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd8ff,#ffd23f);box-shadow:0 0 16px #ffd23f;transition:width .35s}
#ldmsg{margin:0;color:#cdd6f6;min-height:1.4em}
#ldgo{font-family:var(--display);font-size:20px;padding:14px 30px;border-radius:16px;letter-spacing:.04em}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd23f;box-shadow:0 0 8px #ffd23f;animation:fall linear infinite;opacity:.8}
@keyframes fall{from{transform:translateY(-10vh)}to{transform:translateY(110vh)}}

/* phones & small tablets: panel becomes a bottom sheet */
@media (max-width:820px){
  #stage.lab{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,52%)}
  #panel{border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
  #stage.lab:has(#panel.min){grid-template-rows:minmax(0,1fr) auto}
  #panel.min .tabs,#panel.min .pbody{display:none}
  .collapse{display:block}
  .prog{display:none}
  .brand small{display:none}
  .qtext{font-size:16px}
  .lbl.sign .nm{display:none}
  .lbl.sign.boss .nm{display:inline}
  .lbl.sign{padding:4px 7px 4px 5px;gap:5px}
}
@media (max-width:420px){
  #top{gap:6px;padding:7px 10px}
  .brand b{font-size:16px}
  .pill{padding:3px 8px;font-size:13px}
  .ib{width:34px;height:34px}
  .reads{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

(()=>{var wg=Object.defineProperty;var Pi=(s,e)=>{for(var t in e)wg(s,t,{get:e[t],enumerable:!0})};var qt=[{id:"current",sec:"11.1",name:"Current Junction",short:"Electric Current & Circuit",color:"#4fd8ff",intro:"The lights went out here first! A circuit only works when the path is closed. Plug in the key, watch electrons drift, and count the charge.",ideas:["A continuous, closed path of current is an <b>electric circuit</b>.","Current = rate of flow of charge: <b>I = Q / t</b>. Unit: ampere (A). 1 A = 1 C/s.","Electrons flow from \u2212 to + outside the cell. <b>Conventional current</b> flows the opposite way, + to \u2212."],quiz:[{t:"mcq",tag:"Concept",q:"A continuous and closed path of an electric current is called\u2026",o:["An electric circuit","A switch","A plug key","A fuse"],h:"Think of the full loop from the cell, through the bulb, and back.",s:"A continuous and closed path of electric current is called an electric circuit."},{t:"mcq",tag:"Concept",q:"Electric current is defined as the\u2026",o:["Rate of flow of electric charge","Amount of energy in a cell","Push that moves charges","Opposition to the flow of charge"],h:"Current tells you how much charge passes per second.",s:"I = Q/t \u2014 current is the amount of charge flowing through a cross-section per unit time."},{t:"mcq",tag:"Concept",q:"In circuits made of metallic wires, which particles actually flow?",o:["Electrons","Protons","Neutrons","Positive ions"],h:"They carry negative charge.",s:"In metallic wires, electrons constitute the flow of charges."},{t:"tf",tag:"Concept",q:"The conventional direction of electric current is the same as the direction of flow of electrons.",a:!1,h:"Electrons were discovered after the direction of current was fixed.",s:"False. Conventional current is taken opposite to the direction of flow of electrons (it flows from + to \u2212 outside the cell)."},{t:"mcq",tag:"In-text Q (p.172)",q:"1 ampere is the current when\u2026",o:["1 coulomb of charge flows per second","1 joule of work is done per coulomb","1 volt acts across 1 ohm for 1 hour","1 electron flows per second"],h:"1 A = 1 C / 1 s.",s:"One ampere is constituted by the flow of one coulomb of charge per second (1 A = 1 C/1 s)."},{t:"num",tag:"Example 11.1",q:"A bulb filament draws 0.5 A for 10 minutes. How much charge (in coulomb) flows?",a:300,u:"C",tol:.5,h:"Convert 10 min to seconds first. Then Q = I \xD7 t.",s:"t = 10 min = 600 s. Q = It = 0.5 A \xD7 600 s = <b>300 C</b>."},{t:"num",tag:"In-text Q3 (p.172)",q:"How many electrons make up 1 coulomb of charge? Give the answer in units of 10\xB9\u2078 (charge on one electron = 1.6 \xD7 10\u207B\xB9\u2079 C).",a:6.25,u:"\xD7 10\xB9\u2078",tol:.06,h:"Number of electrons = 1 C \xF7 charge on one electron.",s:"n = 1 / (1.6 \xD7 10\u207B\xB9\u2079) = 6.25 \xD7 10\xB9\u2078 electrons. (The textbook rounds this to \u201Cnearly 6 \xD7 10\xB9\u2078\u201D.)"},{t:"mcq",tag:"Concept",q:"1 milliampere (1 mA) is equal to\u2026",o:["10\u207B\xB3 A","10\u207B\u2076 A","10\xB3 A","10\u207B\xB2 A"],h:"\u201CMilli\u201D means one-thousandth.",s:"1 mA = 10\u207B\xB3 A and 1 \xB5A = 10\u207B\u2076 A."},{t:"mcq",tag:"Concept",q:"An ammeter is always connected in the circuit\u2026",o:["In series","In parallel","Across the cell only","Outside the circuit"],h:"All the current must pass through it.",s:"An ammeter measures current, so it is always connected in series."},{t:"mcq",tag:"Figure 11.1",q:"Outside the cell, the conventional current flows\u2026",o:["From the + terminal to the \u2212 terminal","From the \u2212 terminal to the + terminal","Both ways at once","Only inside the bulb"],h:"Look at the arrows in Figure 11.1.",s:"Current flows from the positive terminal of the cell to the negative terminal, through the bulb and ammeter."},{t:"num",tag:"Concept",q:"A charge of 120 C flows through a wire in 1 minute. What is the current?",a:2,u:"A",tol:.01,h:"1 minute = 60 s. I = Q/t.",s:"I = Q/t = 120 C \xF7 60 s = <b>2 A</b>."},{t:"mcq",tag:"Concept",q:"What does the switch of a torch do?",o:["Makes a conducting link between the cell and the bulb","Stores extra charge","Increases the voltage","Measures the current"],h:"When it is off, the circuit is broken.",s:"A switch makes a conducting link between the cell and the bulb. When it is off, the circuit is broken and current stops."}],answers:[{src:"In-text Q1, p.172",q:"What does an electric circuit mean?",a:"A continuous and closed path of an electric current is called an electric circuit. If it is broken anywhere (or the switch is off), current stops flowing."},{src:"In-text Q2, p.172",q:"Define the unit of current.",a:"The SI unit of current is the ampere (A). One ampere is the current when one coulomb of charge flows through a cross-section in one second: 1 A = 1 C / 1 s."},{src:"In-text Q3, p.172",q:"Calculate the number of electrons constituting one coulomb of charge.",a:"Charge on one electron = 1.6 \xD7 10\u207B\xB9\u2079 C.<br>n = Q / e = 1 C \xF7 1.6 \xD7 10\u207B\xB9\u2079 C = <b>6.25 \xD7 10\xB9\u2078 electrons</b>."},{src:"Example 11.1",q:"A current of 0.5 A is drawn by a filament of an electric bulb for 10 minutes. Find the charge that flows.",a:"I = 0.5 A, t = 600 s. Q = It = 0.5 \xD7 600 = <b>300 C</b>."}]},{id:"pd",sec:"11.2",name:"Pressure Peak",short:"Potential Difference",color:"#7aa8ff",intro:"Water flows only when one end is higher. Charges flow only when there is an electric \u201Cpressure\u201D difference. Raise the tank, add cells, and feel the push!",ideas:["Charges flow only when there is a <b>potential difference (V)</b> along the conductor. A cell or battery maintains it.","<b>V = W / Q</b> \u2014 the work done to move a unit charge between two points. Unit: volt (V). 1 V = 1 J/C.","A <b>voltmeter</b> measures potential difference and is always connected <b>in parallel</b>."],quiz:[{t:"mcq",tag:"Concept",q:"What makes electric charge flow in a copper wire?",o:["A potential difference across it","Gravity","The colour of the wire","A fuse in the circuit"],h:"Remember the water tank kept at a higher level.",s:"Electrons move only if there is a difference of electric pressure \u2014 the potential difference \u2014 along the conductor."},{t:"mcq",tag:"In-text Q1 (p.174)",q:"Name a device that helps to maintain a potential difference across a conductor.",o:["A cell or battery","An ammeter","A plug key","A bulb"],h:"Chemical action inside it creates the difference.",s:"A cell or a battery (one or more cells) maintains the potential difference."},{t:"mcq",tag:"Concept",q:"Potential difference between two points is\u2026",o:["Work done per unit charge moved between them","Charge flowing per second","Current \xD7 time","Work done \xD7 charge"],h:"V = W/Q.",s:"V = W/Q \u2014 the work done to move a unit charge from one point to the other."},{t:"mcq",tag:"Concept",q:"SI unit of potential difference is\u2026",o:["Volt","Ampere","Joule","Ohm"],h:"Named after Alessandro Volta.",s:"The volt (V), named after the Italian physicist Alessandro Volta."},{t:"tf",tag:"Concept",q:"1 volt = 1 joule per coulomb (1 V = 1 J C\u207B\xB9).",a:!0,h:"Use V = W/Q with W = 1 J and Q = 1 C.",s:"True. 1 V = 1 J / 1 C."},{t:"num",tag:"Example 11.2",q:"How much work is done in moving a charge of 2 C across two points having a potential difference of 12 V?",a:24,u:"J",tol:.01,h:"W = V \xD7 Q.",s:"W = VQ = 12 V \xD7 2 C = <b>24 J</b>."},{t:"num",tag:"In-text Q3 (p.174)",q:"How much energy is given to each coulomb of charge passing through a 6 V battery?",a:6,u:"J",tol:.01,h:"W = VQ with Q = 1 C.",s:"W = VQ = 6 V \xD7 1 C = <b>6 J</b>."},{t:"mcq",tag:"Concept",q:"How is a voltmeter connected to measure the potential difference between two points?",o:["In parallel across the two points","In series with the component","Directly across the ammeter","It is never connected to a circuit"],h:"It must \u201Csit across\u201D the component.",s:"A voltmeter is always connected in parallel across the points between which the potential difference is to be measured. (Exercise 5)"},{t:"mcq",tag:"Concept",q:"In the water analogy, what plays the role of potential difference?",o:["The pressure difference due to the height of the tank","The width of the pipe","The temperature of the water","The colour of the tank"],h:"Water in a horizontal tube does not flow.",s:"Water flows when one end is connected to a tank kept higher \u2014 a pressure difference. Potential difference is the \u201Celectric pressure\u201D difference."},{t:"mcq",tag:"In-text Q2 (p.174)",q:"What is meant by saying that the potential difference between two points is 1 V?",o:["1 J of work is done to move 1 C of charge between them","1 C of charge flows in 1 s","1 A flows through 1 \u03A9","1 W of power is used for 1 hour"],h:"V = W/Q.",s:"1 V means 1 joule of work is done to move a charge of 1 coulomb from one point to the other."},{t:"tf",tag:"Concept",q:"A cell produces a potential difference across its terminals even when no current is drawn from it.",a:!0,h:"Read section 11.2 again.",s:"True. The chemical action within a cell generates the potential difference even when no current is drawn."},{t:"num",tag:"Concept",q:"9 J of work is done to move 3 C of charge between two points. Find the potential difference.",a:3,u:"V",tol:.01,h:"V = W/Q.",s:"V = W/Q = 9 J \xF7 3 C = <b>3 V</b>."}],answers:[{src:"In-text Q1, p.174",q:"Name a device that helps to maintain a potential difference across a conductor.",a:"A cell or a battery. The chemical action within the cell generates the potential difference across its terminals."},{src:"In-text Q2, p.174",q:"What is meant by saying that the potential difference between two points is 1 V?",a:"It means that 1 joule of work is done to move a charge of 1 coulomb from one point to the other. (1 V = 1 J/C)"},{src:"In-text Q3, p.174",q:"How much energy is given to each coulomb of charge passing through a 6 V battery?",a:"W = VQ = 6 V \xD7 1 C = <b>6 J</b>."},{src:"Exercise 5",q:"How is a voltmeter connected in the circuit to measure the potential difference between two points?",a:"The voltmeter is connected <b>in parallel</b> across the two points between which the potential difference is to be measured."},{src:"Example 11.2",q:"How much work is done in moving a charge of 2 C across two points having a potential difference 12 V?",a:"W = VQ = 12 V \xD7 2 C = <b>24 J</b>."}]},{id:"symbols",sec:"11.3",name:"Symbol Station",short:"Circuit Diagrams",color:"#c78bff",intro:"Engineers don't draw real bulbs and batteries \u2014 they use symbols! Tap each part to reveal its symbol, then beat the Symbol Match challenge.",ideas:["A circuit diagram shows parts using <b>conventional symbols</b> (Table 11.1).","In a cell symbol, the <b>longer line is +</b> and the shorter, thicker line is \u2212.","A dot shows a <b>wire joint</b>; a little hop shows wires <b>crossing without joining</b>."],quiz:[{t:"mcq",tag:"Table 11.1",img:"cell",q:"Which component does this symbol represent?",o:["An electric cell","A battery","A resistor","A voltmeter"],h:"Just one long and one short line.",s:"One long line (+) and one short line (\u2212) = an electric cell."},{t:"mcq",tag:"Table 11.1",img:"battery",q:"Which component does this symbol represent?",o:["A battery (combination of cells)","A single electric cell","A wire joint","A rheostat"],h:"Count the pairs of lines.",s:"Several cell symbols joined together = a battery, a combination of cells."},{t:"mcq",tag:"Table 11.1",img:"keyOpen",q:"Which component does this symbol represent?",o:["Plug key or switch (open)","Plug key or switch (closed)","An ammeter","An electric bulb"],h:"There is no dot in the middle.",s:"Brackets without a dot = an open plug key / switch."},{t:"mcq",tag:"Table 11.1",img:"keyClosed",q:"Which component does this symbol represent?",o:["Plug key or switch (closed)","Plug key or switch (open)","A wire joint","A resistor"],h:"The dot shows the plug is in.",s:"Brackets with a dot = a closed plug key / switch."},{t:"mcq",tag:"Table 11.1",img:"joint",q:"Which component does this symbol represent?",o:["A wire joint","Wires crossing without joining","A cell","A rheostat"],h:"Look at the solid dot where the wires meet.",s:"A solid dot where wires meet = a wire joint."},{t:"mcq",tag:"Table 11.1",img:"cross",q:"Which component does this symbol represent?",o:["Wires crossing without joining","A wire joint","An electric bulb","A plug key"],h:"One wire hops over the other.",s:"A small hop over the other wire = wires crossing without joining."},{t:"mcq",tag:"Table 11.1",img:"bulb",q:"Which component does this symbol represent?",o:["An electric bulb","A resistor","A voltmeter","A battery"],h:"It looks like a filament coil.",s:"The looped filament symbol = an electric bulb."},{t:"mcq",tag:"Table 11.1",img:"resistor",q:"Which component does this symbol represent?",o:["A resistor of resistance R","A variable resistance (rheostat)","A cell","A wire joint"],h:"Zig-zag with no arrow.",s:"A plain zig-zag line = a resistor of resistance R."},{t:"mcq",tag:"Table 11.1",img:"rheostat",q:"Which component does this symbol represent?",o:["Variable resistance or rheostat","A fixed resistor","An ammeter","A plug key"],h:"Notice the arrow across the zig-zag.",s:"A zig-zag with an arrow = a variable resistance (rheostat)."},{t:"mcq",tag:"Table 11.1",img:"ammeter",q:"Which component does this symbol represent?",o:["An ammeter","A voltmeter","An electric bulb","A battery"],h:"Read the letter in the circle.",s:"A circle with \u201CA\u201D = an ammeter (measures current)."},{t:"mcq",tag:"Table 11.1",img:"voltmeter",q:"Which component does this symbol represent?",o:["A voltmeter","An ammeter","A resistor","A plug key"],h:"Read the letter in the circle.",s:"A circle with \u201CV\u201D = a voltmeter (measures potential difference)."},{t:"tf",tag:"Table 11.1",q:"In the symbol of an electric cell, the longer line represents the positive (+) terminal.",a:!0,h:"Look at the + sign in Table 11.1.",s:"True. The longer line is + and the shorter, thicker line is \u2212."},{t:"mcq",tag:"Concept",q:"Why do we draw schematic circuit diagrams using symbols?",o:["They are simple and convenient to draw and understand","They make the current larger","They are needed to make the bulb glow","They change the resistance"],h:"Section 11.3 says it is \u201Cconvenient\u201D.",s:"Symbols make it convenient to represent the components of a circuit in a schematic diagram."}],answers:[{src:"Section 11.3",q:"What does a circuit diagram show?",a:"A schematic diagram in which the components of a circuit (cell, plug key, bulb, resistor, meters, wires) are shown by conventional symbols (Table 11.1)."},{src:"Table 11.1",q:"List the 11 symbols from Table 11.1.",a:"Electric cell \xB7 Battery \xB7 Plug key (open) \xB7 Plug key (closed) \xB7 Wire joint \xB7 Wires crossing without joining \xB7 Electric bulb \xB7 Resistor \xB7 Variable resistance (rheostat) \xB7 Ammeter \xB7 Voltmeter. Play <b>Symbol Match</b> in the Lab to practise all eleven."}]},{id:"ohm",sec:"11.4",name:"Ohm's Observatory",short:"Ohm's Law",color:"#ffc93c",intro:"Professor Ohm discovered a secret pattern in 1827! Add cells one by one, record the meters, and watch the V\u2013I graph become a perfect straight line.",ideas:["<b>Ohm\u2019s law:</b> V \u221D I, so <b>V = IR</b>, provided the temperature stays the same.","R is the <b>resistance</b>. Unit: ohm (\u03A9). 1 \u03A9 = 1 V / 1 A.","<b>I = V/R</b>: double the resistance and the current halves. A <b>rheostat</b> changes resistance in a circuit."],quiz:[{t:"mcq",tag:"Concept",q:"Ohm\u2019s law states that, at constant temperature,\u2026",o:["V across a conductor is directly proportional to I through it","V is inversely proportional to I","I is directly proportional to R","V is proportional to the square of I"],h:"The V\u2013I graph is a straight line through the origin.",s:"V \u221D I, i.e. V/I = R (constant), provided the temperature remains the same."},{t:"mcq",tag:"Activity 11.1",q:"The V\u2013I graph for a nichrome wire (Figure 11.3) is\u2026",o:["A straight line passing through the origin","A curve bending upward","A horizontal line","A circle"],h:"V/I came out nearly the same each time.",s:"Because V/I is constant, the V\u2013I graph is a straight line passing through the origin."},{t:"mcq",tag:"Concept",q:"SI unit of resistance is\u2026",o:["Ohm (\u03A9)","Volt (V)","Ampere (A)","Watt (W)"],h:"Greek letter omega.",s:"Resistance is measured in ohm (\u03A9). 1 \u03A9 = 1 V/1 A."},{t:"num",tag:"Example 11.3 (a)",q:"How much current will an electric bulb draw from a 220 V source if its filament resistance is 1200 \u03A9? (2 decimal places)",a:.18,u:"A",tol:.01,h:"I = V/R.",s:"I = V/R = 220 V \xF7 1200 \u03A9 = <b>0.18 A</b>."},{t:"num",tag:"Example 11.3 (b)",q:"How much current will a heater coil of 100 \u03A9 draw from a 220 V source?",a:2.2,u:"A",tol:.01,h:"I = V/R.",s:"I = 220 V \xF7 100 \u03A9 = <b>2.2 A</b>. Compare with the bulb: same source, very different currents!"},{t:"num",tag:"Example 11.4",q:"A heater draws 4 A at 60 V. What current will it draw if the potential difference is increased to 120 V?",a:8,u:"A",tol:.01,h:"First find R = V/I. R does not change.",s:"R = 60/4 = 15 \u03A9. New I = 120/15 = <b>8 A</b>."},{t:"num",tag:"Exercise 8",q:"A 12 V battery connected across an unknown resistor gives a current of 2.5 mA. Find the resistance.",a:4800,u:"\u03A9",tol:5,h:"Convert 2.5 mA to amperes first.",s:"I = 2.5 mA = 2.5 \xD7 10\u207B\xB3 A. R = V/I = 12 / 0.0025 = <b>4800 \u03A9 (4.8 k\u03A9)</b>."},{t:"mcq",tag:"In-text Q3 (p.181)",q:"The resistance of a component stays constant while the potential difference across it is halved. What happens to the current?",o:["It becomes half","It doubles","It stays the same","It becomes four times"],h:"I = V/R with R fixed.",s:"I = V/R. With R constant, halving V halves the current."},{t:"mcq",tag:"Concept",q:"Which device is used to change the resistance in a circuit without changing the voltage source?",o:["Rheostat","Ammeter","Voltmeter","Fuse"],h:"It is also called a variable resistance.",s:"A rheostat (variable resistance) regulates current without changing the voltage source."},{t:"num",tag:"Exercise 7",q:"For a resistor, V = 1.6, 3.4, 6.7, 10.2, 13.2 V at I = 0.5, 1.0, 2.0, 3.0, 4.0 A. Using the slope of the V\u2013I graph, estimate R (1 decimal place).",a:3.3,u:"\u03A9",tol:.15,h:"Slope = (13.2 \u2212 1.6) \xF7 (4.0 \u2212 0.5).",s:"Slope = \u0394V/\u0394I = (13.2 \u2212 1.6)/(4.0 \u2212 0.5) = 11.6/3.5 \u2248 <b>3.3 \u03A9</b>."},{t:"tf",tag:"Concept",q:"If the resistance in a circuit is doubled (same voltage), the current gets halved.",a:!0,h:"I = V/R.",s:"True. Current is inversely proportional to resistance."},{t:"mcq",tag:"Activity 11.2",q:"A nichrome wire, a torch bulb and a 10 W bulb are placed one by one in gap XY. The ammeter readings differ because\u2026",o:["The components have different resistances","The battery voltage keeps changing","Current gets used up in the gap","The ammeter is faulty"],h:"Some components offer an easy path, others resist the flow.",s:"Different components offer different resistance, so different currents flow from the same source."}],answers:[{src:"In-text Q3, p.181",q:"Let the resistance of a component remain constant while the potential difference across it decreases to half. What change occurs in the current?",a:"I = V/R. With R constant, the current also becomes <b>half</b>."},{src:"Exercise 7",q:"Plot V\u2013I and calculate the resistance (I: 0.5, 1, 2, 3, 4 A; V: 1.6, 3.4, 6.7, 10.2, 13.2 V).",a:"The graph is a straight line through (nearly) the origin. Slope = (13.2 \u2212 1.6)/(4 \u2212 0.5) = 11.6/3.5 \u2248 <b>3.3 \u03A9</b>."},{src:"Exercise 8",q:"12 V battery, 2.5 mA current. Find the resistance.",a:"R = V/I = 12 / (2.5 \xD7 10\u207B\xB3) = <b>4800 \u03A9 = 4.8 k\u03A9</b>."},{src:"Example 11.4",q:"A heater draws 4 A at 60 V. What current at 120 V?",a:"R = 60/4 = 15 \u03A9; I = 120/15 = <b>8 A</b>."}]},{id:"resist",sec:"11.5",name:"Resistance Workshop",short:"Factors Affecting Resistance",color:"#ff9d5c",intro:"Why are some wires lazy and others speedy? Change the length, thickness and material of the wire and read the ammeter like a real scientist.",ideas:["<b>R \u221D l</b> (longer wire, more resistance) and <b>R \u221D 1/A</b> (thicker wire, less resistance).","<b>R = \u03C1 l / A</b>. \u03C1 (rho) is the <b>resistivity</b> of the material. Unit: \u03A9 m.","Metals: \u03C1 \u2248 10\u207B\u2078 to 10\u207B\u2076 \u03A9 m (good conductors). Insulators: 10\xB9\xB2 to 10\xB9\u2077 \u03A9 m. Alloys have higher \u03C1 and do not oxidise easily."],quiz:[{t:"mcq",tag:"In-text Q1 (p.181)",q:"On what factors does the resistance of a conductor depend?",o:["Its length, area of cross-section and material","Only its length","Only its colour and shape","The current flowing through it"],h:"Activity 11.3 changed three things.",s:"Resistance depends on (i) length, (ii) area of cross-section and (iii) nature of the material (and also temperature)."},{t:"mcq",tag:"Activity 11.3",q:"When the length of a nichrome wire is doubled (same thickness), its resistance\u2026",o:["Doubles","Halves","Stays the same","Becomes four times"],h:"The ammeter reading became half.",s:"R \u221D l, so doubling the length doubles R and the current becomes half."},{t:"mcq",tag:"In-text Q2 (p.181)",q:"Will current flow more easily through a thick wire or a thin wire of the same material, on the same source?",o:["Thick wire \u2014 it has less resistance","Thin wire \u2014 it has less resistance","Both the same","Neither"],h:"R \u221D 1/A.",s:"Through the thick wire. R is inversely proportional to the area of cross-section, so a thicker wire has less resistance."},{t:"mcq",tag:"Concept",q:"Which formula is correct?",o:["R = \u03C1l / A","R = \u03C1A / l","R = lA / \u03C1","R = \u03C1 / (lA)"],h:"R increases with length and decreases with area.",s:"R = \u03C1 l/A, where \u03C1 is the electrical resistivity."},{t:"mcq",tag:"Concept",q:"SI unit of resistivity is\u2026",o:["\u03A9 m","\u03A9 / m","\u03A9","\u03A9 m\xB2"],h:"\u03C1 = RA/l \u2192 \u03A9 \xD7 m\xB2 / m.",s:"\u03C1 = RA/l, so its unit is \u03A9 m."},{t:"mcq",tag:"In-text Q5(a) (p.181)",q:"Using Table 11.2, which is the better conductor: iron or mercury?",o:["Iron","Mercury","Both are equal","Neither conducts"],h:"Lower resistivity = better conductor. Iron 10.0 \xD7 10\u207B\u2078; mercury 94.0 \xD7 10\u207B\u2078 \u03A9 m.",s:"Iron (10.0 \xD7 10\u207B\u2078 \u03A9 m) has much lower resistivity than mercury (94.0 \xD7 10\u207B\u2078 \u03A9 m), so iron is the better conductor."},{t:"mcq",tag:"In-text Q5(b) (p.181)",q:"Using Table 11.2, which material is the best conductor?",o:["Silver","Copper","Aluminium","Tungsten"],h:"Find the lowest resistivity.",s:"Silver has the lowest resistivity (1.60 \xD7 10\u207B\u2078 \u03A9 m), so it is the best conductor."},{t:"mcq",tag:"In-text Q4 (p.181)",q:"Why are coils of electric toasters and irons made of an alloy rather than a pure metal?",o:["Alloys have higher resistivity and do not oxidise (burn) readily at high temperature","Alloys have lower resistivity","Alloys are magnetic","Alloys are lighter than metals"],h:"Think about very hot coils.",s:"An alloy has higher resistivity than its constituent metals and does not oxidise (burn) readily at high temperatures."},{t:"mcq",tag:"Exercise 18(a)",q:"Bulb filaments are made almost exclusively of\u2026",o:["Tungsten","Copper","Nichrome","Aluminium"],h:"Its melting point is 3380 \xB0C.",s:"Tungsten \u2014 a strong metal with a very high melting point (3380 \xB0C), so it glows without melting."},{t:"num",tag:"Example 11.6",q:"A wire of length l and area A has resistance 4 \u03A9. What is the resistance of a wire of the same material with length l/2 and area 2A?",a:1,u:"\u03A9",tol:.01,h:"R\u2082 = \u03C1 (l/2)/(2A) = \xBC \xD7 \u03C1l/A.",s:"R\u2082 = \u03C1(l/2)/(2A) = \xBC R\u2081 = \xBC \xD7 4 = <b>1 \u03A9</b>."},{t:"num",tag:"Exercise 6",q:"A copper wire has resistance 10 \u03A9. If its diameter is doubled (same length), what is its new resistance?",a:2.5,u:"\u03A9",tol:.01,h:"Doubling the diameter makes the area 4 times.",s:"A \u221D d\xB2, so A becomes 4 times and R becomes \xBC: 10/4 = <b>2.5 \u03A9</b>."},{t:"num",tag:"Exercise 6",q:"A copper wire has diameter 0.5 mm and resistivity 1.6 \xD7 10\u207B\u2078 \u03A9 m. What length gives it a resistance of 10 \u03A9? (nearest metre)",a:122.7,u:"m",tol:1.5,h:"A = \u03C0d\xB2/4, then l = RA/\u03C1.",s:"A = \u03C0(0.5 \xD7 10\u207B\xB3)\xB2/4 = 1.96 \xD7 10\u207B\u2077 m\xB2. l = RA/\u03C1 = 10 \xD7 1.96 \xD7 10\u207B\u2077 / 1.6 \xD7 10\u207B\u2078 \u2248 <b>122.7 m</b>."},{t:"mcq",tag:"Exercise 18(e)",q:"Copper and aluminium are usually used for electricity transmission because\u2026",o:["They have very low resistivity, so they are good conductors","They have very high resistivity","They melt easily","They do not conduct electricity"],h:"Check their resistivities in Table 11.2.",s:"Copper (1.62 \xD7 10\u207B\u2078) and aluminium (2.63 \xD7 10\u207B\u2078 \u03A9 m) have very low resistivity, so little energy is lost."},{t:"tf",tag:"Table 11.2",q:"The resistivity of an alloy is generally higher than that of its constituent metals.",a:!0,h:"Compare nichrome with nickel and chromium.",s:"True. Example: nichrome 100 \xD7 10\u207B\u2076 \u03A9 m vs nickel 6.84 \xD7 10\u207B\u2078 \u03A9 m."}],answers:[{src:"In-text Q1, p.181",q:"On what factors does the resistance of a conductor depend?",a:"(i) Its length (R \u221D l), (ii) its area of cross-section (R \u221D 1/A), (iii) the nature of its material (resistivity \u03C1). It also varies with temperature. R = \u03C1 l/A."},{src:"In-text Q2, p.181",q:"Will current flow more easily through a thick wire or a thin wire of the same material on the same source? Why?",a:"Through the <b>thick wire</b>. R \u221D 1/A, so the thicker wire (larger area) has lower resistance and allows more current."},{src:"In-text Q4, p.181",q:"Why are coils of electric toasters and electric irons made of an alloy rather than a pure metal?",a:"Alloys have higher resistivity than their constituent metals, so they produce more heat, and they do not oxidise (burn) readily at high temperatures."},{src:"In-text Q5, p.181",q:"(a) Iron or mercury \u2014 which is the better conductor? (b) Which material is the best conductor?",a:"(a) <b>Iron</b> (\u03C1 = 10.0 \xD7 10\u207B\u2078 \u03A9 m) is better than mercury (94.0 \xD7 10\u207B\u2078 \u03A9 m).<br>(b) <b>Silver</b> (\u03C1 = 1.60 \xD7 10\u207B\u2078 \u03A9 m) is the best conductor."},{src:"Exercise 6",q:"Copper wire, d = 0.5 mm, \u03C1 = 1.6 \xD7 10\u207B\u2078 \u03A9 m. Length for 10 \u03A9? Change in R if diameter is doubled?",a:"A = \u03C0d\xB2/4 = 3.14 \xD7 (0.5 \xD7 10\u207B\xB3)\xB2/4 = 1.96 \xD7 10\u207B\u2077 m\xB2.<br>l = RA/\u03C1 = 10 \xD7 1.96 \xD7 10\u207B\u2077 / 1.6 \xD7 10\u207B\u2078 \u2248 <b>122.7 m</b>.<br>Doubling d makes A four times, so R becomes \xBC of 10 \u03A9 = <b>2.5 \u03A9</b> (it decreases by 7.5 \u03A9)."},{src:"Exercise 18 (a)",q:"Why is tungsten used almost exclusively for filaments of electric lamps?",a:"Tungsten is a strong metal with a very high melting point (3380 \xB0C). It can become white-hot and emit light without melting."},{src:"Exercise 18 (b)",q:"Why are conductors of heating devices made of an alloy?",a:"Alloys have high resistivity (more heat is produced) and do not oxidise (burn) readily at high temperatures."},{src:"Exercise 18 (d)",q:"How does the resistance of a wire vary with its area of cross-section?",a:"It is inversely proportional: R \u221D 1/A. Doubling the area halves the resistance."},{src:"Exercise 18 (e)",q:"Why are copper and aluminium wires usually employed for electricity transmission?",a:"They have very low resistivity (good conductors), so very little electrical energy is wasted as heat in the lines."},{src:"Example 11.5",q:"A 1 m wire of resistance 26 \u03A9 has diameter 0.3 mm. Find its resistivity and predict the material.",a:"\u03C1 = R\u03C0d\xB2/4l = 1.84 \xD7 10\u207B\u2076 \u03A9 m \u2014 this matches <b>manganese</b> in Table 11.2."}]},{id:"combo",sec:"11.6",name:"Series & Parallel Plaza",short:"Resistors in Series & Parallel",color:"#3ee0a1",intro:"Festival time! The plaza's fairy lights are dead. Wire them in series or parallel, blow a bulb on purpose, and discover why homes use parallel wiring.",ideas:["<b>Series:</b> same current through each resistor. V = V\u2081 + V\u2082 + V\u2083 and <b>Rs = R\u2081 + R\u2082 + R\u2083</b>.","<b>Parallel:</b> same potential difference across each. I = I\u2081 + I\u2082 + I\u2083 and <b>1/Rp = 1/R\u2081 + 1/R\u2082 + 1/R\u2083</b>.","In series, if one part fails, everything stops. Parallel lets each gadget take the current it needs."],quiz:[{t:"mcq",tag:"Activity 11.4",q:"In a series combination of resistors, which quantity is the same in every resistor?",o:["Current","Potential difference","Resistance","Heat produced"],h:"Moving the ammeter anywhere gave the same reading.",s:"In series the same current flows through every part of the circuit."},{t:"mcq",tag:"Activity 11.6",q:"In a parallel combination, which quantity is the same across every resistor?",o:["Potential difference","Current","Resistance","Power"],h:"The voltmeter across each resistor read the same V.",s:"In parallel, the potential difference across each resistor is the same."},{t:"num",tag:"Example 11.7",q:"A 20 \u03A9 lamp and a 4 \u03A9 conductor are in series with a 6 V battery. What is the current?",a:.25,u:"A",tol:.005,h:"Rs = 20 + 4. Then I = V/Rs.",s:"Rs = 24 \u03A9. I = 6/24 = <b>0.25 A</b>. (V across lamp = 5 V, across conductor = 1 V.)"},{t:"num",tag:"In-text Q2 (p.185)",q:"Three 2 V cells in series drive current through 5 \u03A9, 8 \u03A9 and 12 \u03A9 resistors in series. What does the ammeter read?",a:.24,u:"A",tol:.005,h:"V = 6 V and Rs = 25 \u03A9.",s:"V = 3 \xD7 2 = 6 V; Rs = 5 + 8 + 12 = 25 \u03A9; I = 6/25 = <b>0.24 A</b>."},{t:"num",tag:"In-text Q2 (p.185)",q:"In the same circuit, what does a voltmeter across the 12 \u03A9 resistor read?",a:2.88,u:"V",tol:.02,h:"V = I \xD7 R for that resistor.",s:"V = IR = 0.24 \xD7 12 = <b>2.88 V</b>."},{t:"num",tag:"Example 11.8",q:"5 \u03A9, 10 \u03A9 and 30 \u03A9 are connected in parallel. What is their equivalent resistance?",a:3,u:"\u03A9",tol:.01,h:"1/Rp = 1/5 + 1/10 + 1/30.",s:"1/Rp = 6/30 + 3/30 + 1/30 = 10/30 = 1/3, so Rp = <b>3 \u03A9</b>."},{t:"num",tag:"Example 11.8",q:"That parallel group (5 \u03A9, 10 \u03A9, 30 \u03A9) is connected to a 12 V battery. What is the total current?",a:4,u:"A",tol:.01,h:"I = I\u2081 + I\u2082 + I\u2083 = 12/5 + 12/10 + 12/30.",s:"2.4 + 1.2 + 0.4 = <b>4 A</b> (= 12 V \xF7 3 \u03A9)."},{t:"num",tag:"Exercise 9",q:"A 9 V battery is in series with 0.2 \u03A9, 0.3 \u03A9, 0.4 \u03A9, 0.5 \u03A9 and 12 \u03A9. What current flows through the 12 \u03A9 resistor? (2 decimal places)",a:.67,u:"A",tol:.01,h:"In series the current is the same everywhere. Add all resistances.",s:"Rs = 13.4 \u03A9. I = 9/13.4 = <b>0.67 A</b> \u2014 the same through every resistor."},{t:"num",tag:"Exercise 10",q:"How many 176 \u03A9 resistors in parallel are needed to carry 5 A on a 220 V line?",a:4,u:"resistors",tol:0,h:"Needed R = 220/5 = 44 \u03A9. n identical resistors in parallel give 176/n.",s:"R = 220/5 = 44 \u03A9. 176/n = 44 \u2192 n = <b>4</b>."},{t:"num",tag:"Exercise 1",q:"A wire of resistance R is cut into five equal parts, which are joined in parallel to give R\u2032. Find R/R\u2032.",a:25,u:"",tol:0,h:"Each part is R/5. Five equal parts in parallel give (R/5)/5.",s:"Each part = R/5; in parallel R\u2032 = (R/5)/5 = R/25. So R/R\u2032 = <b>25</b> \u2014 option (d)."},{t:"mcq",tag:"Exercise 11 (i)",q:"How can three 6 \u03A9 resistors be connected to give 9 \u03A9?",o:["Two in parallel, then in series with the third","All three in series","All three in parallel","Two in series, then in parallel with the third"],h:"Two 6 \u03A9 in parallel = 3 \u03A9.",s:"6 \u2225 6 = 3 \u03A9; 3 + 6 = <b>9 \u03A9</b>. (Two in series = 12 \u03A9, in parallel with 6 \u03A9 gives 4 \u03A9.)"},{t:"mcq",tag:"In-text Q4(b) (p.188)",q:"How can 2 \u03A9, 3 \u03A9 and 6 \u03A9 be connected to give 1 \u03A9?",o:["All three in parallel","All three in series","2 \u03A9 in series with (3 \u03A9 \u2225 6 \u03A9)","3 \u03A9 in series with (2 \u03A9 \u2225 6 \u03A9)"],h:"1/2 + 1/3 + 1/6 = ?",s:"1/R = 1/2 + 1/3 + 1/6 = 1, so all three in parallel give <b>1 \u03A9</b>."},{t:"num",tag:"In-text Q5(b) (p.188)",q:"What is the lowest total resistance you can get by combining 4 \u03A9, 8 \u03A9, 12 \u03A9 and 24 \u03A9?",a:2,u:"\u03A9",tol:.01,h:"Lowest = all in parallel.",s:"1/R = 1/4 + 1/8 + 1/12 + 1/24 = 12/24, so R = <b>2 \u03A9</b>. (Highest, all in series = 48 \u03A9.)"},{t:"mcq",tag:"Exercise 18(c)",q:"Why is the series arrangement not used for domestic circuits?",o:["If one appliance fails all stop, and appliances need different currents","Series wiring uses too little wire","Series wiring makes the total resistance zero","Appliances only work in series"],h:"Remember the fairy lights.",s:"In series, one failure breaks the whole circuit, and the same current must flow through appliances that need very different currents."}],answers:[{src:"In-text Q1, p.185",q:"Draw a circuit: battery of three 2 V cells, 5 \u03A9, 8 \u03A9, 12 \u03A9 resistors and a plug key, all in series.",a:'Draw the battery (three cell symbols joined + to \u2212), then the plug key and the three zig-zag resistors one after another in a single loop. <span class="sym-inline" data-sym="battery"></span><br>Total: V = 6 V, Rs = 25 \u03A9.'},{src:"In-text Q2, p.185",q:"Add an ammeter and a voltmeter across the 12 \u03A9 resistor. What are the readings?",a:"Ammeter in series, voltmeter in parallel across 12 \u03A9.<br>I = 6 V / 25 \u03A9 = <b>0.24 A</b>; V\u2081\u2082 = 0.24 \xD7 12 = <b>2.88 V</b>."},{src:"In-text Q1, p.188",q:"Judge the equivalent resistance: (a) 1 \u03A9 and 10\u2076 \u03A9 in parallel, (b) 1 \u03A9, 10\xB3 \u03A9 and 10\u2076 \u03A9 in parallel.",a:"In parallel, Rp is less than the smallest resistance. (a) Rp \u2248 1 \u03A9 (just below: 0.999999 \u03A9). (b) Rp \u2248 1 \u03A9 (just below: about 0.999 \u03A9)."},{src:"In-text Q2, p.188",q:"Lamp 100 \u03A9, toaster 50 \u03A9, water filter 500 \u03A9 in parallel on 220 V. Resistance of an iron that takes as much current as all three, and its current?",a:"1/Rp = 1/100 + 1/50 + 1/500 = 16/500 \u2192 Rp = <b>31.25 \u03A9</b>.<br>I = 220 / 31.25 = <b>7.04 A</b>."},{src:"In-text Q3, p.188",q:"Advantages of connecting devices in parallel instead of series?",a:"(i) Each device gets the full supply voltage. (ii) Each device can draw the current it needs. (iii) If one device fails, the others keep working. (iv) Total resistance decreases."},{src:"In-text Q4, p.188",q:"How can 2 \u03A9, 3 \u03A9 and 6 \u03A9 give (a) 4 \u03A9, (b) 1 \u03A9?",a:"(a) 3 \u03A9 \u2225 6 \u03A9 = 2 \u03A9, then in series with 2 \u03A9 \u2192 <b>4 \u03A9</b>.<br>(b) All three in parallel: 1/2 + 1/3 + 1/6 = 1 \u2192 <b>1 \u03A9</b>."},{src:"In-text Q5, p.188",q:"Highest and lowest total resistance from 4 \u03A9, 8 \u03A9, 12 \u03A9, 24 \u03A9?",a:"(a) Highest \u2014 all in series: 4 + 8 + 12 + 24 = <b>48 \u03A9</b>.<br>(b) Lowest \u2014 all in parallel: 1/4 + 1/8 + 1/12 + 1/24 = 1/2 \u2192 <b>2 \u03A9</b>."},{src:"Exercise 1",q:"Wire R cut into 5 equal parts joined in parallel = R\u2032. Find R/R\u2032.",a:"Each part R/5; five in parallel: R\u2032 = R/25. R/R\u2032 = <b>25</b> \u2192 option <b>(d)</b>."},{src:"Exercise 9",q:"9 V battery with 0.2, 0.3, 0.4, 0.5 and 12 \u03A9 in series. Current through 12 \u03A9?",a:"Rs = 13.4 \u03A9; I = 9/13.4 \u2248 <b>0.67 A</b> (same in all, series)."},{src:"Exercise 10",q:"How many 176 \u03A9 resistors in parallel carry 5 A on 220 V?",a:"R needed = 220/5 = 44 \u03A9 = 176/n \u2192 n = <b>4</b>."},{src:"Exercise 11",q:"Three 6 \u03A9 resistors: get (i) 9 \u03A9, (ii) 4 \u03A9.",a:"(i) Two in parallel (3 \u03A9) + one in series = <b>9 \u03A9</b>.<br>(ii) Two in series (12 \u03A9) in parallel with the third: 12 \xD7 6 / 18 = <b>4 \u03A9</b>."},{src:"Exercise 13",q:"Hot plate, coils A and B of 24 \u03A9 each on 220 V: currents when used separately, in series, in parallel.",a:"Separately: 220/24 = <b>9.17 A</b>.<br>Series (48 \u03A9): 220/48 = <b>4.58 A</b>.<br>Parallel (12 \u03A9): 220/12 = <b>18.33 A</b>."},{src:"Exercise 18 (c)",q:"Why is the series arrangement not used for domestic circuits?",a:"If one appliance fails the whole circuit breaks; also the same current would flow through all, but appliances need widely different currents. Parallel wiring avoids both problems."},{src:"Example 11.9",q:"R\u2081=10, R\u2082=40 in parallel; R\u2083=30, R\u2084=20, R\u2085=60 in parallel; the two groups in series on 12 V.",a:"R\u2032 = 8 \u03A9, R\u2033 = 10 \u03A9, total = <b>18 \u03A9</b>; I = 12/18 = <b>0.67 A</b>."}]},{id:"heat",sec:"11.7",name:"Joule's Forge",short:"Heating Effect of Current",color:"#ff5f6d",intro:"In the Forge, current turns into heat! Crank the current, heat the water, and see why a tiny fuse wire is a big hero.",ideas:["In a purely resistive circuit all energy becomes heat. <b>Joule\u2019s law: H = I\xB2Rt</b>.","Heat \u221D I\xB2 (double the current \u2192 4\xD7 heat), \u221D R, and \u221D t.","A <b>fuse</b> is placed in series. Too much current melts its wire and breaks the circuit. A 1 kW iron on 220 V draws 4.54 A, so it needs a 5 A fuse."],quiz:[{t:"mcq",tag:"Concept",q:"Joule\u2019s law of heating is\u2026",o:["H = I\xB2Rt","H = IR\xB2t","H = It/R","H = V/It"],h:"Heat \u221D square of current.",s:"H = I\xB2Rt (Eq. 11.21), obtained from H = VIt using V = IR."},{t:"mcq",tag:"Concept",q:"If the current through a resistor is doubled (same R and t), the heat produced becomes\u2026",o:["4 times","2 times","Half","The same"],h:"H \u221D I\xB2.",s:"H \u221D I\xB2, so (2)\xB2 = 4 times."},{t:"num",tag:"In-text Q3 (p.190)",q:"An electric iron of resistance 20 \u03A9 takes a current of 5 A. Calculate the heat developed in 30 s.",a:15e3,u:"J",tol:1,h:"H = I\xB2Rt.",s:"H = 5\xB2 \xD7 20 \xD7 30 = <b>15 000 J (1.5 \xD7 10\u2074 J)</b>."},{t:"num",tag:"In-text Q2 (p.190)",q:"Compute the heat generated while transferring 96000 C of charge in one hour through a potential difference of 50 V. Give it in units of 10\u2076 J.",a:4.8,u:"\xD7 10\u2076 J",tol:.01,h:"H = VQ (= VIt).",s:"H = VQ = 50 \xD7 96000 = 4 800 000 J = <b>4.8 \xD7 10\u2076 J</b>."},{t:"num",tag:"Exercise 17",q:"An electric heater of resistance 44 \u03A9 draws 5 A from the mains for 2 hours. At what rate is heat developed (in watt)?",a:1100,u:"W",tol:1,h:"Rate of heat = P = I\xB2R.",s:"P = I\xB2R = 25 \xD7 44 = <b>1100 W</b> (1100 J every second)."},{t:"num",tag:"Example 11.11",q:"100 J of heat is produced each second in a 4 \u03A9 resistance. Find the potential difference across it.",a:20,u:"V",tol:.01,h:"First I = \u221A(H/Rt), then V = IR.",s:"I = \u221A(100/(4 \xD7 1)) = 5 A. V = IR = 5 \xD7 4 = <b>20 V</b>."},{t:"mcq",tag:"In-text Q1 (p.190)",q:"Why does the cord of an electric heater not glow while the heating element does?",o:["The cord (copper) has very low resistance, so little heat is produced in it","The cord carries less current than the element","The cord is cooled by air","The element is made of copper"],h:"Same current, but very different R. H = I\xB2Rt.",s:"The same current flows through both, but the element (alloy) has high resistance while the copper cord has very low resistance, so H = I\xB2Rt is much smaller in the cord."},{t:"mcq",tag:"Concept",q:"A fuse is connected\u2026",o:["In series with the device","In parallel with the device","Across the battery","Only in the earth wire"],h:"It must break the circuit of the device.",s:"The fuse is placed in series with the device so that melting it stops the current."},{t:"mcq",tag:"Concept",q:"A 1 kW electric iron works at 220 V. Which fuse should be used?",o:["5 A","1 A","3 A","2 A"],h:"I = P/V = 1000/220.",s:"I = 1000/220 = 4.54 A, so a <b>5 A</b> fuse must be used."},{t:"mcq",tag:"Concept",q:"Electric bulbs are usually filled with\u2026",o:["Nitrogen and argon (chemically inactive gases)","Oxygen","Hydrogen","Carbon dioxide"],h:"These gases prolong the life of the filament.",s:"Chemically inactive nitrogen and argon prolong the life of the filament."},{t:"mcq",tag:"Exercise 4",q:"Two identical wires are connected first in series and then in parallel across the same potential difference. Ratio of heat produced (series : parallel)?",o:["1 : 4","4 : 1","1 : 2","2 : 1"],h:"H = V\xB2t/R. Series 2R, parallel R/2.",s:"Hs/Hp = (R/2)/(2R) = 1/4 \u2192 <b>1 : 4</b>, option (c)."},{t:"tf",tag:"Concept",q:"In a purely resistive circuit, the energy from the source is dissipated entirely as heat.",a:!0,h:"This is the heating effect of electric current.",s:"True. A configuration of only resistors converts all the source energy into heat."},{t:"mcq",tag:"Concept",q:"Which of these devices is NOT mainly based on the heating effect of current?",o:["Electric fan","Electric iron","Electric toaster","Electric kettle"],h:"One of them uses most energy for rotating blades.",s:"In a fan, most energy goes into useful work (rotating blades); iron, toaster and kettle are based on Joule\u2019s heating."}],answers:[{src:"In-text Q1, p.190",q:"Why does the cord of an electric heater not glow while the heating element does?",a:"The same current flows through both. The heating element is an alloy with high resistance; the cord is copper with very low resistance. Since H = I\xB2Rt, much more heat is produced in the element, so it glows while the cord stays cool."},{src:"In-text Q2, p.190",q:"Heat generated while transferring 96000 C in 1 hour through 50 V.",a:"H = VQ = 50 \xD7 96000 = <b>4.8 \xD7 10\u2076 J</b>."},{src:"In-text Q3, p.190",q:"Iron of 20 \u03A9 takes 5 A. Heat in 30 s?",a:"H = I\xB2Rt = 25 \xD7 20 \xD7 30 = <b>1.5 \xD7 10\u2074 J</b>."},{src:"Exercise 4",q:"Two identical wires in series and then in parallel across the same V. Ratio of heat (series : parallel)?",a:"Rs = 2R, Rp = R/2. H = V\xB2t/R \u2192 Hs : Hp = (1/2R) : (2/R) = <b>1 : 4</b> \u2192 option <b>(c)</b>."},{src:"Exercise 17",q:"Heater 44 \u03A9 draws 5 A for 2 h. Rate of heat developed?",a:"P = I\xB2R = 25 \xD7 44 = <b>1100 W</b> (heat in 2 h = 1100 \xD7 7200 = 7.92 \xD7 10\u2076 J)."},{src:"Example 11.10",q:"An iron uses 840 W (max) and 360 W (min) at 220 V. Current and resistance?",a:"Max: I = 840/220 = 3.82 A, R = 57.60 \u03A9.<br>Min: I = 360/220 = 1.64 A, R = 134.15 \u03A9."},{src:"Section 11.7.1",q:"How does a fuse protect a circuit?",a:"It is placed in series. If the current exceeds its rating, the fuse wire heats up, melts and breaks the circuit. Domestic fuses: 1 A, 2 A, 3 A, 5 A, 10 A."}]},{id:"power",sec:"11.8",name:"Power House",short:"Electric Power",color:"#ffd23f",intro:"Welcome home! Switch on appliances, watch the meter disc spin, and work out the electricity bill \u2014 the way your family pays for energy.",ideas:["<b>P = VI = I\xB2R = V\xB2/R</b>. Unit: watt (W). 1 W = 1 V \xD7 1 A.","Energy = power \xD7 time. Commercial unit: <b>kilowatt hour (kWh)</b>, called a \u201Cunit\u201D. 1 kWh = 3.6 \xD7 10\u2076 J.","We pay for the <b>energy</b> used to move electrons \u2014 electrons are not used up!"],quiz:[{t:"mcq",tag:"Exercise 2",q:"Which of these does NOT represent electrical power?",o:["IR\xB2","I\xB2R","VI","V\xB2/R"],h:"Check the units of each.",s:"P = VI = I\xB2R = V\xB2/R. IR\xB2 is not power \u2014 option (b)."},{t:"mcq",tag:"Concept",q:"1 watt is the power used when\u2026",o:["1 A flows at a potential difference of 1 V","1 C flows in 1 s","1 J of work moves 1 C","1 kWh is used in 1 hour"],h:"1 W = 1 V \xD7 1 A.",s:"1 W = 1 V \xD7 1 A \u2014 the power used by a device carrying 1 A at 1 V."},{t:"num",tag:"Example 11.12",q:"A bulb on a 220 V generator draws 0.50 A. What is its power?",a:110,u:"W",tol:.5,h:"P = VI.",s:"P = 220 \xD7 0.50 = <b>110 W</b>."},{t:"num",tag:"Example 11.13",q:"A 400 W refrigerator runs 8 hours a day. Cost of energy for 30 days at Rs 3.00 per kWh?",a:288,u:"Rs",tol:.5,h:"Energy = 400 W \xD7 8 h \xD7 30 = ? Wh. Convert to kWh.",s:"Energy = 400 \xD7 8 \xD7 30 = 96 000 Wh = 96 kWh. Cost = 96 \xD7 3 = <b>Rs 288</b>."},{t:"num",tag:"In-text Q2 (p.192)",q:"An electric motor takes 5 A from a 220 V line. What is its power?",a:1100,u:"W",tol:.5,h:"P = VI.",s:"P = 220 \xD7 5 = <b>1100 W</b>."},{t:"num",tag:"In-text Q2 (p.192)",q:"How much energy does that 1100 W motor consume in 2 hours (in kWh)?",a:2.2,u:"kWh",tol:.01,h:"E = P \xD7 t = 1.1 kW \xD7 2 h.",s:"E = 1.1 kW \xD7 2 h = <b>2.2 kWh</b> = 7.92 \xD7 10\u2076 J."},{t:"mcq",tag:"Concept",q:"1 kilowatt hour (kWh) is equal to\u2026",o:["3.6 \xD7 10\u2076 J","3.6 \xD7 10\xB3 J","1000 J","3600 J"],h:"1000 W \xD7 3600 s.",s:"1 kWh = 1000 W \xD7 3600 s = 3.6 \xD7 10\u2076 J."},{t:"num",tag:"Exercise 3",q:"A bulb is rated 220 V, 100 W. What power does it consume when operated on 110 V?",a:25,u:"W",tol:.1,h:"R = V\xB2/P stays the same. Then P = V\xB2/R at 110 V.",s:"R = 220\xB2/100 = 484 \u03A9. P = 110\xB2/484 = <b>25 W</b> \u2014 option (d)."},{t:"num",tag:"Exercise 15",q:"A 100 W lamp and a 60 W lamp (both rated at 220 V) are in parallel on 220 V mains. What current is drawn? (2 decimal places)",a:.73,u:"A",tol:.01,h:"I = P/V for each, then add.",s:"I = 100/220 + 60/220 = 160/220 = <b>0.73 A</b>."},{t:"mcq",tag:"Exercise 16",q:"Which uses more energy: a 250 W TV in 1 hour, or a 1200 W toaster in 10 minutes?",o:["The 250 W TV in 1 hour","The 1200 W toaster in 10 minutes","Both use exactly the same","Cannot be compared"],h:"E = P \xD7 t. 10 min = 1/6 h.",s:"TV: 250 \xD7 1 = 250 Wh. Toaster: 1200 \xD7 1/6 = 200 Wh. The <b>TV</b> uses more."},{t:"num",tag:"Exercise 12",q:"How many 10 W, 220 V lamps can be connected in parallel across a 220 V line if the maximum allowable current is 5 A?",a:110,u:"lamps",tol:0,h:"Current of one lamp = 10/220 A.",s:"Each lamp: 10/220 = 1/22 A. n = 5 \xF7 (1/22) = <b>110 lamps</b>."},{t:"tf",tag:"More to Know",q:"Electrons are used up in an electric circuit, and that is what we pay the electricity board for.",a:!1,h:"Read the \u201CMore to Know\u201D box.",s:"False. Electrons are not consumed. We pay for the energy used to move electrons through our gadgets."},{t:"num",tag:"Example 11.10",q:"An iron uses 840 W at 220 V (maximum heating). What current does it draw? (2 decimal places)",a:3.82,u:"A",tol:.02,h:"I = P/V.",s:"I = 840/220 = <b>3.82 A</b> (and R = V/I = 57.6 \u03A9)."},{t:"mcq",tag:"In-text Q1 (p.192)",q:"What determines the rate at which energy is delivered by a current?",o:["Electric power, P = VI","The colour of the wire","The number of electrons used up","Only the length of the wire"],h:"Power is the rate of consumption of energy.",s:"The rate is the electric power P = VI (= I\xB2R = V\xB2/R)."}],answers:[{src:"In-text Q1, p.192",q:"What determines the rate at which energy is delivered by a current?",a:"Electric power: P = VI = I\xB2R = V\xB2/R. It is the product of the potential difference and the current."},{src:"In-text Q2, p.192",q:"A motor takes 5 A from 220 V. Find power and energy in 2 h.",a:"P = VI = 220 \xD7 5 = <b>1100 W</b>.<br>E = P \xD7 t = 1.1 kW \xD7 2 h = <b>2.2 kWh</b> = 7.92 \xD7 10\u2076 J."},{src:"Exercise 2",q:"Which does not represent electrical power: I\xB2R, IR\xB2, VI, V\xB2/R?",a:"<b>(b) IR\xB2</b>."},{src:"Exercise 3",q:"220 V, 100 W bulb operated on 110 V. Power?",a:"R = V\xB2/P = 220\xB2/100 = 484 \u03A9. P = 110\xB2/484 = <b>25 W</b> \u2192 option <b>(d)</b>."},{src:"Exercise 12",q:"10 W, 220 V lamps in parallel, max current 5 A. How many lamps?",a:"Current per lamp = 10/220 A. n = 5 \xD7 220/10 = <b>110 lamps</b>."},{src:"Exercise 14",q:"Power in 2 \u03A9: (i) 6 V battery with 1 \u03A9 and 2 \u03A9 in series; (ii) 4 V battery with 12 \u03A9 and 2 \u03A9 in parallel.",a:"(i) I = 6/3 = 2 A, P = I\xB2R = 4 \xD7 2 = <b>8 W</b>.<br>(ii) V across 2 \u03A9 = 4 V, P = V\xB2/R = 16/2 = <b>8 W</b>.<br>The power is the <b>same</b> in both."},{src:"Exercise 15",q:"100 W and 60 W lamps (220 V) in parallel on 220 V. Current drawn?",a:"I = (100 + 60)/220 = <b>0.73 A</b>."},{src:"Exercise 16",q:"250 W TV for 1 h or 1200 W toaster for 10 min \u2014 which uses more energy?",a:"TV: 250 Wh. Toaster: 1200 \xD7 (10/60) = 200 Wh. The <b>TV</b> uses more energy."},{src:"Example 11.13",q:"400 W fridge, 8 h/day, 30 days, Rs 3.00 per kWh. Cost?",a:"96 kWh \xD7 Rs 3 = <b>Rs 288</b>."}]}],rs={id:"boss",sec:"Final",name:"Overload Storm",short:"Boss Round",color:"#ff4fd8",intro:"A giant Overload Storm is circling the Power Tower! Answer correctly to fire lightning back at it. You have 3 hearts \u2014 stay sharp, engineer!"};var Fn={};Pi(Fn,{ACESFilmicToneMapping:()=>lo,AddEquation:()=>ps,AddOperation:()=>c0,AdditiveAnimationBlendMode:()=>bf,AdditiveBlending:()=>ui,AgXToneMapping:()=>hh,AlphaFormat:()=>mf,AlwaysCompare:()=>S0,AlwaysDepth:()=>Fl,AlwaysStencilFunc:()=>Xu,AmbientLight:()=>Jc,AnimationAction:()=>rh,AnimationClip:()=>gr,AnimationLoader:()=>bd,AnimationMixer:()=>kd,AnimationObjectGroup:()=>Od,AnimationUtils:()=>lM,ArcCurve:()=>Cc,ArrayCamera:()=>vc,ArrowHelper:()=>of,AttachedBindMode:()=>qu,Audio:()=>ih,AudioAnalyser:()=>Nd,AudioContext:()=>Sa,AudioListener:()=>Dd,AudioLoader:()=>Pd,AxesHelper:()=>af,BackSide:()=>Xt,BasicDepthPacking:()=>m0,BasicShadowMap:()=>Ag,BatchedMesh:()=>Sc,Bone:()=>ca,BooleanKeyframeTrack:()=>Ji,Box2:()=>Xd,Box3:()=>Yt,Box3Helper:()=>sf,BoxGeometry:()=>st,BoxHelper:()=>nf,BufferAttribute:()=>ut,BufferGeometry:()=>Ke,BufferGeometryLoader:()=>nh,ByteType:()=>df,Cache:()=>zi,Camera:()=>Qr,CameraHelper:()=>tf,CanvasTexture:()=>bs,CapsuleGeometry:()=>hr,CatmullRomCurve3:()=>so,CineonToneMapping:()=>ch,CircleGeometry:()=>Si,ClampToEdgeWrapping:()=>Kn,Clock:()=>Ss,Color:()=>fe,ColorKeyframeTrack:()=>xa,ColorManagement:()=>ht,CompressedArrayTextur
