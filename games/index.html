<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saurabh's EDUVERSE — Science Games</title>
<meta name="description" content="Free 3D science games for CBSE / NCERT Class 6 to 10, in English and all 22 Indian languages.">
<meta name="theme-color" content="#060c18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060c18;--panel:#0c1628;--line:#1b2b48;--cyan:#22e4ff;--amber:#ffb627;--text:#e8f1ff;--dim:#8ea3c4;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Exo 2','Noto Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#12315c55,transparent),radial-gradient(900px 500px at -10% 10%,#2a145055,transparent),var(--bg)}
a{color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:#060c18e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:Orbitron,sans-serif;font-weight:800;font-size:18px;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--cyan)}.logo i{font-style:normal;color:var(--amber)}
.tools{display:flex;gap:8px;align-items:center}
select,button,input{font:inherit;color:var(--text)}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;max-width:150px}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--amber);color:#1a1200}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.small{padding:7px 12px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.hero h1{font-family:Orbitron,sans-serif;font-size:clamp(22px,4.5vw,40px);margin:8px 0 4px;line-height:1.15}
.hero h1 span{color:var(--cyan)}
.hero p{color:var(--dim);margin:0 0 16px;font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;color:var(--dim)}
.tab.on{background:var(--cyan);color:#001a20;border-color:var(--cyan);font-weight:700}
.tab small{opacity:.7;margin-inline-start:4px}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#2f4f80}
.thumb{position:relative;aspect-ratio:16/10;background:#0a1222;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:#060c18d9;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:700;font-size:17px}
.topic{color:var(--dim);font-size:14px;line-height:1.35}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.acts a.btn{text-decoration:none}
.none{color:var(--dim);padding:40px 0;text-align:center}
h2{font-family:Orbitron,sans-serif;font-size:18px;margin:34px 0 12px;color:var(--amber)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lab{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lab .e{font-size:28px}
.off{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--amber);color:#1a1200;padding:8px 16px;border-radius:999px;font-weight:700}
body.offline .off{display:block}
footer{color:var(--dim);font-size:13px;text-align:center;padding:24px 16px 40px}
@media (max-width:520px){.logo{font-size:15px}.lang{max-width:120px}#install{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Saurabh's <b>EDU</b><i>VERSE</i></div>
  <div class="tools">
    <select id="lang" class="lang" aria-label="Language"></select>
    <button id="install" class="btn primary small" hidden></button>
  </div>
</header>
<main>
  <section class="hero">
    <h1>🎮 <span id="tag"></span></h1>
    <p id="sub">CBSE · NCERT</p>
  </section>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input id="q" class="search" type="search">
  </div>
  <div class="grid" id="grid"></div>
  <h2 id="labTitle"></h2>
  <div class="labs" id="labs"></div>
</main>
<div class="off" id="off"></div>
<footer>© Saurabh Sharma · Saurabh's EDUVERSE · Hanifa School, Borsad</footer>

<script src="catalog.js"></script>
<script src="i18n.js"></script>
<script>
(function(){
const G=window.EDU_GAMES,L=window.EDU_LANGS,TX=window.EDU_TEXT;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const CLASSES=[6,7,8,9,10];
let lang=store.get('eduLang')||pickLang(),cls=+store.get('eduCls')||0,query='';
const savedSet=new Set(JSON.parse(store.get('eduSaved')||'[]'));

function pickLang(){const codes=L.map(l=>l.code);for(const n of (navigator.languages||[navigator.language||'en'])){const c=(n||'').toLowerCase().split('-')[0];if(codes.includes(c))return c}return 'en'}
const t=k=>(TX[lang]&&TX[lang][k])||TX.en[k];
const topic=g=>g.topicText||(TX[lang].topics&&TX[lang].topics[g.topic])||TX.en.topics[g.topic]||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loadedFonts={};
function useFont(f){if(!f||loadedFonts[f])return;loadedFonts[f]=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f.replace(/ /g,'+')+'&display=swap';document.head.appendChild(l)}
const online=()=>/^https?:$/.test(location.protocol)&&!/^(localhost|127\.|192\.168\.)/.test(location.hostname);

$('lang').innerHTML=L.map(l=>`<option value="${l.code}">${l.name}</option>`).join('');
$('lang').onchange=e=>{lang=e.target.value;store.set('eduLang',lang);render()};

function render(){
  const info=L.find(l=>l.code===lang)||L[0];
  document.documentElement.lang=lang;document.documentElement.dir=info.dir;
  if(info.font){useFont(info.font);document.body.style.fontFamily=`'${info.font}','Exo 2',system-ui,sans-serif`}else document.body.style.fontFamily='';
  $('lang').value=lang;$('tag').textContent=t('tag');$('q').placeholder=t('search');
  $('install').textContent=t('install');$('labTitle').textContent='🔬 '+t('lab');$('off').textContent=t('offline');
  $('tabs').innerHTML=[0,...CLASSES.filter(c=>G.some(g=>g.cls===c))].map(c=>{const n=c?G.filter(g=>g.cls===c).length:G.length;
    return `<button class="tab${c===cls?' on':''}" data-c="${c}">${c?t('cls')+' '+c:t('all')}<small>${n}</small></button>`}).join('');
  const q=query.trim().toLowerCase();
  const list=G.filter(g=>(!cls||g.cls===cls)&&(!q||(g.title+' '+topic(g)+' '+TX.en.topics[g.topic]).toLowerCase().includes(q)));
  const info2=L.find(l=>l.code===lang);
  $('grid').innerHTML=list.length?list.map(g=>{
    const url=g.path+'/index.html';
    const tr=(lang!=='en'&&info2.gt&&online())?`<a class="btn ghost small" href="https://translate.google.com/translate?sl=en&tl=${info2.gt}&u=${encodeURIComponent(new URL(url,location.href).href)}" rel="noopener">🌐 ${esc(t('trans'))}</a>`:'';
    const sv=('serviceWorker' in navigator&&online())?`<button class="btn ghost small" data-save="${g.path}">${savedSet.has(g.path)?'✔ '+esc(t('saved')):'⬇ '+esc(t('save'))}</button>`:'';
    return `<article class="card">
      <a class="thumb" href="${url}"><img loading="lazy" src="${g.path}/thumbnail.webp" alt="${esc(g.title)}"><span class="badge">${esc(t('cls'))} ${g.cls}</span></a>
      <div class="body">
        <div class="title">${g.emoji||''} ${esc(g.title)}</div>
        <div class="topic">${g.ch?esc(t('ch'))+' '+g.ch+' · ':''}${esc(topic(g))}</div>
        <div class="acts"><a class="btn primary small" href="${url}">▶ ${esc(t('play'))}</a>${tr}${sv}</div>
      </div></article>`}).join(''):`<div class="none">${esc(t('none'))}</div>`;
  $('labs').innerHTML=window.EDU_LABS.map(l=>`<a class="lab" href="${l.url}"><span class="e">${l.emoji}</span><span>${esc(l.title)}</span></a>`).join('');
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;cls=+b.dataset.c;store.set('eduCls',cls);render()};
$('q').oninput=e=>{query=e.target.value;render()};

/* offline + install */
if('serviceWorker' in navigator&&online()){
  navigator.serviceWorker.register('../sw.js').catch(()=>{});
  $('grid').addEventListener('click',async e=>{const b=e.target.closest('[data-save]');if(!b)return;
    const g=G.find(x=>x.path===b.dataset.save);const files=[g.path+'/index.html',g.path+'/thumbnail.webp',...(g.files||[]).map(f=>g.path+'/'+f)].map(f=>new URL(f,location.href).href);
    b.disabled=true;b.textContent='⏳ 0%';const reg=await navigator.serviceWorker.ready;
    const onMsg=ev=>{if(!ev.data||ev.data.type!=='saveProgress')return;const p=Math.round(ev.data.done/ev.data.total*100);b.textContent='⏳ '+p+'%';
      if(ev.data.done===ev.data.total){navigator.serviceWorker.removeEventListener('message',onMsg);savedSet.add(g.path);store.set('eduSaved',JSON.stringify([...savedSet]));render()}};
    navigator.serviceWorker.addEventListener('message',onMsg);reg.active.postMessage({type:'saveAll',files})});
}
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true};
const setOff=()=>document.body.classList.toggle('offline',!navigator.onLine);addEventListener('online',setOff);addEventListener('offline',setOff);setOff();
render();
})();
</script>
</body>
</html>
